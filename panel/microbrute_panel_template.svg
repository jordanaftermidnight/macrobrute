<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420mm" height="120mm">
  <title>MACROBRUTE — MicroBrute Panel Drilling Template</title>
  <desc>
    Print at 100% scale. All dimensions in mm.
    OLED cutout: 33x17mm rectangular window.
    Encoder: 7mm hole. Button: 6mm. LEDs: 3mm.
    Toggle switches: 6.2mm. Mount with template taped to panel.
  </desc>

  <!-- Panel outline (approximate MicroBrute control panel area) -->
  <rect x="10" y="10" width="400" height="100" rx="3"
        fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="210" y="8" text-anchor="middle" font-size="4" fill="#666">
    MACROBRUTE Panel Drilling Template — Print at 100% (1:1 scale)
  </text>

  <!-- ============================================ -->
  <!-- SECTION A: OLED + ENCODER + BUTTON + LEDs    -->
  <!-- Location: Left side, logo/empty area         -->
  <!-- ============================================ -->

  <!-- OLED Window Cutout — 33mm x 17mm -->
  <!-- Position: ~25mm from left edge, centered vertically -->
  <rect x="25" y="35" width="33" height="17" rx="1"
        fill="none" stroke="red" stroke-width="0.4"/>
  <text x="41.5" y="33" text-anchor="middle" font-size="3" fill="red">OLED 33x17</text>
  <!-- Drill pilot holes at corners first, then cut with Dremel -->
  <circle cx="25" cy="35" r="0.5" fill="red"/>
  <circle cx="58" cy="35" r="0.5" fill="red"/>
  <circle cx="25" cy="52" r="0.5" fill="red"/>
  <circle cx="58" cy="52" r="0.5" fill="red"/>

  <!-- Encoder hole — 7mm diameter -->
  <!-- Position: 10mm right of OLED -->
  <circle cx="74" cy="43.5" r="3.5" fill="none" stroke="blue" stroke-width="0.3"/>
  <text x="74" y="56" text-anchor="middle" font-size="2.5" fill="blue">ENC 7mm</text>

  <!-- Red Button — 6mm hole -->
  <!-- Position: 10mm right of encoder -->
  <circle cx="90" cy="43.5" r="3" fill="none" stroke="blue" stroke-width="0.3"/>
  <text x="90" y="56" text-anchor="middle" font-size="2.5" fill="blue">BTN 6mm</text>

  <!-- LED 1 (Clock) — 3mm -->
  <circle cx="30" cy="60" r="1.5" fill="none" stroke="green" stroke-width="0.3"/>
  <text x="30" y="66" text-anchor="middle" font-size="2" fill="green">CLK</text>

  <!-- LED 2 (Gate) — 3mm -->
  <circle cx="41.5" cy="60" r="1.5" fill="none" stroke="green" stroke-width="0.3"/>
  <text x="41.5" y="66" text-anchor="middle" font-size="2" fill="green">GAT</text>

  <!-- LED 3 (Mode) — 3mm -->
  <circle cx="53" cy="60" r="1.5" fill="none" stroke="green" stroke-width="0.3"/>
  <text x="53" y="66" text-anchor="middle" font-size="2" fill="green">MOD</text>

  <!-- ============================================ -->
  <!-- SECTION B: CIRCUIT BENDING SWITCHES          -->
  <!-- Location: Various positions across panel     -->
  <!-- ============================================ -->

  <!-- Switch: Brute Factor Bypass — near volume knob area (right side) -->
  <circle cx="360" cy="45" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="360" y="55" text-anchor="middle" font-size="2.2" fill="purple">BF BYP</text>
  <text x="360" y="58" text-anchor="middle" font-size="1.8" fill="purple">6.2mm</text>

  <!-- Switch: VCA Drone — near envelope section -->
  <circle cx="320" cy="45" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="320" y="55" text-anchor="middle" font-size="2.2" fill="purple">DRONE</text>

  <!-- Switch: Sub Boost — near sub oscillator knob -->
  <circle cx="160" cy="35" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="160" y="30" text-anchor="middle" font-size="2.2" fill="purple">SUB+</text>

  <!-- Switch: Filter Input Starve — near filter section -->
  <circle cx="270" cy="35" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="270" y="30" text-anchor="middle" font-size="2.2" fill="purple">STARVE</text>

  <!-- ============================================ -->
  <!-- SECTION C: BODY-MOUNT JACKS (Optional)       -->
  <!-- 4 positions for key signals on body sides    -->
  <!-- ============================================ -->

  <!-- These go on the body side panels, not control panel -->
  <!-- Shown here for reference only -->
  <text x="210" y="80" text-anchor="middle" font-size="3" fill="#999">
    Body jacks (side panel — separate template needed):
  </text>
  <text x="210" y="85" text-anchor="middle" font-size="2.5" fill="#999">
    Env Out | LFO Out | Ultrasaw Out | PWM Out — all 6mm holes
  </text>

  <!-- ============================================ -->
  <!-- REFERENCE MARKS                              -->
  <!-- ============================================ -->

  <!-- Center cross for alignment -->
  <line x1="208" y1="55" x2="212" y2="55" stroke="#ccc" stroke-width="0.2"/>
  <line x1="210" y1="53" x2="210" y2="57" stroke="#ccc" stroke-width="0.2"/>

  <!-- Scale reference: 10mm bar -->
  <line x1="15" y1="105" x2="25" y2="105" stroke="black" stroke-width="0.3"/>
  <text x="20" y="103" text-anchor="middle" font-size="2" fill="black">10mm</text>

  <!-- Legend -->
  <rect x="300" y="85" width="100" height="22" fill="white" stroke="#ccc" stroke-width="0.2"/>
  <text x="305" y="91" font-size="2.2" fill="red">■ Red = Rectangular cutout</text>
  <text x="305" y="95" font-size="2.2" fill="blue">● Blue = Round drill hole</text>
  <text x="305" y="99" font-size="2.2" fill="green">● Green = LED hole (3mm)</text>
  <text x="305" y="103" font-size="2.2" fill="purple">● Purple = Toggle switch (6.2mm)</text>
</svg>
