<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420mm" height="120mm">
  <title>MACROBRUTE — MicroBrute Panel Drilling Template (revised)</title>
  <desc>
    Print at 100% scale. All dimensions in mm.
    REVISED: Main OLED + encoder + tap + RGB LEDs moved to expander.
    MB panel now hosts: strip OLED (0.91"), 3 toggles, 1 new Resonance CV jack,
    plus 6 brass touch bolts (separate side-panel template).
    The 3 insert jacks (VCF, Metalizer, VCA CV) and stock back-panel jacks
    (Sync In, Gate In, Audio In) are reused — see CONNECTION_MAP §4.
  </desc>

  <!-- Panel outline (approximate MicroBrute control panel area) -->
  <rect x="10" y="10" width="400" height="100" rx="3"
        fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="210" y="8" text-anchor="middle" font-size="4" fill="#666">
    MACROBRUTE — MicroBrute Panel Drilling Template — Print at 100% (1:1)
  </text>

  <!-- ============================================================ -->
  <!-- SECTION A: STRIP OLED (replaces "Microbrute" silkscreen text) -->
  <!-- 0.91" SSD1306 128x32. Module PCB ~38x12mm, glass area ~24x8mm. -->
  <!-- Position: top-left where the brand text sits.                  -->
  <!-- Cutout for glass: 24 x 8 mm, with 4 corner pilot holes.        -->
  <!-- ============================================================ -->
  <rect x="30" y="22" width="24" height="8" rx="0.5"
        fill="none" stroke="red" stroke-width="0.4"/>
  <text x="42" y="20" text-anchor="middle" font-size="2.6" fill="red">STRIP OLED 24×8</text>
  <text x="42" y="35" text-anchor="middle" font-size="1.8" fill="#888">0.91" SSD1306 @ 0x3D</text>
  <circle cx="30" cy="22" r="0.5" fill="red"/>
  <circle cx="54" cy="22" r="0.5" fill="red"/>
  <circle cx="30" cy="30" r="0.5" fill="red"/>
  <circle cx="54" cy="30" r="0.5" fill="red"/>

  <!-- ============================================================ -->
  <!-- SECTION B: RESONANCE CV INPUT (new 3.5mm jack)                -->
  <!-- 6mm hole, 10mm nut clearance. Position: above keyboard, near  -->
  <!-- existing wheel section. Wires internally to 2N3904 → vactrol  -->
  <!-- LED on the breakout PCB (not a DB-9 signal).                  -->
  <!-- ============================================================ -->
  <circle cx="90" cy="26" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="90" y="36" text-anchor="middle" font-size="2.5" fill="orange">RES CV</text>
  <text x="90" y="39" text-anchor="middle" font-size="1.8" fill="#888">6mm jack</text>

  <!-- ============================================================ -->
  <!-- SECTION C: TOGGLES (3 mods)                                   -->
  <!-- 6.2mm holes for SPDT mini-toggles                             -->
  <!-- ============================================================ -->

  <!-- Toggle: Brute Factor Bypass — near volume knob (right side) -->
  <circle cx="360" cy="45" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="360" y="55" text-anchor="middle" font-size="2.2" fill="purple">BF BYP</text>
  <text x="360" y="58" text-anchor="middle" font-size="1.6" fill="purple">6.2mm</text>

  <!-- Toggle: VCA Drone — near envelope section -->
  <circle cx="320" cy="45" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="320" y="55" text-anchor="middle" font-size="2.2" fill="purple">DRONE</text>
  <text x="320" y="58" text-anchor="middle" font-size="1.6" fill="purple">6.2mm</text>

  <!-- Toggle: Filter Input Starve — near filter section -->
  <circle cx="270" cy="35" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="270" y="30" text-anchor="middle" font-size="2.2" fill="purple">STARVE</text>
  <text x="270" y="42" text-anchor="middle" font-size="1.6" fill="purple">6.2mm</text>

  <!-- ============================================================ -->
  <!-- SECTION D: INSERT JACKS (3 pre-existing — VCF, METAL, VCA)    -->
  <!-- 6mm holes, 3.5mm Thonkiconn jacks                             -->
  <!-- ============================================================ -->
  <circle cx="180" cy="60" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="180" y="70" text-anchor="middle" font-size="2.2" fill="orange">VCF INS</text>

  <circle cx="200" cy="60" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="200" y="70" text-anchor="middle" font-size="2.2" fill="orange">METAL INS</text>

  <circle cx="220" cy="60" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="220" y="70" text-anchor="middle" font-size="2.2" fill="orange">VCA CV</text>

  <!-- ============================================================ -->
  <!-- SECTION E: TOUCH BOLTS (separate side-panel template)         -->
  <!-- 6 brass M3 bolts, 18-20mm spacing — see touch_test_board.svg  -->
  <!-- ============================================================ -->
  <text x="210" y="85" text-anchor="middle" font-size="2.6" fill="#888">
    Touch bolts (6× brass M3) — drilled on body side panels, not the control panel.
  </text>
  <text x="210" y="89" text-anchor="middle" font-size="2.2" fill="#888">
    See touch_test_board.svg for the 6-bolt cluster layout (PITCH/CRUNCH/WAH/DISTORT/HARM/GATE).
  </text>

  <!-- ============================================================ -->
  <!-- LEGEND + DIMENSIONS                                           -->
  <!-- ============================================================ -->
  <text x="210" y="100" text-anchor="middle" font-size="2.6" fill="#888">
    NOT ON MB PANEL: main OLED, encoder, tap button, RGB LED, clock I/O — all on expander.
  </text>
  <text x="210" y="104" text-anchor="middle" font-size="2.6" fill="#888">
    REUSED: stock MB back-panel Sync In, Gate In, Audio In — no new drilling for those.
  </text>

  <!-- Scale reference: 10mm bar -->
  <line x1="15" y1="115" x2="25" y2="115" stroke="black" stroke-width="0.3"/>
  <text x="20" y="113" text-anchor="middle" font-size="2" fill="black">10mm</text>

  <!-- Legend box -->
  <rect x="290" y="93" width="120" height="22" fill="white" stroke="#ccc" stroke-width="0.2"/>
  <text x="295" y="99" font-size="2.2" fill="red">■ Red = Rectangular cutout (strip OLED)</text>
  <text x="295" y="103" font-size="2.2" fill="orange">● Orange = 3.5mm jack (6mm hole)</text>
  <text x="295" y="107" font-size="2.2" fill="purple">● Purple = Toggle switch (6.2mm)</text>
  <text x="295" y="111" font-size="2.2" fill="#888">Touch bolts: separate side-panel template</text>
</svg>
