<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420mm" height="120mm">
  <title>MACROBRUTE — MicroBrute Panel Drilling Template (revised)</title>
  <desc>
    Print at 100% scale. All dimensions in mm.
    REVISED: Main OLED + encoder + tap + RGB LEDs moved to expander.
    MB panel now hosts: strip OLED (0.91"), 3 toggles, 1 new Resonance CV jack,
    plus 6 brass touch bolts (separate side-panel template).
    The 3 insert jacks (VCF, Metalizer, VCA CV) and stock back-panel jacks
    (Sync In, Gate In, Audio In) are reused — see CONNECTION_MAP §4.
  </desc>

  <!-- Panel outline (approximate MicroBrute control panel area) -->
  <rect x="10" y="10" width="400" height="100" rx="3"
        fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="210" y="8" text-anchor="middle" font-size="4" fill="#666">
    MACROBRUTE — MicroBrute Panel Drilling Template — Print at 100% (1:1)
  </text>

  <!-- ============================================================ -->
  <!-- SECTION A: STRIP OLED (replaces "Microbrute" silkscreen text) -->
  <!-- 0.91" SSD1306 128x32. Module PCB ~38x12mm, glass area ~24x8mm. -->
  <!-- Position: top-left where the brand text sits.                  -->
  <!-- Cutout for glass: 24 x 8 mm, with 4 corner pilot holes.        -->
  <!-- ============================================================ -->
  <rect x="30" y="22" width="24" height="8" rx="0.5"
        fill="none" stroke="red" stroke-width="0.4"/>
  <text x="42" y="20" text-anchor="middle" font-size="2.6" fill="red">STRIP OLED 24×8</text>
  <text x="42" y="35" text-anchor="middle" font-size="1.8" fill="#888">0.91" SSD1306 @ 0x3D</text>
  <circle cx="30" cy="22" r="0.5" fill="red"/>
  <circle cx="54" cy="22" r="0.5" fill="red"/>
  <circle cx="30" cy="30" r="0.5" fill="red"/>
  <circle cx="54" cy="30" r="0.5" fill="red"/>

  <!-- ============================================================ -->
  <!-- SECTION B: RESONANCE CV INPUT (new 3.5mm jack)                -->
  <!-- 6mm hole, 10mm nut clearance. Position: above keyboard, near  -->
  <!-- existing wheel section. Wires internally to 2N3904 → vactrol  -->
  <!-- LED on the breakout PCB (not a DB-9 signal).                  -->
  <!-- ============================================================ -->
  <circle cx="90" cy="26" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="90" y="36" text-anchor="middle" font-size="2.5" fill="orange">RES CV</text>
  <text x="90" y="39" text-anchor="middle" font-size="1.8" fill="#888">6mm jack</text>

  <!-- ============================================================ -->
  <!-- SECTION C: TOGGLES (3 mods)                                   -->
  <!-- 6.2mm holes for SPDT mini-toggles                             -->
  <!-- ============================================================ -->

  <!-- Toggle: Brute Factor Bypass — near volume knob (right side) -->
  <circle cx="360" cy="45" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="360" y="55" text-anchor="middle" font-size="2.2" fill="purple">BF BYP</text>
  <text x="360" y="58" text-anchor="middle" font-size="1.6" fill="purple">6.2mm</text>

  <!-- Toggle: VCA Drone — near envelope section -->
  <circle cx="320" cy="45" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="320" y="55" text-anchor="middle" font-size="2.2" fill="purple">DRONE</text>
  <text x="320" y="58" text-anchor="middle" font-size="1.6" fill="purple">6.2mm</text>

  <!-- Toggle: Filter Input Starve — near filter section -->
  <circle cx="270" cy="35" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="270" y="30" text-anchor="middle" font-size="2.2" fill="purple">STARVE</text>
  <text x="270" y="42" text-anchor="middle" font-size="1.6" fill="purple">6.2mm</text>

  <!-- ============================================================ -->
  <!-- SECTION D: INSERT JACKS (3 pre-existing — VCF, METAL, VCA)    -->
  <!-- 6mm holes, 3.5mm Thonkiconn jacks                             -->
  <!-- ============================================================ -->
  <circle cx="180" cy="60" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="180" y="70" text-anchor="middle" font-size="2.2" fill="orange">VCF INS</text>

  <circle cx="200" cy="60" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="200" y="70" text-anchor="middle" font-size="2.2" fill="orange">METAL INS</text>

  <circle cx="220" cy="60" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="220" y="70" text-anchor="middle" font-size="2.2" fill="orange">VCA CV</text>

  <!-- ============================================================ -->
  <!-- SECTION D2: PHASE 2 MOD ADDITIONS (M01–M14)                   -->
  <!-- 4 new jacks · 3 pots · 6 toggles · 2 brass bolts              -->
  <!-- See docs/mods/macrobrute_mod_catalog.md                       -->
  <!-- ============================================================ -->

  <!-- M03 sine out · M06 PWM CV (M09 normalled) · M04 metalizer CV · M12 ARG audio in -->
  <circle cx="240" cy="26" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="240" y="36" text-anchor="middle" font-size="2.2" fill="orange">SINE</text>
  <text x="240" y="22" text-anchor="middle" font-size="1.6" fill="#888">M03</text>

  <circle cx="260" cy="26" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="260" y="36" text-anchor="middle" font-size="2.2" fill="orange">PWM CV</text>
  <text x="260" y="22" text-anchor="middle" font-size="1.6" fill="#888">M06/M09</text>

  <circle cx="280" cy="26" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="280" y="36" text-anchor="middle" font-size="2.2" fill="orange">META CV</text>
  <text x="280" y="22" text-anchor="middle" font-size="1.6" fill="#888">M04</text>

  <circle cx="300" cy="26" r="3" fill="none" stroke="orange" stroke-width="0.4"/>
  <text x="300" y="36" text-anchor="middle" font-size="2.2" fill="orange">ARG IN</text>
  <text x="300" y="22" text-anchor="middle" font-size="1.6" fill="#888">M12</text>

  <!-- M04 META amount · M08 SUB mix · M12 ARG threshold (7mm pot holes) -->
  <circle cx="240" cy="80" r="3.5" fill="none" stroke="#0066CC" stroke-width="0.4"/>
  <text x="240" y="89" text-anchor="middle" font-size="2.0" fill="#0066CC">META AMT</text>
  <text x="240" y="92" text-anchor="middle" font-size="1.6" fill="#0066CC">M04 · 7mm pot</text>

  <circle cx="270" cy="80" r="3.5" fill="none" stroke="#0066CC" stroke-width="0.4"/>
  <text x="270" y="89" text-anchor="middle" font-size="2.0" fill="#0066CC">SUB MIX</text>
  <text x="270" y="92" text-anchor="middle" font-size="1.6" fill="#0066CC">M08 · 7mm pot</text>

  <circle cx="300" cy="80" r="3.5" fill="none" stroke="#0066CC" stroke-width="0.4"/>
  <text x="300" y="89" text-anchor="middle" font-size="2.0" fill="#0066CC">ARG THR</text>
  <text x="300" y="92" text-anchor="middle" font-size="1.6" fill="#0066CC">M12 · 7mm pot</text>

  <!-- 6 toggles for M02 / M05 / M07 / M08 / M10 / M13 (6.2mm SPDT/SPST) -->
  <circle cx="60" cy="90" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="60" y="100" text-anchor="middle" font-size="2.0" fill="purple">SOFT-SYNC</text>
  <text x="60" y="103" text-anchor="middle" font-size="1.6" fill="purple">M02</text>

  <circle cx="85" cy="90" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="85" y="100" text-anchor="middle" font-size="2.0" fill="purple">FIL-SO</text>
  <text x="85" y="103" text-anchor="middle" font-size="1.6" fill="purple">M05</text>

  <circle cx="110" cy="90" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="110" y="100" text-anchor="middle" font-size="2.0" fill="purple">PITCH-S</text>
  <text x="110" y="103" text-anchor="middle" font-size="1.6" fill="purple">M07</text>

  <circle cx="135" cy="90" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="135" y="100" text-anchor="middle" font-size="2.0" fill="purple">SUB EN</text>
  <text x="135" y="103" text-anchor="middle" font-size="1.6" fill="purple">M08</text>

  <circle cx="380" cy="90" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="380" y="100" text-anchor="middle" font-size="2.0" fill="purple">BF EXTREME</text>
  <text x="380" y="103" text-anchor="middle" font-size="1.6" fill="purple">M10</text>

  <circle cx="395" cy="60" r="3.1" fill="none" stroke="purple" stroke-width="0.3"/>
  <text x="395" y="70" text-anchor="middle" font-size="2.0" fill="purple">SYNC→ENV</text>
  <text x="395" y="73" text-anchor="middle" font-size="1.6" fill="purple">M13</text>

  <!-- 2 new brass bolts: M11 env-retrig + M14 bias-starve (6mm holes near touch cluster) -->
  <circle cx="155" cy="22" r="3" fill="none" stroke="#B87333" stroke-width="0.5"/>
  <text x="155" y="18" text-anchor="middle" font-size="1.8" fill="#B87333">M11 RETRIG</text>

  <circle cx="135" cy="22" r="3" fill="none" stroke="#B87333" stroke-width="0.5"/>
  <text x="135" y="18" text-anchor="middle" font-size="1.8" fill="#B87333">M14 BIAS</text>

  <!-- ============================================================ -->
  <!-- SECTION E: TOUCH BOLTS (separate side-panel template)         -->
  <!-- 6 brass M3 bolts, 18-20mm spacing — see touch_test_board.svg  -->
  <!-- ============================================================ -->
  <text x="210" y="85" text-anchor="middle" font-size="2.6" fill="#888">
    Touch bolts (6× brass M3) — drilled on body side panels, not the control panel.
  </text>
  <text x="210" y="89" text-anchor="middle" font-size="2.2" fill="#888">
    See touch_test_board.svg for the 6-bolt cluster layout (PITCH/CRUNCH/WAH/DISTORT/HARM/GATE).
  </text>

  <!-- ============================================================ -->
  <!-- LEGEND + DIMENSIONS                                           -->
  <!-- ============================================================ -->
  <text x="210" y="100" text-anchor="middle" font-size="2.6" fill="#888">
    NOT ON MB PANEL: main OLED, encoder, tap button, RGB LED, clock I/O — all on expander.
  </text>
  <text x="210" y="104" text-anchor="middle" font-size="2.6" fill="#888">
    REUSED: stock MB back-panel Sync In, Gate In, Audio In — no new drilling for those.
  </text>

  <!-- Scale reference: 10mm bar -->
  <line x1="15" y1="115" x2="25" y2="115" stroke="black" stroke-width="0.3"/>
  <text x="20" y="113" text-anchor="middle" font-size="2" fill="black">10mm</text>

  <!-- Legend box -->
  <rect x="290" y="93" width="120" height="26" fill="white" stroke="#ccc" stroke-width="0.2"/>
  <text x="295" y="99" font-size="2.0" fill="red">■ Red = Rectangular cutout (strip OLED)</text>
  <text x="295" y="103" font-size="2.0" fill="orange">● Orange = 3.5mm jack (6mm hole)</text>
  <text x="295" y="107" font-size="2.0" fill="#0066CC">● Blue = 9mm pot (7mm bushing)</text>
  <text x="295" y="111" font-size="2.0" fill="purple">● Purple = Toggle switch (6.2mm)</text>
  <text x="295" y="115" font-size="2.0" fill="#B87333">● Bronze = M3 brass touch bolt (6mm hole)</text>
</svg>
