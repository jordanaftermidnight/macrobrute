<?xml version="1.0" encoding="UTF-8"?>
<!--
  MACROBRUTE expander — 17HP Eurorack panel template (87 mm × 128.5 mm).
  All measurements in mm. 1 mm = 1 user-unit. Print at 100% / 1:1 scale.
  Drilling reference for the user's 87 mm pre-cut panel blank.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 87 128.5"
     width="87mm" height="128.5mm">

  <defs>
    <style>
      .panel    { fill: #1a1a1a; stroke: #444; stroke-width: 0.2; }
      .hole     { fill: none; stroke: #FF3030; stroke-width: 0.25; stroke-dasharray: 0.6 0.4; }
      .holefill { fill: none; stroke: #FF3030; stroke-width: 0.3; }
      .label    { font: bold 2.2px "SF Mono", Consolas, monospace; fill: #EEE; text-anchor: middle; }
      .sublbl   { font: 1.7px "SF Mono", Consolas, monospace; fill: #BBB; text-anchor: middle; }
      .title    { font: bold 3.5px "SF Mono", Consolas, monospace; fill: #FFF; text-anchor: middle; letter-spacing: 0.4px; }
      .dim      { font: 1.5px "SF Mono", Consolas, monospace; fill: #888; text-anchor: middle; }
      .legend   { font: 1.6px "SF Mono", Consolas, monospace; fill: #999; }
    </style>
  </defs>

  <!-- Panel background -->
  <rect class="panel" x="0" y="0" width="87" height="128.5"/>

  <!-- Eurorack mounting holes (M3, ~3.2mm). Standard 3U: 3mm from each long edge.
       Top: 3 mm down · Bottom: 125.5 mm down. -->
  <circle class="holefill" cx="4" cy="3" r="1.6"/>
  <circle class="holefill" cx="83" cy="3" r="1.6"/>
  <circle class="holefill" cx="4" cy="125.5" r="1.6"/>
  <circle class="holefill" cx="83" cy="125.5" r="1.6"/>

  <!-- Title strip -->
  <text class="title" x="43.5" y="9">MACROBRUTE</text>

  <!-- Main 0.96" SSD1306 OLED — module body ~27×27mm, glass area ~22×12mm.
       Cutout for glass: 22 × 12 mm centered horizontally, top edge ~16 mm.
       (SH1106 1.3" fallback: 28×17mm cutout. Verify your module's exact
        glass dimensions before drilling.) -->
  <rect class="hole" x="32.5" y="16" width="22" height="12" rx="0.5"/>
  <text class="sublbl" x="43.5" y="34">0.96" OLED 128×64 · SSD1306</text>

  <!-- Encoder (HW-040) — 7 mm bushing hole, centered horizontally, y ~46. -->
  <circle class="holefill" cx="35" cy="48" r="3.5"/>
  <text class="sublbl" x="35" y="56">ENC</text>

  <!-- Tap button — 6 mm hole, to the right of encoder. -->
  <circle class="holefill" cx="52" cy="48" r="3"/>
  <text class="sublbl" x="52" y="56">TAP</text>

  <!-- RGB LED — 5 mm hole, between encoder and tap (or right of tap). -->
  <circle class="holefill" cx="65" cy="48" r="2.5"/>
  <text class="sublbl" x="65" y="56">LED</text>

  <!-- Clock I/O — 2 jacks (3.5 mm Thonkiconn, 6 mm hole, 10 mm nut).
       y ~64 mm; centered around x=43.5 -->
  <circle class="holefill" cx="22" cy="65" r="3"/>
  <text class="sublbl" x="22" y="73">CLK→</text>
  <circle class="holefill" cx="65" cy="65" r="3"/>
  <text class="sublbl" x="65" y="73">←CLK</text>

  <!-- Clock divider outputs — /2 /4 /8 (firmware), 3 jacks evenly spaced.
       y ~80 mm, x = 17, 43.5, 70 -->
  <circle class="holefill" cx="17" cy="80" r="3"/>
  <text class="sublbl" x="17" y="88">/2</text>
  <circle class="holefill" cx="43.5" cy="80" r="3"/>
  <text class="sublbl" x="43.5" y="88">/4</text>
  <circle class="holefill" cx="70" cy="80" r="3"/>
  <text class="sublbl" x="70" y="88">/8</text>

  <!-- Slew limiter — IN, OUT jacks + RATE pot.
       y ~96 mm. IN at x=17, OUT at x=43.5, pot at x=70. -->
  <circle class="holefill" cx="17" cy="96" r="3"/>
  <text class="sublbl" x="17" y="104">SLW IN</text>
  <circle class="holefill" cx="43.5" cy="96" r="3"/>
  <text class="sublbl" x="43.5" y="104">SLW OUT</text>
  <circle class="holefill" cx="70" cy="96" r="3.5"/>      <!-- 7mm pot bushing -->
  <text class="sublbl" x="70" y="104">RATE</text>

  <!-- Programmable aux outs — 4 jacks at 15 mm pitch, centered.
       y ~112 mm. x = 14, 29, 44, 59, 74 (use 4: 21, 36, 51, 66) -->
  <circle class="holefill" cx="13.5" cy="112" r="3"/>
  <text class="sublbl" x="13.5" y="120">A1</text>
  <circle class="holefill" cx="33" cy="112" r="3"/>
  <text class="sublbl" x="33" y="120">A2</text>
  <circle class="holefill" cx="54" cy="112" r="3"/>
  <text class="sublbl" x="54" y="120">A3</text>
  <circle class="holefill" cx="73.5" cy="112" r="3"/>
  <text class="sublbl" x="73.5" y="120">A4</text>

  <!-- Footer dimensions -->
  <text class="dim" x="43.5" y="124">17HP · 87×128.5mm · CP1A power</text>

</svg>
