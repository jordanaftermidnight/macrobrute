<text x="100" y="454" class="label" font-size="10" fill="#D44">+3.3V</text>
<text x="170" y="454" class="value" font-size="9">From Pico 3V3 pin 36</text>
<circle cx="75" cy="479" r="10" fill="gold" stroke="#B8860B"/>
<text x="75" y="482" class="value" text-anchor="middle" font-size="9" fill="#1a1a1a" font-weight="bold">4</text>
<text x="100" y="482" class="label" font-size="10" fill="#1a1a1a">GND</text>
<text x="170" y="482" class="value" font-size="9">Star ground @ TP72</text>
<text x="260" y="505" class="value" text-anchor="middle" font-size="8" fill="#666">Pull-ups (4.7kΩ to 3.3V) on Pico side. Bus length &lt; 30cm at 100kHz.</text>
<rect x="500" y="330" width="580" height="190" fill="#F3E5F5" stroke="#6600CC" stroke-width="1.5" rx="4"/>
<text x="790" y="355" class="label" text-anchor="middle" font-size="12" fill="#6600CC">Daisy Seed Module (planned, separate build)</text>
<text x="515" y="377" class="value" font-size="9">• Cortex-M7 @ 480MHz · 64MB SDRAM · 32-bit audio DAC — basically a Eurorack DSP coprocessor.</text>
<text x="515" y="394" class="value" font-size="9">• Role: offloads heavy DSP from Pico (granular, reverb, pitch shift, wavetable synthesis).</text>
<text x="515" y="411" class="value" font-size="9">• Interface: I²C peripheral addressed at 0x42 by default (user-configurable in Daisy firmware).</text>
<text x="515" y="428" class="value" font-size="9">• Pico → Daisy: parameter messages (CV values, trigger events, mode changes) at ~100Hz.</text>
<text x="515" y="445" class="value" font-size="9">• Daisy → Pico: status, level metering, preset ACKs.</text>
<text x="515" y="462" class="value" font-size="9">• Audio: Daisy I/O goes to its OWN Eurorack jacks — audio does not pass through Pico or I²C.</text>
<text x="515" y="479" class="value" font-size="9">• Power: Daisy has own 3.3V/5V from its own Eurorack bus connection. I²C header shares only GND.</text>
<text x="515" y="496" class="value" font-size="9">• Address space: OLED 0x3C, Daisy 0x42, MPR121 (if added) 0x5A — no conflicts.</text>
<rect x="40" y="550" width="1040" height="130" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="560" y="572" class="label" text-anchor="middle" font-size="12">Current Budget (typical)</text>
<text x="55" y="595" class="value" font-size="9">• +12V: ~200mA total (noise 10mA · LFO 15mA · S&amp;H 20mA · slew 10mA · attenuverter 10mA · mult 20mA · plus LM78L05 ~30mA headroom = 115mA + margin)</text>
<text x="55" y="612" class="value" font-size="9">• -12V: ~80mA (op-amp negative rails only)</text>
<text x="55" y="629" class="value" font-size="9">• +5V: ~20mA (CD4024 logic + header pull-ups)</text>
<text x="55" y="646" class="value" font-size="9">• Combined draw: well within typical Eurorack PSU per-HP allocation. No separate supply needed.</text>
<text x="55" y="663" class="value" font-size="9">• I²C bus load: Pico I²C1 clocked at 100kHz · ~1 message per 10ms · negligible load</text></svg>