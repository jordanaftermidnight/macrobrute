<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M07 — Pitch CV Starve Toggle</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">SPDT introduces a current draw on the VCO pitch CV — drifty/glitchy pitch</text>
<text x="60" y="130" class="label" font-size="11">VCO pitch CV summing node</text>
<rect x="60" y="150" width="160" height="60" fill="#F0F0F5" stroke="#666" stroke-width="1.5" rx="4"/>
<text x="140" y="185" class="value" text-anchor="middle" font-size="10">Pitch summing</text>
<line x1="220" y1="180" x2="320" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="325" cy="180" r="3" fill="#1a1a1a"/>
<circle cx="355" cy="172" r="3" fill="#1a1a1a"/>
<line x1="325" y1="180" x2="352" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="355" cy="188" r="3" fill="#1a1a1a"/>
<text x="340" y="202" class="value" text-anchor="middle" font-size="8">Stable / Starve</text>
<line x1="355" y1="172" x2="420" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="430" y="176" class="value" font-size="9">A: stock (open)</text>
<line x1="355" y1="188" x2="420" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="445" y="234" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="460" y="243" class="value" text-anchor="middle" font-size="8">470Ω</text>
<line x1="475" y1="240" x2="540" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="540" y1="240" x2="540" y2="252" class="wire"/>
<line x1="530" y1="252" x2="550" y2="252" class="wire" stroke-width="2"/>
<line x1="534" y1="256" x2="546" y2="256" class="wire" stroke-width="1.5"/>
<text x="540" y="270" class="value" font-size="9">B: starved (current sink)</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× SPDT mini-toggle, 1× 470 Ω resistor</text>
<text x="55" y="563" class="value" font-size="9">• Position A: open — stock pitch CV behaviour</text>
<text x="55" y="578" class="value" font-size="9">• Position B: 470 Ω + LPC2361 DAC source impedance limits current to a few mA</text>
<text x="55" y="593" class="value" font-size="9">• Result: pitch slowly drifts low / becomes unstable while toggle is in B</text></svg>