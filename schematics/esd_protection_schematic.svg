<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" width="750" height="650">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="750" height="650" fill="#FEFEFE"/>
<text x="375" y="25" class="title" text-anchor="middle">CV Input ESD Protection</text>
<text x="375" y="42" class="subtitle" text-anchor="middle">Electrostatic Discharge Protection for External CV Inputs</text>
<text x="50" y="50" class="label" font-size="12">External CV Input</text>
<circle cx="80" cy="100" r="8" class="component"/>
<line x1="80" y1="100" x2="100" y2="100" class="wire"/>
<text x="80" y="122" class="label" text-anchor="middle">CV IN</text>
<line x1="100" y1="100" x2="150" y2="100" class="wire"/>
<text x="200" y="50" class="label" font-size="12" fill="#9C27B0">ESD Protection</text>
<text x="180" y="85" class="value" font-size="8">TVS</text>
<line x1="170" y1="100" x2="180" y2="100" stroke="#9C27B0" stroke-width="1.5"/>
<polygon points="180,85 180,115 200,100" fill="none" stroke="#9C27B0" stroke-width="1.5"/>
<line x1="200" y1="85" x2="200" y2="115" stroke="#9C27B0" stroke-width="1.5"/>
<polygon points="200,115 200,85 220,100" fill="none" stroke="#9C27B0" stroke-width="1.5"/>
<line x1="220" y1="85" x2="220" y2="115" stroke="#9C27B0" stroke-width="1.5"/>
<line x1="220" y1="100" x2="230" y2="100" stroke="#9C27B0" stroke-width="1.5"/>
<text x="200" y="130" class="value" font-size="7" text-anchor="middle">SMBJ12CA</text>
<line x1="200" y1="115" x2="200" y2="150" class="wire"/>
<line x1="200" y1="150" x2="200" y2="162" class="wire"/>
<line x1="190" y1="162" x2="210" y2="162" class="wire" stroke-width="2"/>
<line x1="194" y1="166" x2="206" y2="166" class="wire" stroke-width="1.5"/>
<line x1="230" y1="100" x2="280" y2="100" class="wire"/>
<path d="M285,100 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="310" y="82" class="label" text-anchor="middle">R1</text>
<text x="310" y="122" class="value" text-anchor="middle">10kΩ</text>
<line x1="330" y1="100" x2="360" y2="100" class="wire"/>
<text x="380" y="50" class="label" font-size="12">Voltage Clamping</text>
<line x1="360" y1="100" x2="360" y2="70" class="wire"/>
<line x1="360" y1="70" x2="420" y2="70" class="wire"/>
<polygon points="420,55 420,85 440,70" fill="none" stroke="#D44" stroke-width="1.5"/>
<line x1="440" y1="55" x2="440" y2="85" stroke="#D44" stroke-width="1.5"/>
<line x1="440" y1="70" x2="480" y2="70" class="wire"/>
<line x1="480" y1="70" x2="480" y2="58" class="wire" stroke="#D44" stroke-width="2"/>
<text x="484" y="64" class="value" fill="#D44">+12V</text>
<line x1="360" y1="100" x2="360" y2="130" class="wire"/>
<line x1="360" y1="130" x2="420" y2="130" class="wire"/>
<polygon points="440,115 440,145 420,130" fill="none" stroke="#44D" stroke-width="1.5"/>
<line x1="420" y1="115" x2="420" y2="145" stroke="#44D" stroke-width="1.5"/>
<line x1="420" y1="145" x2="420" y2="180" class="wire"/>
<line x1="420" y1="180" x2="480" y2="180" stroke="#44D" stroke-width="2"/>
<text x="490" y="183" class="value" fill="#44D" font-size="8">-12V</text>
<text x="550" y="50" class="label" font-size="12">To MicroBrute</text>
<line x1="360" y1="100" x2="550" y2="100" class="wire"/>
<rect x="560.0" y="80.0" width="80" height="40" class="component" fill="#f5f5f5"/>
<text x="600" y="100" class="label" text-anchor="middle">Filter</text>
<text x="600" y="112" class="value" text-anchor="middle">CV Input</text>
<text x="50" y="250" class="label" font-size="12">Multi-Channel ESD Protection (All CV Inputs)</text>
<text x="50" y="280" class="value" font-size="8">Filter CV</text>
<text x="150" y="280" class="value" font-size="8">→ DB-9 B Pin 1</text>
<text x="300" y="280" class="value" font-size="7">[TVS + 10kΩ + Clamp]</text>
<text x="50" y="310" class="value" font-size="8">VCA CV</text>
<text x="150" y="310" class="value" font-size="8">→ DB-9 B Pin 2</text>
<text x="300" y="310" class="value" font-size="7">[TVS + 10kΩ + Clamp]</text>
<text x="50" y="340" class="value" font-size="8">Resonance</text>
<text x="150" y="340" class="value" font-size="8">→ DB-9 B Pin 3</text>
<text x="300" y="340" class="value" font-size="7">[TVS + 10kΩ + Clamp]</text>
<text x="50" y="370" class="value" font-size="8">Sync</text>
<text x="150" y="370" class="value" font-size="8">→ DB-9 B Pin 4</text>
<text x="300" y="370" class="value" font-size="7">[TVS + 10kΩ + Clamp]</text>
<text x="50" y="400" class="value" font-size="8">Gate</text>
<text x="150" y="400" class="value" font-size="8">→ DB-9 B Pin 5</text>
<text x="300" y="400" class="value" font-size="7">[TVS + 10kΩ + Clamp]</text>
<rect x="50" y="440" width="650" height="190" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1" rx="4"/>
<text x="375" y="465" class="label" text-anchor="middle" fill="#4A148C">ESD Protection Component Details</text>
<text x="70" y="490" class="label" font-size="9" fill="#6A1B9A">TVS Diode:</text>
<text x="170" y="490" class="value" font-size="9">SMBJ12CA (12V bidirectional, 600W peak)</text>
<text x="70" y="510" class="label" font-size="9" fill="#6A1B9A">Series Resistor:</text>
<text x="170" y="510" class="value" font-size="9">10kΩ (limits current during ESD event)</text>
<text x="70" y="530" class="label" font-size="9" fill="#6A1B9A">Clamp Diodes:</text>
<text x="170" y="530" class="value" font-size="9">1N4148 or Schottky (BAT46)</text>
<text x="70" y="550" class="label" font-size="9" fill="#6A1B9A">Response Time:</text>
<text x="170" y="550" class="value" font-size="9">TVS: &lt;1ns, Diodes: &lt;4ns</text>
<text x="70" y="570" class="label" font-size="9" fill="#6A1B9A">Protection Level:</text>
<text x="170" y="570" class="value" font-size="9">IEC 61000-4-2 Level 4 (8kV contact, 15kV air)</text>
<text x="70" y="590" class="label" font-size="9" fill="#6A1B9A">Pass-through:</text>
<text x="170" y="590" class="value" font-size="9">Minimal effect on CV signals (10kΩ in series)</text></svg>