<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
<style>
  .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; }
  .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; }
  .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; }
  .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; }
  .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
</style>
<text x="300" y="22" class="title" text-anchor="middle">Manual Gate Button</text>
<text x="300" y="38" class="subtitle" text-anchor="middle">Momentary Switch + Schmitt Trigger Debounce</text>
<!-- +5V rail -->
<line x1="100" y1="60" x2="100" y2="80" stroke="#CC0000" stroke-width="2"/>
<text x="100" y="55" class="label" text-anchor="middle" fill="#CC0000" font-size="10">+5V</text>
<!-- Pull-up resistor -->
<line x1="100" y1="80" x2="100" y2="95" class="wire"/>
<path d="M100,95 l-6,5 l12,10 l-12,10 l12,10 l-12,10 l12,10 l-6,5" stroke="#333" stroke-width="1.5" fill="none"/>
<text x="120" y="125" class="value">10kΩ</text>
<text x="120" y="137" class="value" font-size="7">(pull-up)</text>
<line x1="100" y1="145" x2="100" y2="160" class="wire"/>
<!-- Junction point -->
<circle cx="100" cy="160" r="3" fill="#0066CC"/>
<!-- Switch to GND -->
<line x1="100" y1="160" x2="100" y2="185" class="wire"/>
<circle cx="100" cy="185" r="3" fill="#333"/>
<line x1="100" y1="195" x2="100" y2="210" stroke="#333" stroke-width="2"/>
<text x="130" y="200" class="label" font-size="9">SW (momentary)</text>
<line x1="100" y1="210" x2="100" y2="225" class="wire"/>
<!-- GND symbol -->
<line x1="90" y1="225" x2="110" y2="225" stroke="#333" stroke-width="2"/>
<line x1="93" y1="229" x2="107" y2="229" stroke="#333" stroke-width="1.5"/>
<line x1="96" y1="233" x2="104" y2="233" stroke="#333" stroke-width="1"/>
<text x="115" y="230" class="value">GND</text>
<!-- Signal to CD40106 -->
<line x1="100" y1="160" x2="220" y2="160" class="wire"/>
<text x="160" y="153" class="value" font-size="7">0V pressed / 5V released</text>
<!-- CD40106 Schmitt trigger -->
<polygon points="220,145 220,175 260,160" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- Inversion bubble -->
<circle cx="263" cy="160" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="230" y="160" class="value comp-label" fill="#FFF" font-size="6">!</text>
<text x="240" y="142" class="value" font-size="7">CD40106</text>
<text x="240" y="192" class="value" font-size="7">Schmitt</text>
<text x="240" y="202" class="value" font-size="7">Trigger</text>
<!-- Output -->
<line x1="267" y1="160" x2="340" y2="160" class="wire"/>
<!-- Output resistor -->
<path d="M340,160 l5,-6 l10,12 l-10,12 l10,12 l-10,12 l5,-6" stroke="#333" stroke-width="1.5" fill="none"/>
<text x="365" y="155" class="value">1kΩ</text>
<line x1="385" y1="160" x2="460" y2="160" class="wire"/>
<!-- Output jack -->
<circle cx="480" cy="160" r="12" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="480" cy="160" r="4" fill="#333"/>
<text x="480" y="145" class="label" text-anchor="middle" font-size="9">Gate Out</text>
<text x="480" y="185" class="value" text-anchor="middle" font-size="7">→ DB-9 B</text>
<!-- Optional second CD40106 stage for invert -->
<rect x="200" y="260" width="380" height="70" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="390" y="280" class="label" text-anchor="middle" fill="#E65100" font-size="9">Notes</text>
<text x="210" y="298" class="value" font-size="8">• Switch active-LOW: pressed = 0V, released = 5V (pulled up)</text>
<text x="210" y="313" class="value" font-size="8">• CD40106 inverts and debounces: output = 5V when pressed, 0V when released</text>
<text x="210" y="328" class="value" font-size="8">• 1kΩ output R protects against shorts. Debounce time ≈ 1-2ms via hysteresis.</text>
</svg>