<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M10 — Brute Factor Extreme Toggle</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">SPDT bypasses the internal limit R on the Brute Factor feedback path</text>
<text x="60" y="130" class="label" font-size="11">Brute Factor feedback loop</text>
<rect x="60" y="150" width="160" height="60" fill="#F0F0F5" stroke="#666" stroke-width="1.5" rx="4"/>
<text x="140" y="185" class="value" text-anchor="middle" font-size="10">BF feedback amp</text>
<line x1="220" y1="180" x2="280" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="305" y="174" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="320" y="183" class="value" text-anchor="middle" font-size="8">Rlim</text>
<line x1="335" y1="180" x2="420" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="435" cy="180" r="3" fill="#1a1a1a"/>
<circle cx="465" cy="172" r="3" fill="#1a1a1a"/>
<line x1="435" y1="180" x2="462" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="465" cy="188" r="3" fill="#1a1a1a"/>
<text x="450" y="202" class="value" text-anchor="middle" font-size="8">Tame / Extreme</text>
<line x1="465" y1="172" x2="540" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="550" y="176" class="value" font-size="9">B: stock (Rlim in circuit)</text>
<line x1="465" y1="188" x2="510" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="525" y="214" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="540" y="223" class="value" text-anchor="middle" font-size="8">1k safety</text>
<line x1="555" y1="220" x2="610" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="610" y1="220" x2="610" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="660" y="220" class="value" font-size="9">A: extreme (Rlim shorted)</text>
<line x1="610" y1="172" x2="700" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="710" y="176" class="label" font-size="10">→ feedback path</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× SPDT mini-toggle, 1× 1 kΩ inline (safety limiter for switching transients)</text>
<text x="55" y="563" class="value" font-size="9">• Position B: stock — Rlim in circuit, normal Brute Factor feedback</text>
<text x="55" y="578" class="value" font-size="9">• Position A: extreme — Rlim bypassed, feedback can self-oscillate / explode</text>
<text x="55" y="593" class="value" font-size="9">• Output level can spike. Panel-mark the 'extreme' position prominently.</text></svg>