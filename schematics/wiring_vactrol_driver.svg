<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 450" width="550" height="450">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 8px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="550" height="450" fill="#FEFEFE"/>
<text x="275" y="25" class="title" text-anchor="middle">Vactrol Driver</text>
<text x="275" y="42" class="subtitle" text-anchor="middle">LED Current Control for Resonance CV</text>
<text x="50" y="80" class="label">From DB-9 B Pin 3</text>
<line x1="80" y1="100" x2="130" y2="100" class="wire"/>
<path d="M140,100 l5,-8 l5,8 l5,-8 l5,8 l5,-8 l5,8" class="component"/>
<line x1="160" y1="70" x2="160" y2="90" class="wire"/>
<polygon points="160,90 156,82 164,82" class="filled"/>
<text x="160" y="65" class="label" text-anchor="middle">ATTEN</text>
<text x="160" y="120" class="value" text-anchor="middle">100k</text>
<line x1="160" y1="70" x2="160" y2="50" class="wire"/>
<line x1="160" y1="50" x2="160" y2="62" class="wire"/>
<line x1="150" y1="62" x2="170" y2="62" class="wire" stroke-width="2"/>
<line x1="154" y1="66" x2="166" y2="66" class="wire" stroke-width="1.5"/>
<polygon points="220,120 220,180 280,150" class="component"/>
<text x="250" y="155" class="label" text-anchor="middle" font-size="9">TL072</text>
<text x="217" y="132" class="pin" text-anchor="end">-</text>
<text x="217" y="168" class="pin" text-anchor="end">+</text>
<line x1="250" y1="120" x2="250" y2="110" class="component"/>
<text x="255" y="115" class="pin" font-size="7">V+</text>
<line x1="250" y1="180" x2="250" y2="190" class="component"/>
<text x="255" y="188" class="pin" font-size="7">V-</text>
<line x1="160" y1="100" x2="210" y2="148" class="wire"/>
<line x1="210" y1="152" x2="210" y2="250" class="wire"/>
<line x1="210" y1="250" x2="210" y2="262" class="wire"/>
<line x1="200" y1="262" x2="220" y2="262" class="wire" stroke-width="2"/>
<line x1="204" y1="266" x2="216" y2="266" class="wire" stroke-width="1.5"/>
<line x1="290" y1="150" x2="330" y2="150" class="wire"/>
<path d="M330,150 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="355" y="132" class="label" text-anchor="middle">Rlim</text>
<text x="355" y="172" class="value" text-anchor="middle">1kΩ</text>
<line x1="380" y1="150" x2="420" y2="150" class="wire"/>
<text x="440" y="140" class="label">Vactrol</text>
<text x="440" y="155" class="value" font-size="9">LED (RP13)</text>
<polygon points="430,140 430,160 450,150" fill="#D44" stroke="#333" stroke-width="1"/>
<line x1="450" y1="140" x2="450" y2="160" stroke="#333" stroke-width="2"/>
<line x1="450" y1="150" x2="480" y2="150" class="wire"/>
<text x="490" y="153" class="value" font-size="9">→ RP13</text>
<text x="275" y="320" class="value" text-anchor="middle">1kΩ limits LED current to ~5mA at full CV</text>
<text x="275" y="340" class="value" text-anchor="middle">Buffer ensures CV source sees high impedance</text></svg>