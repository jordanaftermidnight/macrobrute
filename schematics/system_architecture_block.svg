<text x="800" y="302" class="vl" font-size="6">LFO,S&H,Clock</text>
<line x1="720" y1="290" x2="720" y2="350" stroke="#4CAF50" stroke-width="4"/>
<line x1="720" y1="350" x2="450" y2="350" stroke="#4CAF50" stroke-width="4" marker-end="url(#arr)"/>
<line x1="320" y1="350" x2="260" y2="350" stroke="#FF5722" stroke-width="3"/>
<line x1="260" y1="350" x2="260" y2="335" stroke="#FF5722" stroke-width="3"/>
<line x1="260" y1="335" x2="160" y2="335" stroke="#FF5722" stroke-width="3" marker-end="url(#arr)"/>
<text x="210" y="327" class="vl" font-size="7">Filter CV</text>
<line x1="260" y1="350" x2="275" y2="350" stroke="#FF5722" stroke-width="3"/>
<line x1="275" y1="350" x2="275" y2="415" stroke="#FF5722" stroke-width="3"/>
<line x1="275" y1="415" x2="160" y2="415" stroke="#FF5722" stroke-width="3" marker-end="url(#arr)"/>
<text x="220" y="407" class="vl" font-size="7">VCA CV</text>
<line x1="450" y1="440" x2="650" y2="440" stroke="#CC0000" stroke-width="5"/>
<text x="550" y="430" class="bus-label" font-size="8" fill="#CC0000">POWER BUS ±12V</text>
<line x1="650" y1="440" x2="650" y2="165" stroke="#CC0000" stroke-width="5"/>
<line x1="650" y1="165" x2="880" y2="165" stroke="#CC0000" stroke-width="5" marker-end="url(#arr)"/>
<text x="750" y="455" class="vl" font-size="7" fill="#CC0000">Power to Expander</text>
<line x1="450" y1="535" x2="700" y2="535" stroke="#9C27B0" stroke-width="2" stroke-dasharray="5,3"/>
<line x1="700" y1="535" x2="700" y2="400" stroke="#9C27B0" stroke-width="2" stroke-dasharray="5,3"/>
<line x1="700" y1="400" x2="880" y2="400" stroke="#9C27B0" stroke-width="2" marker-end="url(#arr)"/>
<text x="620" y="527" class="vl" font-size="7">GPIO Control</text>
<line x1="450" y1="605" x2="750" y2="605" stroke="#673AB7" stroke-width="2" stroke-dasharray="5,3"/>
<line x1="750" y1="605" x2="750" y2="420" stroke="#673AB7" stroke-width="2" stroke-dasharray="5,3"/>
<line x1="750" y1="420" x2="880" y2="420" stroke="#673AB7" stroke-width="2" marker-end="url(#arr)"/>
<text x="620" y="617" class="vl" font-size="7">Touch Sense</text>
<rect x="50" y="650" width="1000" height="40" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="4"/>
<rect x="70" y="660" width="20" height="14" fill="#E91E63" stroke="#333" rx="2"/>
<text x="98" y="672" class="v" font-size="8">Audio Bus (Saw, Sqr, VCF, Mix)</text>
<rect x="270" y="660" width="20" height="14" fill="#9C27B0" stroke="#333" rx="2"/>
<text x="298" y="672" class="v" font-size="8">CV/Gate Bus (Pitch, LFO, Env, Gate)</text>
<rect x="470" y="660" width="20" height="14" fill="#FF9800" stroke="#333" rx="2"/>
<text x="498" y="672" class="v" font-size="8">DB-9 A → Expander</text>
<rect x="670" y="660" width="20" height="14" fill="#4CAF50" stroke="#333" rx="2"/>
<text x="698" y="672" class="v" font-size="8">Expander → DB-9 B</text>
<rect x="870" y="660" width="20" height="14" fill="#CC0000" stroke="#333" rx="2"/>
<text x="898" y="672" class="v" font-size="8">Power Bus (±12V, GND)</text>
</svg>