<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="600" height="500" fill="#FEFEFE"/>
<text x="300" y="25" class="title" text-anchor="middle">Sample & Hold</text>
<text x="300" y="42" class="subtitle" text-anchor="middle">LF398 with droop compensation</text>
<polygon points="120,120 120,180 180,150" class="component"/>
<text x="150" y="155" class="label" text-anchor="middle" font-size="9">Input Buffer</text>
<text x="117" y="132" class="pin" text-anchor="end">-</text>
<text x="117" y="168" class="pin" text-anchor="end">+</text>
<line x1="150" y1="120" x2="150" y2="110" class="component"/>
<text x="155" y="115" class="pin" font-size="7">V+</text>
<line x1="150" y1="180" x2="150" y2="190" class="component"/>
<text x="155" y="188" class="pin" font-size="7">V-</text>
<rect x="310.0" y="140.0" width="80" height="120" class="component" fill="#f5f5f5"/>
<text x="350" y="200" class="label" text-anchor="middle">LF398</text>
<text x="350" y="212" class="value" text-anchor="middle">S&amp;H</text>
<polygon points="470,220 470,280 530,250" class="component"/>
<text x="500" y="255" class="label" text-anchor="middle" font-size="9">Output</text>
<text x="467" y="232" class="pin" text-anchor="end">-</text>
<text x="467" y="268" class="pin" text-anchor="end">+</text>
<line x1="500" y1="220" x2="500" y2="210" class="component"/>
<text x="505" y="215" class="pin" font-size="7">V+</text>
<line x1="500" y1="280" x2="500" y2="290" class="component"/>
<text x="505" y="288" class="pin" font-size="7">V-</text>
<line x1="390" y1="200" x2="390" y2="350" class="wire"/>
<line x1="390" y1="325" x2="390" y2="346" class="wire"/>
<line x1="390" y1="354" x2="390" y2="375" class="wire"/>
<line x1="382" y1="346" x2="398" y2="346" class="component" stroke-width="2"/>
<line x1="382" y1="354" x2="398" y2="354" class="component" stroke-width="2"/>
<text x="376" y="342" class="value" fill="#D44">+</text>
<text x="370" y="345" class="label" text-anchor="end">C</text>
<text x="402" y="355" class="value" text-anchor="start">10nF</text>
<line x1="390" y1="400" x2="390" y2="412" class="wire"/>
<line x1="380" y1="412" x2="400" y2="412" class="wire" stroke-width="2"/>
<line x1="384" y1="416" x2="396" y2="416" class="wire" stroke-width="1.5"/>
<circle cx="50" cy="150" r="8" class="component"/>
<line x1="50" y1="150" x2="70" y2="150" class="wire"/>
<text x="50" y="172" class="label" text-anchor="middle">SIGNAL</text>
<line x1="58" y1="150" x2="120" y2="150" class="wire"/>
<circle cx="50" cy="300" r="8" class="component"/>
<line x1="50" y1="300" x2="70" y2="300" class="wire"/>
<text x="50" y="322" class="label" text-anchor="middle">CLOCK</text>
<line x1="58" y1="300" x2="310" y2="300" class="wire"/>
<line x1="310" y1="300" x2="310" y2="260" class="wire"/>
<circle cx="580" cy="250" r="8" class="component"/>
<line x1="580" y1="250" x2="600" y2="250" class="wire"/>
<text x="580" y="272" class="label" text-anchor="middle">OUTPUT</text>
<line x1="530" y1="250" x2="572" y2="250" class="wire"/></svg>