<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="950" height="650">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="950" height="650" fill="#FEFEFE"/>
<text x="475" y="25" class="title" text-anchor="middle">NXP LPC2361 Pinout (MACROBRUTE usage)</text>
<text x="475" y="42" class="subtitle" text-anchor="middle">100-LQFP ARM7TDMI-S — Stock Arturia firmware, Pico bridge via UART1</text>
<rect x="350" y="140" width="250" height="340" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" rx="8"/>
<circle cx="366" cy="156" r="4" fill="gold"/>
<text x="475.0" y="300.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="16">LPC2361</text>
<text x="475.0" y="320.0" class="value comp-label" text-anchor="middle" fill="#CCC" font-size="10">ARM7TDMI-S @ 72 MHz</text>
<text x="475.0" y="336.0" class="value" text-anchor="middle" fill="#AAA" font-size="9">128KB Flash · 34KB SRAM · 100-LQFP</text>
<circle cx="345" cy="170" r="3" fill="gold"/>
<line x1="345" y1="170" x2="270" y2="170" stroke="#44D" stroke-width="1.5"/>
<text x="265" y="168" class="label" text-anchor="end" font-size="10">P0.15 (pin 97)</text>
<text x="265" y="180" class="value" text-anchor="end" font-size="9" fill="#44D">TXD1 — UART1 TX</text>
<text x="265" y="192" class="value" text-anchor="end" font-size="8">→ Pico GP1 (RX) @ 115200</text>
<circle cx="345" cy="210" r="3" fill="gold"/>
<line x1="345" y1="210" x2="270" y2="210" stroke="#44D" stroke-width="1.5"/>
<text x="265" y="208" class="label" text-anchor="end" font-size="10">P0.16 (pin 96)</text>
<text x="265" y="220" class="value" text-anchor="end" font-size="9" fill="#44D">RXD1 — UART1 RX</text>
<text x="265" y="232" class="value" text-anchor="end" font-size="8">← Pico GP0 (TX) @ 115200</text>
<circle cx="605" cy="170" r="3" fill="gold"/>
<line x1="605" y1="170" x2="680" y2="170" stroke="#CC6600" stroke-width="1.5"/>
<text x="685" y="168" class="label" font-size="10">P2.10 (pin 53)</text>
<text x="685" y="180" class="value" font-size="9" fill="#CC6600">ISP ENTRY</text>
<text x="685" y="192" class="value" font-size="8">Pull LOW during reset → bootloader</text>
<circle cx="605" cy="230" r="3" fill="gold"/>
<line x1="605" y1="230" x2="680" y2="230" stroke="#D44" stroke-width="1.5"/>
<text x="685" y="228" class="label" font-size="10">Pin 17</text>
<text x="685" y="240" class="value" font-size="9" fill="#D44">nRESET</text>
<text x="685" y="252" class="value" font-size="8">Active-low system reset</text>
<circle cx="345" cy="300" r="3" fill="#888"/>
<line x1="345" y1="300" x2="270" y2="300" stroke="#888" stroke-width="1"/>
<text x="265" y="298" class="label" text-anchor="end" font-size="9" fill="#888">P0.2 (pin 98)</text>
<text x="265" y="310" class="value" text-anchor="end" font-size="8">TXD0 — stock — not used by bridge</text>
<circle cx="345" cy="330" r="3" fill="#888"/>
<line x1="345" y1="330" x2="270" y2="330" stroke="#888" stroke-width="1"/>
<text x="265" y="328" class="label" text-anchor="end" font-size="9" fill="#888">P0.3 (pin 99)</text>
<text x="265" y="340" class="value" text-anchor="end" font-size="8">RXD0 — stock — not used by bridge</text>
<rect x="50" y="500" width="850" height="120" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="475" y="520" class="label" text-anchor="middle" fill="#E65100" font-size="12">⚠ Undocumented Pin Usage — requires firmware RE</text>
<text x="70" y="540" class="value" font-size="9">• DAC output pin(s) for synth audio — search Ghidra labels for DACR writes</text>
<text x="70" y="555" class="value" font-size="9">• Keyboard matrix scan pins — stock firmware scans via GPIO (to be identified)</text>
<text x="70" y="570" class="value" font-size="9">• Panel encoder, buttons, mode LEDs — routed via port expander or direct GPIO (unknown)</text>
<text x="70" y="585" class="value" font-size="9">• MIDI UART (5-pin DIN @ 31250 baud) — may reuse UART0 or separate pins</text>
<text x="70" y="600" class="value" font-size="9">• Note: LPC2361 has CRP enabled. Firmware extraction blocked by Code Read Protection.</text>
<text x="475" y="120" class="anno" text-anchor="middle" font-size="10">Pico ↔ LPC bridge frames: 0xAA [msg_type] [counter] [len] [payload] ...</text></svg>