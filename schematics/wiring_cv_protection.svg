<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 500" width="550" height="500">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="550" height="500" fill="#FEFEFE"/>
<text x="275" y="25" class="title" text-anchor="middle">CV Input Protection</text>
<text x="275" y="42" class="subtitle" text-anchor="middle">BAT54S Schottky Clamping for DB-9 B Inputs</text>
<circle cx="50" cy="150" r="8" class="component"/>
<line x1="50" y1="150" x2="70" y2="150" class="wire"/>
<text x="50" y="172" class="label" text-anchor="middle">CV IN</text>
<line x1="70" y1="150" x2="120" y2="150" class="wire"/>
<path d="M70,150 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="95" y="172" class="value" text-anchor="middle">100kΩ</text>
<path d="M160,150 l5,-8 l5,8 l5,-8 l5,8 l5,-8 l5,8" class="component"/>
<line x1="180" y1="120" x2="180" y2="140" class="wire"/>
<polygon points="180,140 176,132 184,132" class="filled"/>
<text x="180" y="115" class="label" text-anchor="middle">ATTEN</text>
<text x="180" y="170" class="value" text-anchor="middle">100k</text>
<line x1="180" y1="120" x2="180" y2="100" class="wire"/>
<line x1="180" y1="100" x2="180" y2="112" class="wire"/>
<line x1="170" y1="112" x2="190" y2="112" class="wire" stroke-width="2"/>
<line x1="174" y1="116" x2="186" y2="116" class="wire" stroke-width="1.5"/>
<line x1="180" y1="180" x2="220" y2="180" class="wire"/>
<path d="M225,180 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="250" y="162" class="label" text-anchor="middle">Rs</text>
<text x="250" y="202" class="value" text-anchor="middle">10kΩ</text>
<line x1="280" y1="180" x2="320" y2="180" class="wire"/>
<circle cx="320" cy="180" r="3.5" class="junction"/>
<text x="350" y="140" class="label">BAT54S</text>
<text x="350" y="155" class="value" font-size="9">Dual Schottky</text>
<line x1="320" y1="180" x2="320" y2="120" class="wire"/>
<polygon points="310,110 310,130 330,120" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="330" y1="110" x2="330" y2="130" stroke="#333" stroke-width="1.5"/>
<line x1="320" y1="110" x2="320" y2="80" class="wire"/>
<text x="330" y="85" class="value" fill="#D84">+5V</text>
<line x1="320" y1="180" x2="320" y2="240" class="wire"/>
<polygon points="330,230 330,250 310,240" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="310" y1="230" x2="310" y2="250" stroke="#333" stroke-width="1.5"/>
<line x1="320" y1="250" x2="320" y2="280" class="wire"/>
<line x1="320" y1="280" x2="320" y2="292" class="wire"/>
<line x1="310" y1="292" x2="330" y2="292" class="wire" stroke-width="2"/>
<line x1="314" y1="296" x2="326" y2="296" class="wire" stroke-width="1.5"/>
<line x1="320" y1="180" x2="400" y2="180" class="wire"/>
<text x="410" y="183" class="value" font-size="9">→ MicroBrute</text>
<text x="275" y="350" class="value" text-anchor="middle">Clamps input to -0.3V / +5.3V</text>
<text x="275" y="370" class="value" text-anchor="middle">Protects MicroBrute from overvoltage</text></svg>