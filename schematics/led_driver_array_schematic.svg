<text x="450" y="170" class="value" font-size="9">All cathodes tied to</text>
<text x="450" y="185" class="value" font-size="9">Q1-Q2-Q3 collectors</text>
<rect x="50" y="320" width="550" height="180" fill="#F5F5F5" stroke="#666" stroke-width="1" rx="4"/>
<text x="325" y="345" class="label" text-anchor="middle">Component Values</text>
<text x="70" y="365" class="label" font-size="9">Q1-Q3:</text>
<text x="150" y="365" class="value" font-size="9">2N3904 NPN Transistor</text>
<text x="70" y="385" class="label" font-size="9">Rbase:</text>
<text x="150" y="385" class="value" font-size="9">470Ω (limits base current to ~5mA)</text>
<text x="70" y="405" class="label" font-size="9">Rpulldown:</text>
<text x="150" y="405" class="value" font-size="9">10kΩ (ensures OFF state)</text>
<text x="70" y="425" class="label" font-size="9">Rled:</text>
<text x="150" y="425" class="value" font-size="9">220Ω (LED current ~10mA)</text>
<text x="70" y="445" class="label" font-size="9">Vcc:</text>
<text x="150" y="445" class="value" font-size="9">+5V from Pico VSYS</text>
<text x="70" y="480" class="label" font-size="10">How it works:</text>
<text x="70" y="498" class="value" font-size="8">• GPIO HIGH → NPN ON → LED current flows → LED lights up</text>
<text x="70" y="513" class="value" font-size="8">• GPIO LOW → NPN OFF → No current → LED dark</text>
<text x="70" y="528" class="value" font-size="8">• 470Ω base resistor limits current into transistor base</text>
<text x="70" y="543" class="value" font-size="8">• 10kΩ pulldown ensures transistor stays OFF when GPIO floats</text></svg>