<rect x="30" y="570" width="1000" height="190" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="530" y="592" class="label" text-anchor="middle" fill="#E65100" font-size="12">Physical Location &amp; Assembly Notes</text>
<text x="45" y="612" class="value" font-size="9">• Rear board TPs (waveforms, gate, power): accessible with the case open — remove 4 screws + encoder knob. No panel disassembly needed.</text>
<text x="45" y="630" class="value" font-size="9">• Front board TPs (filter, CV): require lifting the front panel to access. Use a thin hooked probe.</text>
<text x="45" y="648" class="value" font-size="9">• TP26 (filter CV inject) is the designated mod point for external filter modulation — R67 (220kΩ) is the summing resistor.</text>
<text x="45" y="666" class="value" font-size="9">• TP72 is the ONLY ground point the mod taps. All GND returns (DB-9 A:9, DB-9 B:9, breakout, LED driver) converge here.</text>
<text x="45" y="684" class="value" font-size="9">• Touch bends breadboarded before final panel install — test all 8 candidates, select 6 based on musical effect (documented in touch_bend_specs.md).</text>
<text x="45" y="702" class="value" font-size="9">• After soldering taps, wrap each wire at the PCB exit with heatshrink + strain relief (hot-glue drop on stranded AWG24 or AWG22).</text>
<text x="45" y="720" class="value" font-size="9">• DO NOT tap TP1-TP4 on the rear board without the bend table — those are raw oscillator cores and short-circuiting will damage the LPC2361 DAC.</text>
<text x="45" y="738" class="value" font-size="9">• All TPs retain stock functionality — mods are non-destructive and reversible if wire is cut at the solder joint (no PCB traces cut).</text></svg>