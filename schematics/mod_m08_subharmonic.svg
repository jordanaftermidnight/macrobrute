<circle cx="276" cy="170.66666666666666" r="2.5" fill="gold"/>
<text x="272" y="173.66666666666666" class="value" text-anchor="end" font-size="8">CLK</text>
<circle cx="276" cy="197.33333333333334" r="2.5" fill="gold"/>
<text x="272" y="200.33333333333334" class="value" text-anchor="end" font-size="8">RST</text>
<circle cx="276" cy="224.0" r="2.5" fill="gold"/>
<text x="272" y="227.0" class="value" text-anchor="end" font-size="8">GND</text>
<circle cx="434" cy="144.0" r="2.5" fill="gold"/>
<text x="438" y="147.0" class="value" font-size="8">Q</text>
<circle cx="434" cy="170.66666666666666" r="2.5" fill="gold"/>
<text x="438" y="173.66666666666666" class="value" font-size="8">Q̄</text>
<circle cx="434" cy="197.33333333333334" r="2.5" fill="gold"/>
<text x="438" y="200.33333333333334" class="value" font-size="8">+5V</text>
<circle cx="434" cy="224.0" r="2.5" fill="gold"/>
<text x="438" y="227.0" class="value" font-size="8">PRE</text>
<line x1="434" y1="160" x2="480" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="480" y1="160" x2="480" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="480" y1="100" x2="240" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
