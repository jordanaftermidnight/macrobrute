<line x1="240" y1="144" x2="280" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="360" y="92" class="anno" text-anchor="middle" font-size="9">D ← Q̄ (toggles on every clock — /2 division)</text>
<line x1="434" y1="144" x2="500" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="500" y1="134" x2="500" y2="154" stroke="#1a1a1a" stroke-width="3"/>
<line x1="512" y1="134" x2="512" y2="154" stroke="#1a1a1a" stroke-width="3"/>
<text x="506" y="125" class="value" text-anchor="middle" font-size="8">1µF</text>
<line x1="512" y1="144" x2="560" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M590,144 l5,-8 l5,8 l5,-8 l5,8 l5,-8 l5,8" class="component"/>
<line x1="610" y1="114" x2="610" y2="134" class="wire"/>
<polygon points="610,134 606,126 614,126" class="filled"/>
<text x="610" y="109" class="label" text-anchor="middle">Mix</text>
<text x="610" y="164" class="value" text-anchor="middle">10k</text>
<line x1="640" y1="144" x2="720" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="730" y="148" class="label" font-size="10">→ pre-VCF mixer</text>
<circle cx="575" cy="320" r="3" fill="#1a1a1a"/>
<circle cx="605" cy="312" r="3" fill="#1a1a1a"/>
<line x1="575" y1="320" x2="602" y2="312" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="605" cy="328" r="3" fill="#1a1a1a"/>
<text x="590" y="342" class="value" text-anchor="middle" font-size="8">Sub Enable</text>
<line x1="575" y1="320" x2="500" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="490" y="324" class="value" text-anchor="end" font-size="9">SPDT in series with mix tap</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× 74HC74 dual D-flip-flop, 1× 10 kΩ mix pot, 1× SPDT enable, 4× 0.1 µF decouple, 1× 1 µF AC-couple</text>
<text x="55" y="563" class="value" font-size="9">• Schmitt buffer reuses a spare CD40106 gate (already on the breakout)</text>
<text x="55" y="578" class="value" font-size="9">• Generates a square wave one octave below the source — gritty bass enhancement</text>
<text x="55" y="593" class="value" font-size="9">• Pair with T6 (gate feedback touch bolt) for big metallic textures</text>
<text x="55" y="608" class="value" font-size="9">• Stripboard: schematics/mod_m08_subharmonic_stripboard.svg</text></svg>