<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M13 — VCO Sync to Envelope (toggle)</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">SPDT routes envelope decay edge to the VCO sync input</text>
<text x="60" y="130" class="label" font-size="11">External sync jack</text>
<line x1="60" y1="180" x2="200" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="215" cy="180" r="3" fill="#1a1a1a"/>
<circle cx="245" cy="172" r="3" fill="#1a1a1a"/>
<line x1="215" y1="180" x2="242" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="245" cy="188" r="3" fill="#1a1a1a"/>
<text x="230" y="202" class="value" text-anchor="middle" font-size="8">Ext / Env</text>
<line x1="245" y1="172" x2="640" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="430" y="164" class="anno" text-anchor="middle" font-size="9">A: external sync (stock)</text>
<line x1="245" y1="188" x2="320" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="320" y1="240" x2="380" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="380" y1="230" x2="380" y2="250" stroke="#1a1a1a" stroke-width="3"/>
<line x1="392" y1="230" x2="392" y2="250" stroke="#1a1a1a" stroke-width="3"/>
<text x="386" y="220" class="value" text-anchor="middle" font-size="8">100nF</text>
<line x1="392" y1="240" x2="440" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="455" y="234" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="470" y="243" class="value" text-anchor="middle" font-size="8">10k</text>
<line x1="485" y1="240" x2="540" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="540" y1="240" x2="540" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="290" y="270" class="anno" font-size="9">B: env decay → HPF edge → VCO sync</text>
<text x="650" y="176" class="label" font-size="10">→ VCO sync</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× SPDT mini-toggle, 1× 100 nF + 1× 10 kΩ (edge-shaper)</text>
<text x="55" y="563" class="value" font-size="9">• Position A: external sync jack feeds VCO sync (stock)</text>
<text x="55" y="578" class="value" font-size="9">• Position B: envelope decay → high-pass → produces a sync edge on each note end</text>
<text x="55" y="593" class="value" font-size="9">• Replicates a classic patch (env → VCO sync) without using a cable</text></svg>