<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="960" height="620" fill="#FEFEFE"/>
<text x="480" y="25" class="title" text-anchor="middle">M12 — ARG (Audio-Rate Gate)</text>
<text x="480" y="42" class="subtitle" text-anchor="middle">Audio in → LM393 comparator → gate at zero-crossings</text>
<circle cx="80" cy="200" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="80" cy="200" r="5" fill="#1a1a1a"/>
<text x="80" y="178" class="label" text-anchor="middle" font-size="10">AUDIO IN</text>
<line x1="100" y1="200" x2="180" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="180" y1="190" x2="180" y2="210" stroke="#1a1a1a" stroke-width="3"/>
<line x1="192" y1="190" x2="192" y2="210" stroke="#1a1a1a" stroke-width="3"/>
<text x="186" y="180" class="value" text-anchor="middle" font-size="8">100nF</text>
<line x1="192" y1="200" x2="260" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="280" y="160" width="150" height="90" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" rx="3"/>
<circle cx="288" cy="168" r="3" fill="gold"/>
<text x="355.0" y="205.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="11">LM393</text>
<circle cx="276" cy="174.0" r="2.5" fill="gold"/>
<text x="272" y="177.0" class="value" text-anchor="end" font-size="8">IN+</text>
<circle cx="276" cy="209.0" r="2.5" fill="gold"/>
<text x="272" y="212.0" class="value" text-anchor="end" font-size="8">IN-</text>
<circle cx="276" cy="244.0" r="2.5" fill="gold"/>
<text x="272" y="247.0" class="value" text-anchor="end" font-size="8">GND</text>
<circle cx="434" cy="174.0" r="2.5" fill="gold"/>
<text x="438" y="177.0" class="value" font-size="8">OUT</text>
<circle cx="434" cy="209.0" r="2.5" fill="gold"/>
<text x="438" y="212.0" class="value" font-size="8">+5V</text>
<circle cx="434" cy="244.0" r="2.5" fill="gold"/>
<text x="438" y="247.0" class="value" font-size="8"></text>
<line x1="260" y1="200" x2="280" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M200,320 l5,-8 l5,8 l5,-8 l5,8 l5,-8 l5,8" class="component"/>
<line x1="220" y1="290" x2="220" y2="310" class="wire"/>
<polygon points="220,310 216,302 224,302" class="filled"/>
<text x="220" y="285" class="label" text-anchor="middle">Threshold</text>
<text x="220" y="340" class="value" text-anchor="middle">100k</text>
<line x1="220" y1="290" x2="220" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="220" y1="200" x2="280" y2="208" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="454" y="235" width="12" height="30" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="472" y="253" class="value" font-size="8">10k</text>
<text x="490" y="208" class="value" font-size="8">+5V pull-up</text>
<line x1="430" y1="180" x2="640" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="650" y="184" class="label" font-size="10">→ Gate input (env / aux out)</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× LM393 dual comparator, 1× 100 kΩ threshold pot, 1× 10 kΩ pull-up to +5 V, 1× 100 nF DC-block, 1× 6 mm jack</text>
<text x="55" y="563" class="value" font-size="9">• Audio crosses the threshold → comparator output snaps low → gate edge</text>
<text x="55" y="578" class="value" font-size="9">• LM393's natural ~few-mV hysteresis gives clean edges; tune threshold pot to reject quiet content</text>
<text x="55" y="593" class="value" font-size="9">• Use case: trigger envelope from kick drum, vocal, anything</text>
<text x="55" y="608" class="value" font-size="9">• Stripboard: schematics/mod_m12_arg_stripboard.svg</text></svg>