<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
<defs>
  <filter id="ts">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="d"/>
    <feComposite in="bg" in2="d" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#666"/>
  </marker>
</defs>
<style>
  .t { font: bold 16px sans-serif; fill: #1a1a1a; filter: url(#ts); }
  .st { font: 11px sans-serif; fill: #555; filter: url(#ts); }
  .l { font: bold 10px sans-serif; fill: #1a1a1a; filter: url(#ts); }
  .v { font: 9px sans-serif; fill: #555; filter: url(#ts); }
  .sl { font: bold 9px sans-serif; fill: #FFF; text-anchor: middle; }
</style>
<rect width="1000" height="650" fill="#FEFEFE"/>
<text x="500" y="25" class="t" text-anchor="middle">Signal Flow Overview</text>
<text x="500" y="45" class="st" text-anchor="middle">MicroBrute → Breakout → Expander</text>
<text x="150" y="70" class="l" text-anchor="middle" font-size="11" fill="#2196F3">MICROBRUTE</text>
<text x="400" y="70" class="l" text-anchor="middle" font-size="11" fill="#FF9800">BREAKOUT</text>
<text x="650" y="70" class="l" text-anchor="middle" font-size="11" fill="#4CAF50">DB-9</text>
<text x="850" y="70" class="l" text-anchor="middle" font-size="11" fill="#9C27B0">EXPANDER</text>
<rect x="50" y="90" width="200" height="350" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="4"/>
<text x="150" y="110" class="l" text-anchor="middle" font-size="10" fill="#333">Test Points</text>
<text x="70" y="130" class="v" text-anchor="start" font-size="8" fill="#0066CC">TP94 Saw</text>
<circle cx="230" cy="127" r="3" fill="#0066CC"/>
<text x="70" y="155" class="v" text-anchor="start" font-size="8" fill="#0066CC">TP93 Square</text>
<circle cx="230" cy="152" r="3" fill="#0066CC"/>
<text x="70" y="180" class="v" text-anchor="start" font-size="8" fill="#0066CC">TP30 Mix</text>
<circle cx="230" cy="177" r="3" fill="#0066CC"/>
<text x="70" y="205" class="v" text-anchor="start" font-size="8" fill="#0066CC">TP19 VCF</text>
<circle cx="230" cy="202" r="3" fill="#0066CC"/>
<text x="70" y="230" class="v" text-anchor="start" font-size="8" fill="#0066CC">TP124 Triangle</text>
<circle cx="230" cy="227" r="3" fill="#0066CC"/>
<text x="70" y="260" class="v" text-anchor="start" font-size="8" fill="#009933">TP83 Gate</text>
<circle cx="230" cy="257" r="3" fill="#009933"/>
<text x="70" y="285" class="v" text-anchor="start" font-size="8" fill="#CC6600">Pitch CV</text>
<circle cx="230" cy="282" r="3" fill="#CC6600"/>
<text x="70" y="310" class="v" text-anchor="start" font-size="8" fill="#CC6600">Envelope</text>
<circle cx="230" cy="307" r="3" fill="#CC6600"/>
<text x="70" y="335" class="v" text-anchor="start" font-size="8" fill="#CC6600">LFO</text>
<circle cx="230" cy="332" r="3" fill="#CC6600"/>
<text x="70" y="380" class="v" text-anchor="start" font-size="8" fill="#CC0000">+12V / -12V / GND</text>
<circle cx="230" cy="377" r="3" fill="#CC0000"/>
<rect x="300" y="90" width="180" height="350" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="4"/>
<text x="390" y="110" class="l" text-anchor="middle" font-size="10" fill="#333">Signal Processing</text>
<text x="320" y="140" class="v" text-anchor="start" font-size="8" fill="#333">TL074 A-D: Audio buffers</text>
<text x="320" y="170" class="v" text-anchor="start" font-size="8" fill="#333">TL072: Env/LFO/Triangle</text>
<text x="320" y="200" class="v" text-anchor="start" font-size="8" fill="#333">CD40106: Gate conditioning</text>
<text x="320" y="230" class="v" text-anchor="start" font-size="8" fill="#333">Direct: Pitch CV</text>
<text x="320" y="260" class="v" text-anchor="start" font-size="8" fill="#333">Attenuverters: CV inputs</text>
<text x="320" y="290" class="v" text-anchor="start" font-size="8" fill="#333">Vactrol driver: Resonance</text>
<text x="320" y="320" class="v" text-anchor="start" font-size="8" fill="#333">LED drivers: RGB status</text>
<text x="320" y="370" class="v" text-anchor="start" font-size="8" fill="#333">Power Distribution:</text>
<text x="320" y="390" class="v" text-anchor="start" font-size="8" fill="#333">±12V, +5V, GND</text>
<rect x="520" y="90" width="150" height="160" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="4"/>
<text x="595" y="110" class="l" text-anchor="middle" font-size="9" fill="#333">DB-9 A (Outputs)</text>
<text x="540" y="135" class="v" text-anchor="start" font-size="7" fill="#333">1: Gate</text>
<text x="540" y="153" class="v" text-anchor="start" font-size="7" fill="#333">2: Pitch</text>
<text x="540" y="171" class="v" text-anchor="start" font-size="7" fill="#333">3: Env</text>
<text x="540" y="189" class="v" text-anchor="start" font-size="7" fill="#333">4: LFO</text>
<text x="540" y="207" class="v" text-anchor="start" font-size="7" fill="#333">5: Mix</text>
<text x="540" y="225" class="v" text-anchor="start" font-size="7" fill="#333">6: VCF</text>
<text x="540" y="243" class="v" text-anchor="start" font-size="7" fill="#333">7: Saw</text>
<text x="540" y="261" class="v" text-anchor="start" font-size="7" fill="#333">8: Square</text>
<rect x="520" y="270" width="150" height="170" fill="#FBE9E7" stroke="#FF5722" stroke-width="2" rx="4"/>
<text x="595" y="290" class="l" text-anchor="middle" font-size="9" fill="#333">DB-9 B (Inputs)</text>
<text x="540" y="315" class="v" text-anchor="start" font-size="7" fill="#333">1: Filter CV</text>
<text x="540" y="330" class="v" text-anchor="start" font-size="7" fill="#333">2: VCA CV</text>
<text x="540" y="345" class="v" text-anchor="start" font-size="7" fill="#333">3: Resonance</text>
<text x="540" y="360" class="v" text-anchor="start" font-size="7" fill="#333">4: Sync</text>
<text x="540" y="375" class="v" text-anchor="start" font-size="7" fill="#333">5: Gate In</text>
<text x="540" y="390" class="v" text-anchor="start" font-size="7" fill="#333">6: Ext Audio</text>
<text x="540" y="405" class="v" text-anchor="start" font-size="7" fill="#333">7: +12V</text>
<text x="540" y="420" class="v" text-anchor="start" font-size="7" fill="#333">8: -12V</text>
<text x="540" y="435" class="v" text-anchor="start" font-size="7" fill="#333">9: GND</text>
<rect x="720" y="90" width="250" height="350" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="4"/>
<text x="845" y="110" class="l" text-anchor="middle" font-size="10" fill="#333">Expander Modules</text>
<text x="740" y="140" class="v" text-anchor="start" font-size="8" fill="#333">Noise Generator → Noise Out</text>
<text x="740" y="165" class="v" text-anchor="start" font-size="8" fill="#333">LFO → Saw Out / Filter CV</text>
<text x="740" y="190" class="v" text-anchor="start" font-size="8" fill="#333">Sample & Hold → Res CV</text>
<text x="740" y="215" class="v" text-anchor="start" font-size="8" fill="#333">Clock Divider → Gate Out</text>
<text x="740" y="240" class="v" text-anchor="start" font-size="8" fill="#333">Slew Limiter</text>
<text x="740" y="265" class="v" text-anchor="start" font-size="8" fill="#333">Attenuverters → Pitch/Env/LFO IN</text>
<text x="740" y="300" class="v" text-anchor="start" font-size="8" fill="#333">Output Jacks:</text>
<text x="740" y="320" class="v" text-anchor="start" font-size="8" fill="#333">Saw, Square, Mix, VCF, Triangle</text>
<text x="740" y="340" class="v" text-anchor="start" font-size="8" fill="#333">Gate Out, Pitch/Env/LFO In</text>
<text x="740" y="380" class="v" text-anchor="start" font-size="8" fill="#333">Eurorack Power Header</text>
<line x1="250" y1="250" x2="300" y2="250" stroke="#666" stroke-width="2"/>
<text x="275" y="240" class="v" text-anchor="middle" font-size="7" fill="#333">Signals</text>
<line x1="480" y1="170" x2="520" y2="170" stroke="#666" stroke-width="2"/>
<text x="500" y="160" class="v" text-anchor="middle" font-size="7" fill="#333">To A</text>
<line x1="480" y1="355" x2="520" y2="355" stroke="#666" stroke-width="2"/>
<text x="500" y="345" class="v" text-anchor="middle" font-size="7" fill="#333">To B</text>
<line x1="670" y1="170" x2="720" y2="170" stroke="#666" stroke-width="2"/>
<text x="695" y="160" class="v" text-anchor="middle" font-size="7" fill="#333">To Exp</text>
<line x1="670" y1="355" x2="720" y2="355" stroke="#666" stroke-width="2"/>
<text x="695" y="345" class="v" text-anchor="middle" font-size="7" fill="#333">From Exp</text>
<line x1="250" y1="380" x2="770" y2="380" stroke="#CC0000" stroke-width="3" stroke-dasharray="5,3"/>
<text x="510" y="370" class="v" text-anchor="middle" font-size="8" fill="#CC0000">Power Bus (±12V, +5V, GND)</text>
<rect x="50" y="470" width="900" height="150" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="4"/>
<text x="500" y="495" class="l" text-anchor="middle" font-size="10" fill="#333">Signal Types</text>
<rect x="80" y="520" width="20" height="14" fill="#0066CC" stroke="#333" rx="2"/>
<text x="108" y="532" class="v" text-anchor="start" font-size="9" fill="#333">Audio (Saw, Square, Mix, VCF)</text>
<rect x="300" y="520" width="20" height="14" fill="#009933" stroke="#333" rx="2"/>
<text x="328" y="532" class="v" text-anchor="start" font-size="9" fill="#333">Gate/Clock</text>
<rect x="520" y="520" width="20" height="14" fill="#CC6600" stroke="#333" rx="2"/>
<text x="548" y="532" class="v" text-anchor="start" font-size="9" fill="#333">CV (Pitch, Env, LFO)</text>
<rect x="740" y="520" width="20" height="14" fill="#CC0000" stroke="#333" rx="2"/>
<text x="768" y="532" class="v" text-anchor="start" font-size="9" fill="#333">Power (+12V, +5V)</text>
<text x="80" y="570" class="v" text-anchor="start" font-size="9" fill="#333">Flow: MicroBrute signals → Breakout processing → DB-9 A → Expander outputs</text>
<text x="80" y="590" class="v" text-anchor="start" font-size="9" fill="#333">CV Flow: Expander outputs → DB-9 B → Breakout → MicroBrute inputs</text>
</svg>