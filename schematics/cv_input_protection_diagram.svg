<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="700" height="500" fill="#FEFEFE"/>
<text x="350" y="25" class="title" text-anchor="middle">CV Input Protection Circuit</text>
<text x="350" y="42" class="subtitle" text-anchor="middle">±12V to 0-5V Scaling with Clamping</text>
<circle cx="80" cy="200" r="8" class="component"/>
<line x1="80" y1="200" x2="100" y2="200" class="wire"/>
<text x="80" y="222" class="label" text-anchor="middle">CV IN ±12V</text>
<line x1="100" y1="200" x2="150" y2="200" class="wire"/>
<path d="M145,200 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="170" y="182" class="label" text-anchor="middle">R1</text>
<text x="170" y="222" class="value" text-anchor="middle">100kΩ</text>
<line x1="190" y1="200" x2="220" y2="200" class="wire"/>
<text x="250" y="150" class="label" font-size="10">Clamping to ±5V</text>
<line x1="220" y1="200" x2="220" y2="170" class="wire"/>
<line x1="220" y1="170" x2="280" y2="170" class="wire"/>
<polygon points="280,160 280,180 300,170" fill="none" stroke="#D44" stroke-width="1.5"/>
<line x1="300" y1="160" x2="300" y2="180" stroke="#D44" stroke-width="1.5"/>
<line x1="300" y1="170" x2="350" y2="170" class="wire"/>
<line x1="350" y1="170" x2="350" y2="158" class="wire" stroke="#D44" stroke-width="2"/>
<text x="354" y="164" class="value" fill="#D44">+5V</text>
<line x1="220" y1="200" x2="220" y2="230" class="wire"/>
<line x1="220" y1="230" x2="280" y2="230" class="wire"/>
<polygon points="300,220 300,240 280,230" fill="none" stroke="#44D" stroke-width="1.5"/>
<line x1="280" y1="220" x2="280" y2="240" stroke="#44D" stroke-width="1.5"/>
<line x1="280" y1="245" x2="280" y2="280" class="wire"/>
<line x1="280" y1="280" x2="350" y2="280" stroke="#44D" stroke-width="2"/>
<text x="360" y="283" class="value" fill="#44D" font-size="8">-5V</text>
<line x1="220" y1="200" x2="320" y2="200" class="wire"/>
<line x1="320" y1="200" x2="320" y2="240" class="wire"/>
<polygon points="370,240 370,300 430,270" class="component"/>
<text x="400" y="275" class="label" text-anchor="middle" font-size="9">TL072 A</text>
<text x="367" y="252" class="pin" text-anchor="end">-</text>
<text x="367" y="288" class="pin" text-anchor="end">+</text>
<line x1="320" y1="240" x2="320" y2="252" class="wire"/>
<line x1="320" y1="252" x2="370" y2="252" class="wire"/>
<path d="M320,252 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="345" y="234" class="label" text-anchor="middle">R2</text>
<text x="345" y="274" class="value" text-anchor="middle">100kΩ</text>
<line x1="320" y1="288" x2="320" y2="350" class="wire"/>
<path d="M320,295 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l0,5" class="component"/>
<text x="300" y="315" class="label" text-anchor="end">R3</text>
<text x="332" y="320" class="value">100kΩ</text>
<line x1="320" y1="350" x2="320" y2="362" class="wire"/>
<line x1="310" y1="362" x2="330" y2="362" class="wire" stroke-width="2"/>
<line x1="314" y1="366" x2="326" y2="366" class="wire" stroke-width="1.5"/>
<line x1="430" y1="270" x2="480" y2="270" class="wire"/>
<line x1="480" y1="270" x2="480" y2="200" class="wire"/>
<line x1="480" y1="200" x2="400" y2="200" class="wire"/>
<line x1="400" y1="200" x2="400" y2="240" class="wire"/>
<path d="M415,200 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="440" y="182" class="label" text-anchor="middle">R4</text>
<text x="440" y="222" class="value" text-anchor="middle">47kΩ</text>
<line x1="430" y1="270" x2="550" y2="270" class="wire"/>
<rect x="560.0" y="250.0" width="80" height="40" class="component" fill="#f5f5f5"/>
<text x="600" y="270" class="label" text-anchor="middle">To Filter</text>
<text x="600" y="282" class="value" text-anchor="middle">CV Input</text>
<rect x="50" y="350" width="600" height="130" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="4"/>
<text x="350" y="375" class="label" text-anchor="middle" fill="#0D47A1">Protection Circuit Operation</text>
<text x="70" y="395" class="label" font-size="8" fill="#1565C0">Input Range:</text>
<text x="170" y="395" class="value" font-size="8">±12V (Eurorack standard)</text>
<text x="70" y="412" class="label" font-size="8" fill="#1565C0">Clamping:</text>
<text x="170" y="412" class="value" font-size="8">BAT54S diodes limit to ±5V (safe for op-amp)</text>
<text x="70" y="429" class="label" font-size="8" fill="#1565C0">Attenuation:</text>
<text x="170" y="429" class="value" font-size="8">Gain = -0.47 (47k/100k), ±5V → ±2.35V</text>
<text x="70" y="446" class="label" font-size="8" fill="#1565C0">Output:</text>
<text x="170" y="446" class="value" font-size="8">0-5V range suitable for MicroBrute CV inputs</text>
<text x="70" y="463" class="label" font-size="8" fill="#1565C0">Current Limit:</text>
<text x="170" y="463" class="value" font-size="8">100kΩ input resistor protects against shorts</text></svg>