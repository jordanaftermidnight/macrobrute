<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#333"/>
  </marker>
</defs>
<style>
  .t { font: bold 14px sans-serif; fill: #1a1a1a; }
  .st { font: 10px sans-serif; fill: #555; }
  .l { font: bold 10px sans-serif; fill: #1a1a1a; }
  .v { font: 9px sans-serif; fill: #333; }
  .vl { font: 8px sans-serif; fill: #666; }
</style>
<rect width="600" height="450" fill="#FEFEFE"/>
<text x="300" y="25" class="t" text-anchor="middle">CV Input Protection</text>
<text x="300" y="42" class="st" text-anchor="middle">BAT54S Schottky Clamping for DB-9 B Inputs</text>
<circle cx="60" cy="200" r="6" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="60" y="225" class="l" text-anchor="middle" font-size="9">CV IN</text>
<text x="60" y="238" class="vl" text-anchor="middle" font-size="7">±12V max</text>
<line x1="66" y1="200" x2="120" y2="200" stroke="#333" stroke-width="1.5"/>
<path d="M120,200 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,0" stroke="#CD853F" stroke-width="2" fill="none"/>
<text x="145" y="190" class="l" text-anchor="middle" font-size="8">R1</text>
<text x="145" y="215" class="vl" text-anchor="middle" font-size="7">100kΩ</text>
<text x="145" y="225" class="vl" text-anchor="middle" font-size="7">(protection)</text>
<line x1="170" y1="200" x2="200" y2="200" stroke="#333" stroke-width="1.5"/>
<circle cx="200" cy="200" r="3" fill="#0066CC"/>
<line x1="200" y1="200" x2="240" y2="200" stroke="#333" stroke-width="1.5"/>
<path d="M240,200 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,0" stroke="#CD853F" stroke-width="2" fill="none"/>
<text x="265" y="190" class="l" text-anchor="middle" font-size="8">ATTEN</text>
<text x="265" y="215" class="vl" text-anchor="middle" font-size="7">100kΩ</text>
<line x1="290" y1="200" x2="320" y2="200" stroke="#333" stroke-width="1.5"/>
<path d="M320,200 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,0" stroke="#CD853F" stroke-width="2" fill="none"/>
<text x="345" y="190" class="l" text-anchor="middle" font-size="8">Rs</text>
<text x="345" y="215" class="vl" text-anchor="middle" font-size="7">10kΩ</text>
<line x1="370" y1="200" x2="400" y2="200" stroke="#333" stroke-width="1.5"/>
<circle cx="400" cy="200" r="3" fill="#0066CC"/>
<line x1="400" y1="200" x2="520" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="460" y="190" class="l" text-anchor="middle" font-size="8">To MicroBrute</text>
<text x="460" y="215" class="vl" text-anchor="middle" font-size="7">CV input node</text>
<line x1="400" y1="200" x2="400" y2="120" stroke="#D44" stroke-width="1.5"/>
<line x1="400" y1="120" x2="380" y2="120" stroke="#D44" stroke-width="1.5"/>
<polygon points="380,110 380,130 400,120" fill="none" stroke="#D44" stroke-width="1.5"/>
<line x1="380" y1="110" x2="380" y2="130" stroke="#D44" stroke-width="1.5"/>
<line x1="380" y1="110" x2="380" y2="80" stroke="#D44" stroke-width="1.5"/>
<line x1="370" y1="80" x2="390" y2="80" stroke="#D44" stroke-width="2"/>
<text x="400" y="75" class="vl" fill="#D44" font-size="8">+5V</text>
<text x="415" y="125" class="vl" fill="#D44" font-size="7">BAT54S</text>
<line x1="400" y1="200" x2="400" y2="280" stroke="#44D" stroke-width="1.5"/>
<line x1="400" y1="280" x2="420" y2="280" stroke="#44D" stroke-width="1.5"/>
<polygon points="420,270 420,290 400,280" fill="none" stroke="#44D" stroke-width="1.5"/>
<line x1="420" y1="270" x2="420" y2="290" stroke="#44D" stroke-width="1.5"/>
<line x1="420" y1="290" x2="420" y2="320" stroke="#44D" stroke-width="1.5"/>
<line x1="410" y1="320" x2="430" y2="320" stroke="#44D" stroke-width="2"/>
<line x1="414" y1="324" x2="426" y2="324" stroke="#44D" stroke-width="1.5"/>
<text x="445" y="325" class="vl" fill="#44D" font-size="8">GND</text>
<rect x="50" y="360" width="500" height="80" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="4"/>
<text x="300" y="380" class="l" text-anchor="middle" font-size="9" fill="#0D47A1">Circuit Operation</text>
<text x="70" y="400" class="v" font-size="8">• 100kΩ input resistor limits current during faults</text>
<text x="70" y="415" class="v" font-size="8">• BAT54S dual Schottky clamps to +5V/GND (actually ~0.3V/5.3V)</text>
<text x="70" y="430" class="v" font-size="8">• 10kΩ series resistor + attenuator form voltage divider</text>
</svg>