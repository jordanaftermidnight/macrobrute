<text x="650" y="180" class="label" font-size="10">→ VCO sync node</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• LM393 dual comparator, 2× 100 kΩ (threshold divider), 1× 10 kΩ (hysteresis), 1× 1N4148, 1× SPDT</text>
<text x="55" y="563" class="value" font-size="9">• Hard mode (A): sync jack → VCO sync directly (stock behaviour).</text>
<text x="55" y="578" class="value" font-size="9">• Soft mode (B): comparator + hysteresis produces phase-resync edges that re-time the VCO without forcing it.</text>
<text x="55" y="593" class="value" font-size="9">• Bench-test on breadboard before final install. Stripboard layout: schematics/mod_m02_soft_sync_stripboard.svg</text></svg>