<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 8px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="700" height="600" fill="#FEFEFE"/>
<text x="350" y="25" class="title" text-anchor="middle">DSO138 Input Protection</text>
<text x="350" y="42" class="subtitle" text-anchor="middle">Safe Signal Injection for Oscilloscope Module</text>
<text x="50" y="50" class="label" font-size="12">Signal Input (From Synth)</text>
<circle cx="80" cy="100" r="8" class="component"/>
<line x1="80" y1="100" x2="100" y2="100" class="wire"/>
<text x="80" y="122" class="label" text-anchor="middle">IN</text>
<line x1="100" y1="100" x2="140" y2="100" class="wire"/>
<path d="M135,100 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="160" y="82" class="label" text-anchor="middle">R1</text>
<text x="160" y="122" class="value" text-anchor="middle">1kΩ</text>
<line x1="180" y1="100" x2="220" y2="100" class="wire"/>
<text x="250" y="50" class="label" font-size="12">Voltage Clamping</text>
<line x1="220" y1="100" x2="220" y2="70" class="wire"/>
<line x1="220" y1="70" x2="280" y2="70" class="wire"/>
<polygon points="280,55 280,85 300,70" fill="none" stroke="#D44" stroke-width="1.5"/>
<line x1="300" y1="55" x2="300" y2="85" stroke="#D44" stroke-width="1.5"/>
<line x1="300" y1="70" x2="350" y2="70" class="wire"/>
<line x1="350" y1="70" x2="350" y2="58" class="wire" stroke="#D44" stroke-width="2"/>
<text x="354" y="64" class="value" fill="#D44">+3.3V</text>
<line x1="220" y1="100" x2="220" y2="130" class="wire"/>
<line x1="220" y1="130" x2="280" y2="130" class="wire"/>
<polygon points="300,115 300,145 280,130" fill="none" stroke="#44D" stroke-width="1.5"/>
<line x1="280" y1="115" x2="280" y2="145" stroke="#44D" stroke-width="1.5"/>
<line x1="280" y1="150" x2="280" y2="162" class="wire"/>
<line x1="270" y1="162" x2="290" y2="162" class="wire" stroke-width="2"/>
<line x1="274" y1="166" x2="286" y2="166" class="wire" stroke-width="1.5"/>
<text x="50" y="200" class="label" font-size="12">10:1 Voltage Divider</text>
<line x1="220" y1="100" x2="260" y2="100" class="wire"/>
<path d="M265,100 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="290" y="82" class="label" text-anchor="middle">R2</text>
<text x="290" y="122" class="value" text-anchor="middle">900kΩ</text>
<line x1="320" y1="100" x2="350" y2="100" class="wire"/>
<circle cx="350" cy="100" r="3.5" class="junction"/>
<line x1="350" y1="100" x2="350" y2="160" class="wire"/>
<path d="M350,105 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l0,5" class="component"/>
<text x="330" y="125" class="label" text-anchor="end">R3</text>
<text x="362" y="130" class="value">100kΩ</text>
<line x1="350" y1="180" x2="350" y2="192" class="wire"/>
<line x1="340" y1="192" x2="360" y2="192" class="wire" stroke-width="2"/>
<line x1="344" y1="196" x2="356" y2="196" class="wire" stroke-width="1.5"/>
<text x="450" y="50" class="label" font-size="12">To DSO138 Module</text>
<line x1="350" y1="100" x2="450" y2="100" class="wire"/>
<rect x="460.0" y="80.0" width="80" height="40" class="component" fill="#f5f5f5"/>
<text x="500" y="100" class="label" text-anchor="middle">DSO138</text>
<text x="500" y="112" class="value" text-anchor="middle">ADC Input</text>
<text x="520" y="170" class="value" font-size="8">Internal reference:</text>
<text x="520" y="185" class="value" font-size="8">0V - 3.3V range</text>
<rect x="50" y="250" width="600" height="320" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="4"/>
<text x="350" y="275" class="label" text-anchor="middle" fill="#0D47A1">Protection Circuit Specifications</text>
<text x="70" y="300" class="label" font-size="9" fill="#1565C0">Input Range:</text>
<text x="200" y="300" class="value" font-size="9">±12V (synth signals)</text>
<text x="70" y="320" class="label" font-size="9" fill="#1565C0">Output Range:</text>
<text x="200" y="320" class="value" font-size="9">0V - 3.3V (DSO138 safe)</text>
<text x="70" y="340" class="label" font-size="9" fill="#1565C0">Attenuation:</text>
<text x="200" y="340" class="value" font-size="9">10:1 (divide by 10)</text>
<text x="70" y="360" class="label" font-size="9" fill="#1565C0">Clamping:</text>
<text x="200" y="360" class="value" font-size="9">Schottky diodes to 0V / 3.3V rails</text>
<text x="70" y="380" class="label" font-size="9" fill="#1565C0">Current Limit:</text>
<text x="200" y="380" class="value" font-size="9">1kΩ series resistor limits fault current</text>
<text x="70" y="400" class="label" font-size="9" fill="#1565C0">Response:</text>
<text x="200" y="400" class="value" font-size="9">Suitable for audio and CV signals</text>
<text x="70" y="420" class="label" font-size="9" fill="#1565C0">Bandwidth:</text>
<text x="200" y="420" class="value" font-size="9">~100kHz (limited by 10MΩ impedance)</text>
<text x="70" y="460" class="label" font-size="10">How Protection Works:</text>
<text x="70" y="480" class="value" font-size="8">• 1kΩ resistor limits current if diodes conduct (protects diodes and DSO138)</text>
<text x="70" y="500" class="value" font-size="8">• Schottky diodes clamp voltage to 0V - 3.3V range (fast response)</text>
<text x="70" y="520" class="value" font-size="8">• 10:1 divider brings ±12V synth signals down to ±1.2V (within ADC range)</text>
<text x="70" y="540" class="value" font-size="8">• Works for AC (audio) and DC (CV) signals</text></svg>