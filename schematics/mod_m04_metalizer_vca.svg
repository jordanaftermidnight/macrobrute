<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="960" height="620" fill="#FEFEFE"/>
<text x="480" y="25" class="title" text-anchor="middle">M04 — Metalizer CV Depth (LM13700 OTA)</text>
<text x="480" y="42" class="subtitle" text-anchor="middle">VCA in the Metalizer feedback loop — turns the wavefolder into a dynamic effect</text>
<text x="60" y="120" class="label" font-size="11">Metalizer feedback (cut here)</text>
<line x1="60" y1="180" x2="220" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140" y="172" class="anno" text-anchor="middle" font-size="9">existing trace cut</text>
<rect x="240" y="160" width="160" height="120" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" rx="3"/>
<circle cx="248" cy="168" r="3" fill="gold"/>
<text x="320.0" y="220.0" class="label" text-anchor="middle" fill="#FFF" font-size="11">LM13700</text>
<circle cx="236" cy="174.0" r="2.5" fill="gold"/>
<text x="232" y="177.0" class="value" text-anchor="end" font-size="8">IN+</text>
<circle cx="236" cy="207.33333333333334" r="2.5" fill="gold"/>
<text x="232" y="210.33333333333334" class="value" text-anchor="end" font-size="8">IN-</text>
<circle cx="236" cy="240.66666666666669" r="2.5" fill="gold"/>
<text x="232" y="243.66666666666669" class="value" text-anchor="end" font-size="8">Iabc</text>
