<circle cx="404" cy="240.66666666666669" r="2.5" fill="gold"/>
<text x="408" y="243.66666666666669" class="value" font-size="8">Buf</text>
<circle cx="404" cy="274.0" r="2.5" fill="gold"/>
<text x="408" y="277.0" class="value" font-size="8">V+</text>
<line x1="100" y1="350" x2="220" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="80" cy="350" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="80" cy="350" r="5" fill="#1a1a1a"/>
<text x="80" y="328" class="label" text-anchor="middle" font-size="10">CV IN</text>
<rect x="165" y="344" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="180" y="353" class="value" text-anchor="middle" font-size="8">100k</text>
<line x1="195" y1="350" x2="280" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="280" y1="350" x2="280" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M340,380 l5,-8 l5,8 l5,-8 l5,8 l5,-8 l5,8" class="component"/>
<line x1="360" y1="350" x2="360" y2="370" class="wire"/>
<polygon points="360,370 356,362 364,362" class="filled"/>
<text x="360" y="345" class="label" text-anchor="middle">Amount</text>
<text x="360" y="400" class="value" text-anchor="middle">100k</text>
<line x1="370" y1="380" x2="370" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="420" y="295" class="value" font-size="8">+12V (V+)</text>
<text x="420" y="245" class="value" font-size="8">-12V (V-)</text>
<line x1="404" y1="180" x2="640" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="650" y="184" class="label" font-size="10">→ Metalizer fb (rejoin)</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• LM13700 (1 OTA section), 1× 100 kΩ CV input R, 1× 10 kΩ control R, 1× 100 kΩ pot, 1× 6 mm CV jack, 4× 0.1 µF decouple</text>
<text x="55" y="563" class="value" font-size="9">• Cut Metalizer feedback trace at the wavefolder output node; re-route through the OTA's signal input</text>
<text x="55" y="578" class="value" font-size="9">• CV (0–5 V) modulates Iabc — high CV = full feedback (intense fold), low CV = muted</text>
<text x="55" y="593" class="value" font-size="9">• Amount pot sets manual offset / minimum-fold floor when CV is at 0V</text>
<text x="55" y="608" class="value" font-size="9">• Most invasive of the Phase 2 mods — install LAST in build sequence</text></svg>