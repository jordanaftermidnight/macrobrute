<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M05 — Filter Self-Oscillation Kill Switch</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">SPST breaks the Steiner-Parker filter feedback at high resonance</text>
<text x="60" y="130" class="label" font-size="11">Steiner-Parker filter</text>
<rect x="60" y="150" width="160" height="80" fill="#F0F0F5" stroke="#666" stroke-width="1.5" rx="4"/>
<text x="140" y="195" class="value" text-anchor="middle" font-size="10">Stock filter core</text>
<line x1="220" y1="190" x2="320" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="245" y="180" class="anno" font-size="9">resonance fb</text>
<rect x="335" y="184" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="350" y="193" class="value" text-anchor="middle" font-size="8">10k</text>
<line x1="365" y1="190" x2="420" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="425" cy="190" r="3" fill="#1a1a1a"/>
<circle cx="455" cy="182" r="3" fill="#1a1a1a"/>
<line x1="425" y1="190" x2="452" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="440" y="212" class="value" text-anchor="middle" font-size="8">Kill</text>
<line x1="460" y1="182" x2="540" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="540" y1="182" x2="540" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="540" y1="270" x2="140" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="140" y1="270" x2="140" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="340" y="290" class="anno" text-anchor="middle" font-size="9">closed = stock self-osc · open = clean percussive</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× SPST mini-toggle, 1× 10 kΩ resistor (current limit during switching)</text>
<text x="55" y="563" class="value" font-size="9">• Wired in series with the existing resonance feedback path — no PCB cuts</text>
<text x="55" y="578" class="value" font-size="9">• Closed: filter can self-oscillate at high Q (stock behaviour)</text>
<text x="55" y="593" class="value" font-size="9">• Open: resonance peak only, no oscillation — clean percussive plucks</text></svg>