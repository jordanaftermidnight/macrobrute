<text x="82" y="714" class="value" font-size="8.5" fill="#5C4500">Phase 0 bench validation — wire per this diagram on a breadboard, then flash firmware/pico/main.py and run test_hw.py for per-peripheral diagnostics.</text>
<text x="82" y="726" class="value" font-size="8.5" fill="#5C4500">All 220 Ω and 1 kΩ resistors are shown inline. KY-040 has on-board 10 kΩ pull-ups; firmware enables Pin.PULL_UP on GP12/13/14/15 — no external pulls required.</text>
<text x="82" y="738" class="value" font-size="8.5" fill="#5C4500">GP21 (Clk IN) = Pin.PULL_DOWN with rising-edge IRQ. Phase 0 only loops GP22 → 1 kΩ → GP21 for self-test; ±12 V Eurorack input buffering belongs on the breakout board.</text></svg>