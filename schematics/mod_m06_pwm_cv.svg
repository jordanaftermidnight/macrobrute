<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M06 — PWM CV Input</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">Direct CV injection to PWM summing node (R289)</text>
<circle cx="100" cy="200" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="100" cy="200" r="5" fill="#1a1a1a"/>
<text x="100" y="178" class="label" text-anchor="middle" font-size="10">PWM CV IN</text>
<line x1="120" y1="200" x2="240" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="255" y="194" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="270" y="203" class="value" text-anchor="middle" font-size="8">39k</text>
<line x1="285" y1="200" x2="380" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="390" y="195" class="label" font-size="10">→ R289 junction</text>
<text x="390" y="210" class="value" font-size="9">PWM summing node, front board</text>
<rect x="240" y="250" width="450" height="70" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="465" y="270" class="label" text-anchor="middle" font-size="11" fill="#E65100">Safety</text>
<text x="260" y="290" class="value" font-size="9">39 kΩ + LPC2361 DAC node internal Z → max ±0.13 mA at ±5 V CV</text>
<text x="260" y="304" class="value" font-size="9">Well below DAC node spec — no clamping diodes required.</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× 39 kΩ series resistor, 1× 6 mm Thonkiconn jack</text>
<text x="55" y="563" class="value" font-size="9">• Tap point: R289 junction on the front board (PWM summing node)</text>
<text x="55" y="578" class="value" font-size="9">• 0V CV = stock PWM (knob position), CV swings shift pulse width</text>
<text x="55" y="593" class="value" font-size="9">• Pairs with M09 (PWM self-mod normalled jack) — sharing the same panel jack</text></svg>