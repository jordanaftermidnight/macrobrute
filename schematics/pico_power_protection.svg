<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">Pico Power Protection</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">Eurorack +5V → 3-part minimal filter → Pico VSYS · all parts shop-stocked</text>
<rect x="30" y="70" width="120" height="80" fill="#CC6600" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
<text x="90" y="100" class="comp-label" text-anchor="middle" font-size="12" font-weight="700">Eurorack +5V</text>
<text x="90" y="120" class="comp-label" text-anchor="middle" font-size="10" font-weight="600">from CP1A bus</text>
<rect x="200" y="70" width="120" height="80" fill="#D44" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
<text x="260" y="100" class="comp-label" text-anchor="middle" font-size="12" font-weight="700">1N5817</text>
<text x="260" y="120" class="comp-label" text-anchor="middle" font-size="10" font-weight="600">Schottky · ~0.2V drop</text>
<rect x="370" y="70" width="120" height="80" fill="#0066CC" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
<text x="430" y="100" class="comp-label" text-anchor="middle" font-size="12" font-weight="700">100µF/10V</text>
<text x="430" y="120" class="comp-label" text-anchor="middle" font-size="10" font-weight="600">bulk electrolytic</text>
<rect x="540" y="70" width="120" height="80" fill="#4A4" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
<text x="600" y="100" class="comp-label" text-anchor="middle" font-size="12" font-weight="700">100nF ceramic</text>
<text x="600" y="120" class="comp-label" text-anchor="middle" font-size="10" font-weight="600">HF bypass</text>
<rect x="710" y="70" width="120" height="80" fill="#6600CC" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
<text x="770" y="100" class="comp-label" text-anchor="middle" font-size="12" font-weight="700">Pico VSYS</text>
<text x="770" y="120" class="comp-label" text-anchor="middle" font-size="10" font-weight="600">pin 39 · ~100mA</text>
<line x1="150" y1="110" x2="200" y2="110" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="320" y1="110" x2="370" y2="110" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="490" y1="110" x2="540" y2="110" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="660" y1="110" x2="710" y2="110" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450" y="220" class="label" text-anchor="middle" font-size="13">Schematic detail</text>
<line x1="120" y1="290" x2="180" y2="290" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="180,278 180,302 210,290" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<line x1="210" y1="276" x2="210" y2="304" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="210" y1="290" x2="270" y2="290" stroke="#1a1a1a" stroke-width="2"/>
<text x="195" y="265" class="label" text-anchor="middle" font-size="9">1N5817</text>
<text x="100" y="285" class="value" text-anchor="end" font-size="9" fill="#CC6600">+5V</text>
<circle cx="320" cy="290" r="3" fill="#0066CC"/>
<line x1="270" y1="290" x2="430" y2="290" stroke="#1a1a1a" stroke-width="2"/>
<line x1="320" y1="290" x2="320" y2="350" stroke="#1a1a1a" stroke-width="2"/>
<line x1="305" y1="350" x2="335" y2="350" stroke="#1a1a1a" stroke-width="3"/>
<line x1="295" y1="362" x2="345" y2="362" stroke="#1a1a1a" stroke-width="3"/>
<line x1="320" y1="362" x2="320" y2="400" stroke="#1a1a1a" stroke-width="2"/>
<text x="350" y="350" class="value" font-size="9">100µF / 10V</text>
<circle cx="380" cy="290" r="3" fill="#0066CC"/>
<line x1="380" y1="290" x2="380" y2="350" stroke="#1a1a1a" stroke-width="2"/>
<line x1="368" y1="350" x2="392" y2="350" stroke="#1a1a1a" stroke-width="3"/>
<line x1="368" y1="358" x2="392" y2="358" stroke="#1a1a1a" stroke-width="3"/>
<line x1="380" y1="358" x2="380" y2="400" stroke="#1a1a1a" stroke-width="2"/>
<text x="408" y="356" class="value" font-size="9">100nF</text>
<line x1="280" y1="400" x2="500" y2="400" stroke="#1a1a1a" stroke-width="3"/>
<line x1="380" y1="400" x2="380" y2="412" stroke="#1a1a1a" stroke-width="2"/>
<line x1="370" y1="412" x2="390" y2="412" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="374" y1="416" x2="386" y2="416" stroke="#1a1a1a" stroke-width="2"/>
<line x1="378" y1="420" x2="382" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="510" y="403" class="value" font-size="9">GND</text>
<line x1="430" y1="290" x2="600" y2="290" stroke="#1a1a1a" stroke-width="2"/>
<text x="610" y="294" class="label" font-size="10" fill="#6600CC">→ Pico VSYS</text>
<rect x="40" y="450" width="820" height="70" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="450" y="470" class="label" text-anchor="middle" fill="#E65100" font-size="11">Notes</text>
<text x="55" y="490" class="value" font-size="9">• If shop has no 1N5817: substitute 1N4001-1N4007 (0.7V drop, still safe — Pico VSYS spec is 1.8–5.5V).</text>
<text x="55" y="505" class="value" font-size="9">• Optional armor (defer to v2): PPTC 500 mA polyfuse, SMAJ5.0A TVS clamp, ferrite bead 100Ω@100MHz.</text>
<text x="55" y="520" class="value" font-size="9">• Mount on a 2×3cm sub-board behind the Pico — same board can carry I²C0 pull-ups (2.2kΩ) and UART/I²C ferrite beads.</text></svg>