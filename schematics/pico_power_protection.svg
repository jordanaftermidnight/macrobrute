<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="1140" height="760"><style>text { font-family: "SF Mono", Consolas, "Liberation Mono", monospace; }</style><rect x="0.5" y="0.5" width="1139" height="759" rx="6" fill="#f5f5ee" stroke="#b8b8a8" stroke-width="1"/><text x="570" y="24" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Pico Power Protection (VSYS from the rack +5 V)</text><text x="570" y="40" font-size="11" text-anchor="middle" fill="#555">Series Schottky, bulk and 100 nF to VSYS (pin 39). Design values, nothing built yet</text><g transform="translate(0,-50)"><rect x="30" y="470" width="1080" height="18" rx="4" fill="#5cb85c"/><text x="40" y="483" font-size="11" text-anchor="start" fill="#fff" font-weight="bold">GND (expander star, rack 0 V)</text><rect x="40" y="170" width="130" height="230" rx="4" fill="#e4e4dc" stroke="#555" stroke-width="1.2"/><text x="40" y="152" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Rack 16-pin header</text><text x="40" y="164" font-size="10" text-anchor="start" fill="#555">Behringer CP1A</text><text x="105" y="275" font-size="9" text-anchor="middle" fill="#555">+5 V pins 11-12</text><text x="105" y="288" font-size="9" text-anchor="middle" fill="#555">0.5 A shared</text><text x="105" y="301" font-size="9" text-anchor="middle" fill="#555">GND pins 3-8</text><text x="164" y="233" font-size="9" text-anchor="end" fill="#222" font-weight="bold">+5V</text><circle cx="170" cy="230" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><text x="164" y="383" font-size="9" text-anchor="end" fill="#222" font-weight="bold">GND</text><circle cx="170" cy="380" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><polyline points="170,230 230,230" fill="none" stroke="#7a4b1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="260,230 700,230" fill="none" stroke="#7a4b1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="380" cy="230" r="3.5" fill="#7a4b1e"/><circle cx="520" cy="230" r="3.5" fill="#7a4b1e"/><line x1="230" y1="230" x2="260" y2="230" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round"/><path d="M238,223 L238,237 L251,230 Z" fill="#333" stroke="#222" stroke-width="1"/><line x1="252" y1="223" x2="252" y2="237" stroke="#222" stroke-width="2" stroke-linecap="round"/><rect x="214.1" y="205" width="61.8" height="14" rx="3" fill="#ffffff" stroke="#b8b8a8" stroke-width="0.8"/><text x="217.1" y="215.5" font-size="10" text-anchor="start" fill="#333">D1 1N5819</text><circle cx="230" cy="230" r="3" fill="#e8a317" stroke="#444" stroke-width="0.8"/><circle cx="260" cy="230" r="3" fill="#e8a317" stroke="#444" stroke-width="0.8"/><rect x="185" y="252" width="69.6" height="13" rx="3" fill="#fff1c2" stroke="#c98a00" stroke-width="1"/><text x="189" y="262" font-size="9" text-anchor="start" fill="#c98a00" font-weight="bold">PROVISIONAL</text><rect x="185" y="269" width="164.8" height="13" rx="3" fill="#e3ecfd" stroke="#2a5bd7" stroke-width="1"/><text x="189" y="279" font-size="9" text-anchor="start" fill="#2a5bd7" font-weight="bold">OWNER-CONFIRM 1N5819 (owned)</text><rect x="185" y="286" width="131.2" height="13" rx="3" fill="#fde3e3" stroke="#c0392b" stroke-width="1"/><text x="189" y="296" font-size="9" text-anchor="start" fill="#c0392b" font-weight="bold">UNVERIFIED 1N5819 part</text><polyline points="380,230 380,300" fill="none" stroke="#7a4b1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="380,330 380,470" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="380" cy="470" r="3.5" fill="#5cb85c"/><line x1="380" y1="300" x2="380" y2="312" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round"/><line x1="380" y1="318" x2="380" y2="330" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round"/><line x1="371" y1="312" x2="389" y2="312" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="371" y1="318" x2="389" y2="318" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><rect x="394" y="308" width="86.6" height="14" rx="3" fill="#ffffff" stroke="#b8b8a8" stroke-width="0.8"/><text x="397" y="318.5" font-size="10" text-anchor="start" fill="#333">2-4x 10uF/63V</text><circle cx="380" cy="300" r="3" fill="#e8a317" stroke="#444" stroke-width="0.8"/><circle cx="380" cy="330" r="3" fill="#e8a317" stroke="#444" stroke-width="0.8"/><text x="364" y="309" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">+</text><polyline points="520,230 520,300" fill="none" stroke="#7a4b1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="520,330 520,470" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="520" cy="470" r="3.5" fill="#5cb85c"/><line x1="520" y1="300" x2="520" y2="312" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round"/><line x1="520" y1="318" x2="520" y2="330" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round"/><line x1="511" y1="312" x2="529" y2="312" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="511" y1="318" x2="529" y2="318" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><rect x="534" y="308" width="37" height="14" rx="3" fill="#ffffff" stroke="#b8b8a8" stroke-width="0.8"/><text x="537" y="318.5" font-size="10" text-anchor="start" fill="#333">100nF</text><circle cx="520" cy="300" r="3" fill="#e8a317" stroke="#444" stroke-width="0.8"/><circle cx="520" cy="330" r="3" fill="#e8a317" stroke="#444" stroke-width="0.8"/><rect x="400" y="208" width="61.8" height="14" rx="3" fill="#ffffff" stroke="#b8b8a8" stroke-width="0.8"/><text x="403" y="218.5" font-size="10" text-anchor="start" fill="#333">VSYS node</text><rect x="395" y="345" width="92" height="13" rx="3" fill="#ece3fd" stroke="#6a3fc4" stroke-width="1"/><text x="399" y="355" font-size="9" text-anchor="start" fill="#6a3fc4" font-weight="bold">OPEN bulk count</text><polyline points="170,380 200,380 200,470" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="200" cy="470" r="3.5" fill="#5cb85c"/><rect x="700" y="170" width="170" height="230" rx="4" fill="#e4e4dc" stroke="#555" stroke-width="1.2"/><text x="700" y="152" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Raspberry Pi Pico</text><text x="700" y="164" font-size="10" text-anchor="start" fill="#555">pins used</text><text x="785" y="262" font-size="9" text-anchor="middle" fill="#555">VSYS 1.8-5.5 V</text><text x="785" y="275" font-size="9" text-anchor="middle" fill="#555">pin 39: rack 5 V in</text><text x="785" y="288" font-size="9" text-anchor="middle" fill="#555">VBUS pin 40: USB only,</text><text x="785" y="301" font-size="9" text-anchor="middle" fill="#555">not wired here</text><text x="785" y="314" font-size="9" text-anchor="middle" fill="#555">3V3 OUT: under 300 mA</text><text x="706" y="233" font-size="9" text-anchor="start" fill="#222" font-weight="bold">VSYS 39</text><circle cx="700" cy="230" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><text x="706" y="383" font-size="9" text-anchor="start" fill="#222" font-weight="bold">GND 38</text><circle cx="700" cy="380" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><text x="864" y="233" font-size="9" text-anchor="end" fill="#222" font-weight="bold">3V3 OUT 36</text><circle cx="870" cy="230" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><polyline points="700,380 660,380 660,470" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="660" cy="470" r="3.5" fill="#5cb85c"/><polyline points="870,230 930,230" fill="none" stroke="#e8a317" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="170" width="170" height="130" rx="4" fill="#e4e4dc" stroke="#555" stroke-width="1.2"/><text x="930" y="164" font-size="11" text-anchor="start" fill="#222" font-weight="bold">3V3 loads</text><text x="1015" y="218.5" font-size="9" text-anchor="middle" fill="#555">OLED 1.3in I2C</text><text x="1015" y="231.5" font-size="9" text-anchor="middle" fill="#555">encoder +</text><text x="1015" y="244.5" font-size="9" text-anchor="middle" fill="#555">I2C0 pull-ups</text><text x="1015" y="257.5" font-size="9" text-anchor="middle" fill="#555">CD4049UB VCC</text><text x="936" y="233" font-size="9" text-anchor="start" fill="#222" font-weight="bold">3V3</text><circle cx="930" cy="230" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><text x="936" y="283" font-size="9" text-anchor="start" fill="#222" font-weight="bold">GND</text><circle cx="930" cy="280" r="3.5" fill="#e8a317" stroke="#444" stroke-width="0.8"/><polyline points="930,280 910,280 910,470" fill="none" stroke="#5cb85c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="910" cy="470" r="3.5" fill="#5cb85c"/><rect x="930" y="308" width="131.2" height="13" rx="3" fill="#fde3e3" stroke="#c0392b" stroke-width="1"/><text x="934" y="318" font-size="9" text-anchor="start" fill="#c0392b" font-weight="bold">UNVERIFIED actual load</text></g><rect x="30" y="460" width="340" height="200" rx="4" fill="#fff" stroke="#b8b8a8" stroke-width="1"/><text x="40" y="476" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Part choice (BF 1.2)</text><text x="40" y="490" font-size="9" text-anchor="start" fill="#333">D1 is drawn as the owned 1N5819 (40 V, x10, VF 0.60 V at 1</text><text x="40" y="503" font-size="9" text-anchor="start" fill="#333">A on the series sheet).</text><rect x="40" y="511" width="80.8" height="13" rx="3" fill="#e3ecfd" stroke="#2a5bd7" stroke-width="1"/><text x="44" y="521" font-size="9" text-anchor="start" fill="#2a5bd7" font-weight="bold">OWNER-CONFIRM</text><text x="125.8" y="521" font-size="9" text-anchor="start" fill="#333">Owner to confirm the 1N5819 stands in for</text><text x="40" y="534" font-size="9" text-anchor="start" fill="#333">the 1N5817 that BF 1.2 names.</text><text x="40" y="552" font-size="9" text-anchor="start" fill="#333">Note: the 1N5817 is a 20 V, 1 A Schottky, not 40 V</text><text x="40" y="565" font-size="9" text-anchor="start" fill="#333">(DATASHEETS (e)); VF 0.45 V max at 1 A (Diodes DS23001</text><text x="40" y="578" font-size="9" text-anchor="start" fill="#333">p2). Fine for a 5 V rail, but not owned.</text><rect x="40" y="586" width="64" height="13" rx="3" fill="#fde3e3" stroke="#c0392b" stroke-width="1"/><text x="44" y="596" font-size="9" text-anchor="start" fill="#c0392b" font-weight="bold">UNVERIFIED</text><text x="109" y="596" font-size="9" text-anchor="start" fill="#333">The owned 1N5819 part and its datasheet are</text><text x="40" y="609" font-size="9" text-anchor="start" fill="#333">not verified.</text><rect x="40" y="617" width="69.6" height="13" rx="3" fill="#fff1c2" stroke="#c98a00" stroke-width="1"/><text x="44" y="627" font-size="9" text-anchor="start" fill="#c98a00" font-weight="bold">PROVISIONAL</text><text x="114.6" y="627" font-size="9" text-anchor="start" fill="#333">BAT85 can also stand in: about 4.2 V at VSYS</text><text x="40" y="640" font-size="9" text-anchor="start" fill="#333">and 100 mA, IF 200 mA max.</text><rect x="390" y="460" width="340" height="156" rx="4" fill="#fff" stroke="#b8b8a8" stroke-width="1"/><text x="400" y="476" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Supply limits</text><text x="400" y="490" font-size="9" text-anchor="start" fill="#333">VSYS accepts 1.8 V to 5.5 V (Pico datasheet p9). An</text><text x="400" y="503" font-size="9" text-anchor="start" fill="#333">external 5 V is ORed into VSYS through a Schottky (p22):</text><text x="400" y="516" font-size="9" text-anchor="start" fill="#333">this chain is that arrangement.</text><text x="400" y="534" font-size="9" text-anchor="start" fill="#333">CP1A +5 V is 0.5 A in total, shared with every module in</text><text x="400" y="547" font-size="9" text-anchor="start" fill="#333">the rack (QSG p20).</text><rect x="400" y="555" width="64" height="13" rx="3" fill="#fde3e3" stroke="#c0392b" stroke-width="1"/><text x="404" y="565" font-size="9" text-anchor="start" fill="#c0392b" font-weight="bold">UNVERIFIED</text><text x="469" y="565" font-size="9" text-anchor="start" fill="#333">Pico draw from VSYS: not measured.</text><rect x="400" y="573" width="64" height="13" rx="3" fill="#fde3e3" stroke="#c0392b" stroke-width="1"/><text x="404" y="583" font-size="9" text-anchor="start" fill="#c0392b" font-weight="bold">UNVERIFIED</text><text x="469" y="583" font-size="9" text-anchor="start" fill="#333">Rack +5 V present on the owner&#x27;s bus slot</text><text x="400" y="596" font-size="9" text-anchor="start" fill="#333">(bench check BT-12).</text><rect x="750" y="460" width="360" height="138" rx="4" fill="#fff" stroke="#b8b8a8" stroke-width="1"/><text x="760" y="476" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Rules</text><text x="760" y="490" font-size="9" text-anchor="start" fill="#333">Bulk: 2-4x owned 10uF/63V electrolytic in parallel, plus 100</text><text x="760" y="503" font-size="9" text-anchor="start" fill="#333">nF (BF 1.4, CM section 10).</text><text x="760" y="521" font-size="9" text-anchor="start" fill="#333">No USB cable on the Pico while the rack powers it and the</text><text x="760" y="534" font-size="9" text-anchor="start" fill="#333">DB-9 cables are connected (BF 4.3). USB with rack 5 V is safe</text><text x="760" y="547" font-size="9" text-anchor="start" fill="#333">for the Pico (on-board VBUS Schottky, p21-22).</text><text x="760" y="565" font-size="9" text-anchor="start" fill="#333">Pico 3V3 OUT feeds the OLED, encoder and pull-ups: keep the</text><text x="760" y="578" font-size="9" text-anchor="start" fill="#333">load under 300 mA (p9).</text><text x="20" y="722" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Legend</text><line x1="20" y1="736" x2="42" y2="736" stroke="#7a4b1e" stroke-width="4" stroke-linecap="round"/><text x="50" y="739.5" font-size="10" text-anchor="start" fill="#333">+5 V (rack)</text><line x1="150.8" y1="736" x2="172.8" y2="736" stroke="#e8a317" stroke-width="4" stroke-linecap="round"/><text x="180.8" y="739.5" font-size="10" text-anchor="start" fill="#333">3V3 (Pico out)</text><line x1="281.6" y1="736" x2="303.6" y2="736" stroke="#5cb85c" stroke-width="4" stroke-linecap="round"/><text x="311.6" y="739.5" font-size="10" text-anchor="start" fill="#333">GND</text></svg>