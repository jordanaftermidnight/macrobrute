<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M11 — 9th Touch Bolt: Envelope Retrigger</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">Body contact injects a brief gate pulse — rhythmic glitch via touch</text>
<rect x="60" y="170" width="40" height="20" fill="#B87333" stroke="#8B4513" stroke-width="1.5" rx="2"/>
<text x="80" y="160" class="label" text-anchor="middle" font-size="10">M3 brass bolt</text>
<text x="80" y="205" class="value" text-anchor="middle" font-size="8">body contact</text>
<line x1="100" y1="180" x2="160" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="175" y="174" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="190" y="183" class="value" text-anchor="middle" font-size="8">100k</text>
<line x1="205" y1="180" x2="260" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="260,170 260,190 280,180" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="280" y1="170" x2="280" y2="190" stroke="#1a1a1a" stroke-width="2"/>
<text x="270" y="155" class="value" font-size="8">1N4148</text>
<line x1="280" y1="180" x2="340" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="340" y1="170" x2="340" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<line x1="352" y1="170" x2="352" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<text x="346" y="160" class="value" text-anchor="middle" font-size="8">100nF</text>
<line x1="352" y1="180" x2="440" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="450" y="184" class="label" font-size="10">→ Gate node (env trig)</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× M3 brass bolt + nut (matches the existing 8 touch bolts)</text>
<text x="55" y="563" class="value" font-size="9">• 1× 100 kΩ + 1× 1N4148 + 1× 100 nF — the diode prevents back-feed, the cap shapes the touch into a short pulse</text>
<text x="55" y="578" class="value" font-size="9">• Touching the bolt produces a brief gate edge → envelope retriggers</text>
<text x="55" y="593" class="value" font-size="9">• Body capacitance can't latch the gate high — falls back to inactive after the cap charges</text></svg>