<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="1050" height="600" fill="#FEFEFE"/>
<text x="525" y="25" class="title" text-anchor="middle">Power Regulation Chain</text>
<text x="525" y="42" class="subtitle" text-anchor="middle">Behringer CP1A bus → expander → Pico VSYS · DB-9 B carries ±12V to MB breakout · MicroBrute stock power untouched</text>
<rect x="40" y="90" width="200" height="120" fill="#555" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="140.0" y="112" class="label" text-anchor="middle" fill="#FFF" font-size="11">Behringer CP1A PSU</text>
<text x="140.0" y="130" class="value" text-anchor="middle" fill="#FFF" font-size="9">+12V · -12V · +5V on bus</text>
<text x="140.0" y="143" class="value" text-anchor="middle" fill="#FFF" font-size="9">13V / 3A wall input</text>
<text x="140.0" y="156" class="value" text-anchor="middle" fill="#FFF" font-size="9">+5V rail ~1A available</text>
<rect x="280" y="90" width="200" height="120" fill="#D44" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="380.0" y="112" class="label" text-anchor="middle" fill="#FFF" font-size="11">Pico Power Filter</text>
<text x="380.0" y="130" class="value" text-anchor="middle" fill="#FFF" font-size="9">1N5817 reverse-polarity</text>
<text x="380.0" y="143" class="value" text-anchor="middle" fill="#FFF" font-size="9">100µF/10V bulk</text>
<text x="380.0" y="156" class="value" text-anchor="middle" fill="#FFF" font-size="9">100nF ceramic HF bypass</text>
<rect x="520" y="90" width="200" height="120" fill="#6600CC" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="620.0" y="112" class="label" text-anchor="middle" fill="#FFF" font-size="11">Pico VSYS (pin 39)</text>
<text x="620.0" y="130" class="value" text-anchor="middle" fill="#FFF" font-size="9">Direct from filtered +5V</text>
<text x="620.0" y="143" class="value" text-anchor="middle" fill="#FFF" font-size="9">Pico draws ~100 mA</text>
<text x="620.0" y="156" class="value" text-anchor="middle" fill="#FFF" font-size="9">Internal LDO → 3V3 (pin 36)</text>
<rect x="520" y="240" width="200" height="120" fill="#44D" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="620.0" y="262" class="label" text-anchor="middle" fill="#FFF" font-size="11">DB-9 B → MB breakout</text>
<text x="620.0" y="280" class="value" text-anchor="middle" fill="#FFF" font-size="9">+12V (pin 7), -12V (pin 8)</text>
<text x="620.0" y="293" class="value" text-anchor="middle" fill="#FFF" font-size="9">1N5817 + ferrite + 100µF</text>
<text x="620.0" y="306" class="value" text-anchor="middle" fill="#FFF" font-size="9">Powers MB-side op-amp buffers</text>
<rect x="760" y="90" width="240" height="120" fill="#4A4" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="880.0" y="112" class="label" text-anchor="middle" fill="#FFF" font-size="11">Expander analog rails</text>
<text x="880.0" y="130" class="value" text-anchor="middle" fill="#FFF" font-size="9">+12V / -12V → slew op-amp</text>
<text x="880.0" y="143" class="value" text-anchor="middle" fill="#FFF" font-size="9">+5V → Pico VSYS path</text>
<text x="880.0" y="156" class="value" text-anchor="middle" fill="#FFF" font-size="9">GND → star at expander</text>
<rect x="760" y="240" width="240" height="120" fill="#0066CC" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="880.0" y="262" class="label" text-anchor="middle" fill="#FFF" font-size="11">MB-side breakout PCB</text>
<text x="880.0" y="280" class="value" text-anchor="middle" fill="#FFF" font-size="9">±12V via DB-9 B → buffers</text>
<text x="880.0" y="293" class="value" text-anchor="middle" fill="#FFF" font-size="9">Receives ±12V only</text>
<text x="880.0" y="306" class="value" text-anchor="middle" fill="#FFF" font-size="9">Star ground at TP72</text>
<line x1="240" y1="130" x2="280" y2="130" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="260.0" y="124.0" class="anno" text-anchor="middle" font-size="9">+5V</text>
<line x1="240" y1="170" x2="280" y2="170" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="260.0" y="164.0" class="anno" text-anchor="middle" font-size="9">GND</text>
<line x1="480" y1="150" x2="520" y2="150" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="144.0" class="anno" text-anchor="middle" font-size="9">VSYS</text>
<line x1="720" y1="150" x2="760" y2="150" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="720" y1="300" x2="760" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="740.0" y="294.0" class="anno" text-anchor="middle" font-size="9">DB-9 B</text>
<line x1="140" y1="210" x2="600" y2="240" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="400" width="470" height="170" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="4"/>
<text x="275" y="420" class="label" text-anchor="middle" fill="#1B5E20" font-size="12">Non-invasive principle</text>
<text x="55" y="445" class="value" font-size="9">• MicroBrute stock power is NOT tapped or modified.</text>
<text x="55" y="464" class="value" font-size="9">• Pico is fed from Eurorack +5V (CP1A bus), not from any MB rail.</text>
<text x="55" y="483" class="value" font-size="9">• MB breakout PCB receives only ±12V via DB-9 B for op-amp buffers.</text>
<text x="55" y="502" class="value" font-size="9">• Removing the DB-9 B cable leaves both MB and Pico in clean states.</text>
<text x="55" y="521" class="value" font-size="9">• MB stock 5V regulator is never loaded by the mod.</text>
<text x="55" y="540" class="value" font-size="9">• Star ground at TP72 — single return for audio/CV/gate.</text>
<rect x="540" y="400" width="470" height="170" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="775" y="420" class="label" text-anchor="middle" fill="#E65100" font-size="12">Current budget</text>
<text x="555" y="445" class="value" font-size="9">• +5V from CP1A bus: ~150 mA (Pico + main OLED + strip OLED + LEDs)</text>
<text x="555" y="464" class="value" font-size="9">• +12V from CP1A bus: ~80 mA (slew op-amp, MB-side buffers via DB-9 B)</text>
<text x="555" y="483" class="value" font-size="9">• -12V from CP1A bus: ~50 mA (op-amp negative rails)</text>
<text x="555" y="502" class="value" font-size="9">• CP1A rated: ±12V @ 500 mA, +5V @ 1 A → comfortable headroom.</text>
<text x="555" y="521" class="value" font-size="9">• Pico filter: 1N5817 (0.2 V drop) + 100 µF + 100 nF — shop-stocked parts.</text>
<text x="555" y="540" class="value" font-size="9">• Optional armor (defer): PPTC 500 mA fuse, SMAJ5.0A TVS, ferrite bead.</text></svg>