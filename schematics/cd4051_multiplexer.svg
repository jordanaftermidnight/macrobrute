<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="800" height="600" fill="#FEFEFE"/>
<text x="400" y="25" class="title" text-anchor="middle">CD4051 Analog Multiplexer</text>
<text x="400" y="42" class="subtitle" text-anchor="middle">8-Channel Signal Selector for Oscilloscope</text>
<rect x="300" y="150" width="200" height="300" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" rx="5"/>
<text x="400" y="175" class="label" text-anchor="middle" fill="#FFF" font-size="12">CD4051</text>
<text x="400" y="195" class="value" text-anchor="middle" fill="#CCC" font-size="9">8-Ch Analog MUX</text>
<text x="230" y="220" class="value" text-anchor="end" font-size="8">X0: Saw</text>
<line x1="235" y1="217" x2="300" y2="217" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="212" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="219" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="245" class="value" text-anchor="end" font-size="8">X1: Square</text>
<line x1="235" y1="242" x2="300" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="237" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="244" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="270" class="value" text-anchor="end" font-size="8">X2: Mix</text>
<line x1="235" y1="267" x2="300" y2="267" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="262" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="269" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="295" class="value" text-anchor="end" font-size="8">X3: VCF</text>
<line x1="235" y1="292" x2="300" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="287" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="294" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="320" class="value" text-anchor="end" font-size="8">X4: LFO</text>
<line x1="235" y1="317" x2="300" y2="317" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="312" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="319" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="345" class="value" text-anchor="end" font-size="8">X5: Env</text>
<line x1="235" y1="342" x2="300" y2="342" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="337" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="344" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="370" class="value" text-anchor="end" font-size="8">X6: NC</text>
<line x1="235" y1="367" x2="300" y2="367" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="362" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="369" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="230" y="395" class="value" text-anchor="end" font-size="8">X7: NC</text>
<line x1="235" y1="392" x2="300" y2="392" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="245" y="387" width="20" height="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
<text x="255" y="394" class="value" text-anchor="middle" font-size="8">1kΩ</text>
<text x="570" y="300" class="value" font-size="9">COM (Output)</text>
<line x1="500" y1="297" x2="560" y2="297" stroke="#1a1a1a" stroke-width="2"/>
<rect x="580" y="280" width="60" height="35" fill="#F5A623" stroke="#333" stroke-width="1" rx="3"/>
<text x="610" y="297" class="label" text-anchor="middle" fill="#FFF" font-size="8">TL072</text>
<text x="610" y="308" class="value" text-anchor="middle" fill="#FFF" font-size="7">Buffer</text>
<line x1="640" y1="297" x2="700" y2="297" stroke="#1a1a1a" stroke-width="2"/>
<text x="710" y="300" class="label" font-size="9">To DSO138 IN</text>
<line x1="340" y1="450" x2="340" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="340" y="480" class="value" text-anchor="middle" font-size="8">A (LSB)</text>
<line x1="400" y1="450" x2="400" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="400" y="480" class="value" text-anchor="middle" font-size="8">B</text>
<line x1="460" y1="450" x2="460" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="460" y="480" class="value" text-anchor="middle" font-size="8">C (MSB)</text>
<rect x="300" y="500" width="200" height="80" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="3"/>
<text x="400" y="525" class="label" text-anchor="middle" fill="#1B5E20" font-size="10">Control (Pico GPIO or Switch)</text>
<text x="320" y="545" class="value" font-size="7">Position 0 (Saw):   A=0, B=0, C=0</text>
<text x="320" y="560" class="value" font-size="7">Position 1 (Sqr):   A=1, B=0, C=0</text>
<text x="320" y="575" class="value" font-size="7">Position 2 (Mix):   A=0, B=1, C=0</text>
<text x="400" y="140" class="value" text-anchor="middle" font-size="8">VDD = +5V</text>
<line x1="400" y1="145" x2="400" y2="150" stroke="#CC0000" stroke-width="1.5"/>
<text x="350" y="140" class="value" text-anchor="middle" font-size="8">VEE = GND</text>
<line x1="350" y1="145" x2="350" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="450" y="140" class="value" text-anchor="middle" font-size="8">VSS = GND</text>
<line x1="450" y1="145" x2="450" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="320" y="135" class="value" font-size="7">INH→GND</text>
<line x1="320" y1="145" x2="320" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="50" y="420" width="220" height="160" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="160" y="445" class="label" text-anchor="middle" fill="#E65100" font-size="10">How It Works</text>
<text x="60" y="465" class="value" font-size="7">1. 8 analog inputs (X0-X7)</text>
<text x="60" y="477" class="value" font-size="7">2. 3-bit address (A,B,C)</text>
<text x="60" y="489" class="value" font-size="7">   selects channel</text>
<text x="60" y="501" class="value" font-size="7">3. Selected channel →</text>
<text x="60" y="513" class="value" font-size="7">   COM output</text>
<text x="60" y="525" class="value" font-size="7">4. TL072 buffers signal</text>
<text x="60" y="537" class="value" font-size="7">   to DSO138</text>
<text x="60" y="549" class="value" font-size="7">5. 1kΩ resistors protect</text>
<text x="60" y="561" class="value" font-size="7">   inputs from shorts</text></svg>