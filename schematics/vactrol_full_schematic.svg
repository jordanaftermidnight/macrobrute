<line x1="310" y1="102" x2="310" y2="160" class="wire"/>
<line x1="310" y1="160" x2="310" y2="172" class="wire"/>
<line x1="300" y1="172" x2="320" y2="172" class="wire" stroke-width="2"/>
<line x1="304" y1="176" x2="316" y2="176" class="wire" stroke-width="1.5"/>
<text x="480" y="50" class="label">Current Control</text>
<line x1="390" y1="100" x2="450" y2="100" class="wire"/>
<path d="M455,100 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="480" y="122" class="value" text-anchor="middle">1kΩ</text>
<line x1="510" y1="100" x2="550" y2="100" class="wire"/>
