<text x="500" y="280" class="label">Vactrol LED</text>
<line x1="575" y1="115" x2="575" y2="80" class="wire"/>
<line x1="575" y1="80" x2="500" y2="80" class="wire"/>
<polygon points="500,60 500,100 530,80" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
<line x1="530" y1="60" x2="530" y2="100" stroke="#CC0000" stroke-width="2"/>
<line x1="530" y1="80" x2="600" y2="80" class="wire"/>
<line x1="620" y1="80" x2="620" y2="68" class="wire" stroke="#D44" stroke-width="2"/>
<text x="624" y="74" class="value" fill="#D44">+12V</text>
<text x="50" y="350" class="label">Vactrol LDR Side</text>
<rect x="80" y="370" width="60" height="40" fill="#8B7355" stroke="#5D4E37" stroke-width="2" rx="3"/>
<text x="110" y="395" class="value" font-size="8" text-anchor="middle" fill="#FFF">LDR</text>
<line x1="140" y1="380" x2="200" y2="380" class="wire"/>
<text x="210" y="383" class="value" font-size="9">→ RP13 (Resonance Pot)</text>
<line x1="140" y1="400" x2="200" y2="400" class="wire"/>
<text x="210" y="403" class="value" font-size="9">→ Filter CV Node</text>
<rect x="50" y="450" width="600" height="170" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="4"/>
<text x="350" y="475" class="label" text-anchor="middle" fill="#2E7D32">How the Vactrol Driver Works</text>
<text x="70" y="495" class="label" font-size="9" fill="#1B5E20">1. CV Input (0-10V):</text>
<text x="200" y="495" class="value" font-size="9">From DB-9 B Pin 3, attenuated by 100k pot to 0-5V range</text>
<text x="70" y="513" class="label" font-size="9" fill="#1B5E20">2. Buffer Stage:</text>
<text x="200" y="513" class="value" font-size="9">TL072 unity gain buffer isolates CV source from driver circuit</text>
<text x="70" y="531" class="label" font-size="9" fill="#1B5E20">3. Current Control:</text>
<text x="200" y="531" class="value" font-size="9">NPN transistor acts as variable current sink, controlled by base voltage</text>
<text x="70" y="549" class="label" font-size="9" fill="#1B5E20">4. LED Brightness:</text>
<text x="200" y="549" class="value" font-size="9">Higher CV → More base current → More LED current → Brighter LED</text>
<text x="70" y="567" class="label" font-size="9" fill="#1B5E20">5. LDR Response:</text>
<text x="200" y="567" class="value" font-size="9">Brighter LED → Lower LDR resistance → More resonance in filter</text>
<text x="70" y="585" class="label" font-size="9" fill="#1B5E20">6. 1kΩ Resistors:</text>
<text x="200" y="585" class="value" font-size="9">Limit LED current to ~5mA max (safe for LDR and long LED life)</text></svg>