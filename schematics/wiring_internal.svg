<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
<defs>
  <filter id="ts">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="d"/>
    <feComposite in="bg" in2="d" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#666"/>
  </marker>
</defs>
<style>
  .t { font: bold 16px sans-serif; fill: #1a1a1a; filter: url(#ts); }
  .st { font: 11px sans-serif; fill: #555; filter: url(#ts); }
  .l { font: bold 10px sans-serif; fill: #1a1a1a; filter: url(#ts); }
  .v { font: 9px sans-serif; fill: #555; filter: url(#ts); }
  .sl { font: bold 9px sans-serif; fill: #FFF; text-anchor: middle; }
</style>
<rect width="900" height="550" fill="#FEFEFE"/>
<text x="450" y="25" class="t" text-anchor="middle">Internal Wiring — MicroBrute to Breakout</text>
<text x="450" y="45" class="st" text-anchor="middle">Test Point Connections</text>
<rect x="50" y="80" width="150" height="400" fill="#E8D5A3" stroke="#B8722D" stroke-width="2" rx="4"/>
<text x="125" y="70" class="l" text-anchor="middle" font-size="11" fill="#333">MicroBrute</text>
<text x="125" y="95" class="v" text-anchor="middle" font-size="9" fill="#333">Test Points</text>
<rect x="700" y="80" width="150" height="400" fill="#C4A265" stroke="#8B6914" stroke-width="2" rx="4"/>
<text x="775" y="70" class="l" text-anchor="middle" font-size="11" fill="#333">Breakout</text>
<text x="775" y="95" class="v" text-anchor="middle" font-size="9" fill="#333">Connectors</text>
<text x="450" y="120" class="l" text-anchor="middle" font-size="10" fill="#0066CC">AUDIO OUTPUTS (1kΩ series resistors)</text>
<text x="60" y="140" class="v" text-anchor="start" font-size="9" fill="#333">TP94 Saw</text>
<line x1="200" y1="137" x2="700" y2="137" stroke="#0066CC" stroke-width="2"/>
<path d="M350,137 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="130" class="v" text-anchor="middle" font-size="7" fill="#333">1kΩ</text>
<text x="710" y="140" class="v" text-anchor="start" font-size="9" fill="#333">→ J1-1</text>
<text x="60" y="165" class="v" text-anchor="start" font-size="9" fill="#333">TP93 Square</text>
<line x1="200" y1="162" x2="700" y2="162" stroke="#0066CC" stroke-width="2"/>
<path d="M350,162 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="155" class="v" text-anchor="middle" font-size="7" fill="#333">1kΩ</text>
<text x="710" y="165" class="v" text-anchor="start" font-size="9" fill="#333">→ J1-2</text>
<text x="60" y="190" class="v" text-anchor="start" font-size="9" fill="#333">TP30 Mix</text>
<line x1="200" y1="187" x2="700" y2="187" stroke="#0066CC" stroke-width="2"/>
<path d="M350,187 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="180" class="v" text-anchor="middle" font-size="7" fill="#333">1kΩ</text>
<text x="710" y="190" class="v" text-anchor="start" font-size="9" fill="#333">→ J1-4</text>
<text x="60" y="215" class="v" text-anchor="start" font-size="9" fill="#333">TP19 VCF</text>
<line x1="200" y1="212" x2="700" y2="212" stroke="#0066CC" stroke-width="2"/>
<path d="M350,212 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="205" class="v" text-anchor="middle" font-size="7" fill="#333">1kΩ</text>
<text x="710" y="215" class="v" text-anchor="start" font-size="9" fill="#333">→ J1-3</text>
<text x="60" y="240" class="v" text-anchor="start" font-size="9" fill="#333">TP124 Triangle</text>
<line x1="200" y1="237" x2="700" y2="237" stroke="#0066CC" stroke-width="2"/>
<path d="M350,237 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="230" class="v" text-anchor="middle" font-size="7" fill="#333">1kΩ</text>
<text x="710" y="240" class="v" text-anchor="start" font-size="9" fill="#333">→ J1-5</text>
<text x="450" y="280" class="l" text-anchor="middle" font-size="10" fill="#009933">GATE & CV (10kΩ series resistors)</text>
<text x="60" y="300" class="v" text-anchor="start" font-size="9" fill="#333">TP83 Gate</text>
<line x1="200" y1="297" x2="700" y2="297" stroke="#009933" stroke-width="2"/>
<path d="M350,297 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="290" class="v" text-anchor="middle" font-size="7" fill="#333">10kΩ</text>
<text x="710" y="300" class="v" text-anchor="start" font-size="9" fill="#333">→ J2-1</text>
<text x="60" y="325" class="v" text-anchor="start" font-size="9" fill="#333">Env (matrix)</text>
<line x1="200" y1="322" x2="700" y2="322" stroke="#CC6600" stroke-width="2"/>
<path d="M350,322 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="315" class="v" text-anchor="middle" font-size="7" fill="#333">10kΩ</text>
<text x="710" y="325" class="v" text-anchor="start" font-size="9" fill="#333">→ J3-1</text>
<text x="60" y="350" class="v" text-anchor="start" font-size="9" fill="#333">LFO (matrix)</text>
<line x1="200" y1="347" x2="700" y2="347" stroke="#CC6600" stroke-width="2"/>
<path d="M350,347 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5" stroke="#8B4513" stroke-width="2" fill="none"/>
<text x="450" y="340" class="v" text-anchor="middle" font-size="7" fill="#333">10kΩ</text>
<text x="710" y="350" class="v" text-anchor="start" font-size="9" fill="#333">→ J3-2</text>
<text x="450" y="390" class="l" text-anchor="middle" font-size="10" fill="#CC0000">POWER (Direct connection)</text>
<text x="60" y="410" class="v" text-anchor="start" font-size="9" fill="#CC0000">TP70 +12V</text>
<line x1="200" y1="407" x2="700" y2="407" stroke="#CC0000" stroke-width="3"/>
<text x="710" y="410" class="v" text-anchor="start" font-size="9" fill="#CC0000">→ Power header +12V</text>
<text x="60" y="435" class="v" text-anchor="start" font-size="9" fill="#0000CC">TP71 -12V</text>
<line x1="200" y1="432" x2="700" y2="432" stroke="#0000CC" stroke-width="3"/>
<text x="710" y="435" class="v" text-anchor="start" font-size="9" fill="#0000CC">→ Power header -12V</text>
<text x="60" y="460" class="v" text-anchor="start" font-size="9" fill="#1a1a1a">TP72 GND</text>
<line x1="200" y1="457" x2="700" y2="457" stroke="#1a1a1a" stroke-width="3"/>
<text x="710" y="460" class="v" text-anchor="start" font-size="9" fill="#1a1a1a">→ Power header GND</text>
<text x="450" y="510" class="v" text-anchor="middle" font-size="9" fill="#333">Wire Gauge: Signals = 24AWG | Power = 22AWG</text>
<text x="450" y="530" class="v" text-anchor="middle" font-size="8" fill="#333">All series resistors mounted on Breakout PCB for protection</text>
</svg>