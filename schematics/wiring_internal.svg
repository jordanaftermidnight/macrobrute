<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="800" height="650" fill="#FEFEFE"/>
<text x="400" y="25" class="title" text-anchor="middle">Internal Wiring — MicroBrute to Breakout</text>
<text x="400" y="42" class="subtitle" text-anchor="middle">Test point taps with elbow routing</text>
<text x="550" y="30" class="label" font-size="10">Signal Groups:</text>
<rect x="550" y="39" width="15" height="8" fill="#0066CC" stroke="#333" stroke-width="0.5"/>
<text x="570" y="45" class="value" font-size="8">Audio (Saw, Square, Mix, VCF, Tri)</text>
<rect x="550" y="54" width="15" height="8" fill="#CC6600" stroke="#333" stroke-width="0.5"/>
<text x="570" y="60" class="value" font-size="8">CV (Pitch, Env, LFO)</text>
<rect x="550" y="69" width="15" height="8" fill="#009933" stroke="#333" stroke-width="0.5"/>
<text x="570" y="75" class="value" font-size="8">Gate</text>
<rect x="550" y="84" width="15" height="8" fill="#CC0000" stroke="#333" stroke-width="0.5"/>
<text x="570" y="90" class="value" font-size="8">+12V</text>
<rect x="550" y="99" width="15" height="8" fill="#0000CC" stroke="#333" stroke-width="0.5"/>
<text x="570" y="105" class="value" font-size="8">-12V</text>
<rect x="550" y="114" width="15" height="8" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
<text x="570" y="120" class="value" font-size="8">GND</text>
<text x="400" y="65" class="label" text-anchor="middle" font-size="11">Signal Flow: MicroBrute → Breakout</text>
<text x="400" y="78" class="value" text-anchor="middle" font-size="8">All signals tap from MicroBrute rear board test points to Breakout PCB</text>
<rect x="50" y="90" width="140" height="510" fill="#E8D5A3" stroke="#B8722D" stroke-width="2" rx="4"/>
<text x="120" y="85" class="label" text-anchor="middle">FROM: MicroBrute PCB</text>
<text x="120" y="615" class="value" text-anchor="middle" font-size="9">Rear Board Test Points</text>
<rect x="610" y="90" width="140" height="510" fill="#C4A265" stroke="#8B6914" stroke-width="2" rx="4"/>
<text x="680" y="85" class="label" text-anchor="middle">TO: Breakout PCB</text>
<rect x="40" y="90" width="720" height="100" fill="#E3F2FD" stroke="#0066CC" stroke-width="1" stroke-dasharray="5,3" opacity="0.3"/>
<text x="60" y="105" class="label" font-size="9" fill="#0066CC">AUDIO OUTPUTS</text>
<text x="55" y="133" class="value" font-size="9" text-anchor="end">TP94 Saw</text>
<path d="M190,130 L350,130 L350,130 L600,130" stroke="#0066CC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,130 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="152" class="value" text-anchor="middle">1kΩ</text>
<text x="615" y="133" class="value" font-size="9">→ J1-1</text>
<text x="55" y="158" class="value" font-size="9" text-anchor="end">TP93 Square</text>
<path d="M190,155 L350,155 L350,155 L600,155" stroke="#0066CC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,155 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="177" class="value" text-anchor="middle">1kΩ</text>
<text x="615" y="158" class="value" font-size="9">→ J1-2</text>
<text x="55" y="183" class="value" font-size="9" text-anchor="end">TP30 Mix</text>
<path d="M190,180 L350,180 L350,180 L600,180" stroke="#0066CC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,180 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="202" class="value" text-anchor="middle">1kΩ</text>
<text x="615" y="183" class="value" font-size="9">→ J1-4</text>
<text x="55" y="213" class="value" font-size="9" text-anchor="end">TP19 VCF</text>
<path d="M190,210 L350,210 L350,210 L600,210" stroke="#0066CC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,210 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="232" class="value" text-anchor="middle">1kΩ</text>
<text x="615" y="213" class="value" font-size="9">→ J1-3</text>
<text x="55" y="238" class="value" font-size="9" text-anchor="end">TP124 Triangle</text>
<path d="M190,235 L350,235 L350,235 L600,235" stroke="#0066CC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,235 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="257" class="value" text-anchor="middle">1kΩ</text>
<text x="615" y="238" class="value" font-size="9">→ J1-5</text>
<rect x="40" y="250" width="720" height="110" fill="#E8F5E9" stroke="#009933" stroke-width="1" stroke-dasharray="5,3" opacity="0.3"/>
<text x="60" y="265" class="label" font-size="9" fill="#009933">GATE & MODULATION</text>
<text x="55" y="283" class="value" font-size="9" text-anchor="end">TP83 Gate</text>
<path d="M190,280 L350,280 L350,280 L600,280" stroke="#009933" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,280 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="302" class="value" text-anchor="middle">10kΩ</text>
<text x="615" y="283" class="value" font-size="9">→ J2-1</text>
<text x="55" y="313" class="value" font-size="9" text-anchor="end">Env (matrix)</text>
<path d="M190,310 L350,310 L350,310 L600,310" stroke="#CC6600" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,310 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="332" class="value" text-anchor="middle">10kΩ</text>
<text x="615" y="313" class="value" font-size="9">→ J3-1</text>
<text x="55" y="338" class="value" font-size="9" text-anchor="end">LFO (matrix)</text>
<path d="M190,335 L350,335 L350,335 L600,335" stroke="#CC6600" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M245,335 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,-6 l5,6 l5,0" class="component"/>
<text x="270" y="357" class="value" text-anchor="middle">10kΩ</text>
<text x="615" y="338" class="value" font-size="9">→ J3-2</text>
<rect x="40" y="370" width="720" height="130" fill="#FFEBEE" stroke="#CC0000" stroke-width="1" stroke-dasharray="5,3" opacity="0.3"/>
<text x="60" y="385" class="label" font-size="9" fill="#CC0000">POWER TAPS</text>
<text x="55" y="413" class="value" font-size="9" text-anchor="end" fill="#CC0000">TP70 +12V</text>
<path d="M190,410 L350,410 L350,410 L600,410" stroke="#CC0000" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
<text x="615" y="413" class="value" font-size="9" fill="#CC0000">→ Power header +12V</text>
<text x="55" y="448" class="value" font-size="9" text-anchor="end" fill="#0000CC">TP71 -12V</text>
<path d="M190,445 L350,445 L350,445 L600,445" stroke="#0000CC" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
<text x="615" y="448" class="value" font-size="9" fill="#0000CC">→ Power header -12V</text>
<text x="55" y="483" class="value" font-size="9" text-anchor="end" fill="#1a1a1a">TP72 GND</text>
<path d="M190,480 L350,480 L350,480 L600,480" stroke="#1a1a1a" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
<text x="615" y="483" class="value" font-size="9" fill="#1a1a1a">→ Power header GND</text>
<text x="400" y="580" class="value" text-anchor="middle" font-size="10">Wire Gauge: Signals = 24AWG | Power = 22AWG</text>
<text x="400" y="600" class="value" text-anchor="middle" font-size="9">All series resistors mounted on Breakout PCB for protection</text></svg>