<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="620" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M01 — Triangle Output Gain ×2</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">Restore level parity with saw/square (TL074 D follower in breakout PCB)</text>
<text x="80" y="120" class="label" font-size="11">TP124 (triangle, ~5 Vpp)</text>
<line x1="80" y1="140" x2="240" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="250,110 250,170 310,140" class="component"/>
<text x="280" y="145" class="label" text-anchor="middle" font-size="9">TL074 D</text>
<text x="247" y="122" class="pin" text-anchor="end">-</text>
<text x="247" y="158" class="pin" text-anchor="end">+</text>
<line x1="310" y1="140" x2="380" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="380" y1="140" x2="380" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="380" y1="200" x2="200" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="275" y="194" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="290" y="203" class="value" text-anchor="middle" font-size="8">33k Rf (was 16k)</text>
<line x1="200" y1="200" x2="200" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="200" y1="200" x2="200" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="194" y="245" width="12" height="30" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="212" y="263" class="value" font-size="8">16k Rg</text>
<line x1="200" y1="290" x2="200" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="200" y1="320" x2="200" y2="332" class="wire"/>
<line x1="190" y1="332" x2="210" y2="332" class="wire" stroke-width="2"/>
<line x1="194" y1="336" x2="206" y2="336" class="wire" stroke-width="1.5"/>
<line x1="380" y1="140" x2="540" y2="140" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="580" cy="140" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="580" cy="140" r="5" fill="#1a1a1a"/>
<text x="580" y="118" class="label" text-anchor="middle" font-size="10">DB-9 A:7 (triangle out)</text>
<text x="450" y="130" class="anno" text-anchor="middle" font-size="9">A = 1 + Rf/Rg ≈ 2.06×</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× 33 kΩ resistor (replaces existing 16 kΩ feedback R)</text>
<text x="55" y="563" class="value" font-size="9">• Effect: triangle level matches saw/square at the DB-9 A jack (within ±1 dB)</text>
<text x="55" y="578" class="value" font-size="9">• Single-component swap — no PCB cuts, no panel work</text></svg>