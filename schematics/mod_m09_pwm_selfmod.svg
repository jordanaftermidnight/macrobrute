<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="540" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M09 — PWM Self-Modulation (normalled jack)</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">Saw out → 100kΩ → PWM CV (default). Plug a cable to break the loop.</text>
<text x="60" y="130" class="label" font-size="11">Saw output (TP94 area)</text>
<line x1="60" y1="180" x2="200" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="215" y="174" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="230" y="183" class="value" text-anchor="middle" font-size="8">100k</text>
<line x1="245" y1="180" x2="320" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="320" y="160" width="120" height="40" fill="none" stroke="#1a1a1a" stroke-width="2" rx="3"/>
<text x="380" y="155" class="label" text-anchor="middle" font-size="10">Switching jack</text>
<text x="380" y="195" class="value" text-anchor="middle" font-size="9">tip · normal · sleeve</text>
<text x="380" y="218" class="value" text-anchor="middle" font-size="8">(M06 panel jack body — re-used)</text>
<line x1="440" y1="180" x2="560" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="570" y="184" class="label" font-size="10">→ M06 PWM CV node</text>
<rect x="40" y="240" width="820" height="60" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="450" y="262" class="label" text-anchor="middle" font-size="11" fill="#E65100">How it behaves</text>
<text x="60" y="282" class="value" font-size="9">No cable plugged: the saw self-modulates the PWM via 100 kΩ → metallic FM-ish PWM textures by default.</text>
<text x="60" y="296" class="value" font-size="9">Cable plugged into M06 jack: the switch breaks the saw → normal contact, lets external CV take over.</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× 6 mm switching (normalled) Thonkiconn jack — replaces the plain jack from M06</text>
<text x="55" y="563" class="value" font-size="9">• 1× 100 kΩ series resistor (saw → normal contact)</text>
<text x="55" y="578" class="value" font-size="9">• Cooperates with M06: same panel hole, two behaviours depending on plug state</text></svg>