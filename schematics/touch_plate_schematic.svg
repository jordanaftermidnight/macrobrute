<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="800" height="700" fill="#FEFEFE"/>
<text x="400" y="25" class="title" text-anchor="middle">Touch Plate Interface</text>
<text x="400" y="42" class="subtitle" text-anchor="middle">Resistive Bend Points for Body Contact Circuit Bending</text>
<text x="50" y="50" class="label" font-size="12" fill="#CC6600">Touch Plates (Conductive Copper Pads)</text>
<rect x="80" y="90" width="100" height="50" fill="#B87333" stroke="#8B4513" stroke-width="2" rx="5"/>
<text x="130" y="110" class="label" text-anchor="middle" fill="#FFF" font-size="9">OSC Pitch</text>
<text x="130" y="128" class="value" text-anchor="middle" fill="#FFD700" font-size="7">Touch Here</text>
<line x1="180" y1="115" x2="220" y2="115" class="wire"/>
<text x="225" y="118" class="value" font-size="8">→ TP12</text>
<text x="280" y="118" class="value" font-size="7" fill="#666">Oscillator frequency bend</text>
<rect x="80" y="160" width="100" height="50" fill="#B87333" stroke="#8B4513" stroke-width="2" rx="5"/>
<text x="130" y="180" class="label" text-anchor="middle" fill="#FFF" font-size="9">Filter Cutoff</text>
<text x="130" y="198" class="value" text-anchor="middle" fill="#FFD700" font-size="7">Touch Here</text>
<line x1="180" y1="185" x2="220" y2="185" class="wire"/>
<text x="225" y="188" class="value" font-size="8">→ TP17</text>
<text x="280" y="188" class="value" font-size="7" fill="#666">Filter resonance bend</text>
<rect x="80" y="230" width="100" height="50" fill="#B87333" stroke="#8B4513" stroke-width="2" rx="5"/>
<text x="130" y="250" class="label" text-anchor="middle" fill="#FFF" font-size="9">LFO Rate</text>
<text x="130" y="268" class="value" text-anchor="middle" fill="#FFD700" font-size="7">Touch Here</text>
<line x1="180" y1="255" x2="220" y2="255" class="wire"/>
<text x="225" y="258" class="value" font-size="8">→ TP68</text>
<text x="280" y="258" class="value" font-size="7" fill="#666">LFO speed modulation</text>
<rect x="80" y="300" width="100" height="50" fill="#B87333" stroke="#8B4513" stroke-width="2" rx="5"/>
<text x="130" y="320" class="label" text-anchor="middle" fill="#FFF" font-size="9">VCA Response</text>
<text x="130" y="338" class="value" text-anchor="middle" fill="#FFD700" font-size="7">Touch Here</text>
<line x1="180" y1="325" x2="220" y2="325" class="wire"/>
<text x="225" y="328" class="value" font-size="8">→ TP9/10</text>
<text x="280" y="328" class="value" font-size="7" fill="#666">Amplitude envelope bend</text>
<text x="50" y="380" class="label" font-size="12">Series Resistors (Limit Current)</text>
<path d="M80,395 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l0,5" class="component"/>
<text x="60" y="415" class="label" text-anchor="end">R1</text>
<text x="92" y="420" class="value">100kΩ</text>
<text x="80" y="465" class="value" font-size="7" text-anchor="middle">OSC</text>
<path d="M200,395 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l0,5" class="component"/>
<text x="180" y="415" class="label" text-anchor="end">R2</text>
<text x="212" y="420" class="value">220kΩ</text>
<text x="200" y="465" class="value" font-size="7" text-anchor="middle">Filter</text>
<path d="M320,395 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l0,5" class="component"/>
<text x="300" y="415" class="label" text-anchor="end">R3</text>
<text x="332" y="420" class="value">470kΩ</text>
<text x="320" y="465" class="value" font-size="7" text-anchor="middle">LFO</text>
<path d="M440,395 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l-6,5 l6,5 l0,5" class="component"/>
<text x="420" y="415" class="label" text-anchor="end">R4</text>
<text x="452" y="420" class="value">1MΩ</text>
<text x="440" y="465" class="value" font-size="7" text-anchor="middle">VCA</text>
<text x="50" y="480" class="value" font-size="8">Higher resistance = gentler bend effect</text>
<text x="50" y="495" class="value" font-size="8">Lower resistance = stronger bend effect</text>
<text x="450" y="380" class="label" font-size="12">Pico GPIO Interface</text>
<text x="470" y="420" class="label" font-size="8">GP2 (ADC0)</text>
<text x="550" y="420" class="value" font-size="8">→ Touch sense 1</text>
<text x="470" y="450" class="label" font-size="8">GP3 (ADC1)</text>
<text x="550" y="450" class="value" font-size="8">→ Touch sense 2</text>
<text x="470" y="480" class="label" font-size="8">GP4 (ADC2)</text>
<text x="550" y="480" class="value" font-size="8">→ Touch sense 3</text>
<text x="470" y="510" class="label" font-size="8">GP5 (ADC3)</text>
<text x="550" y="510" class="value" font-size="8">→ Touch sense 4</text>
<rect x="50" y="540" width="700" height="140" fill="#FFF8E1" stroke="#FFB300" stroke-width="1" rx="4"/>
<text x="400" y="565" class="label" text-anchor="middle" fill="#E65100">How Touch Bending Works</text>
<text x="70" y="585" class="label" font-size="8" fill="#BF360C">1. Body Resistance:</text>
<text x="170" y="585" class="value" font-size="8">Your skin has resistance (50kΩ-1MΩ depending on moisture)</text>
<text x="70" y="603" class="label" font-size="8" fill="#BF360C">2. Current Flow:</text>
<text x="170" y="603" class="value" font-size="8">When you touch the pad, a tiny current flows through your body to ground</text>
<text x="70" y="621" class="label" font-size="8" fill="#BF360C">3. Voltage Drop:</text>
<text x="170" y="621" class="value" font-size="8">This creates a voltage divider that changes the CV at the test point</text>
<text x="70" y="639" class="label" font-size="8" fill="#BF360C">4. Bend Effect:</text>
<text x="170" y="639" class="value" font-size="8">The circuit interprets this as a control voltage change</text>
<text x="70" y="657" class="label" font-size="8" fill="#BF360C">5. Safety:</text>
<text x="170" y="657" class="value" font-size="8">100kΩ+ resistors limit current to &lt;0.1mA (safe for humans)</text></svg>