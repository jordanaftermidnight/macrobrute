<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="760" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">Audio Signal Flow</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">From VCO Through Filter to Outputs</text>
<rect x="50" y="80" width="100" height="50" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="100.0" y="100.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">Saw VCO</text>
<text x="100.0" y="117.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">-5V to +5V</text>
<rect x="50" y="150" width="100" height="50" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="100.0" y="170.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">Square VCO</text>
<text x="100.0" y="187.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">0V to +5V</text>
<rect x="50" y="220" width="100" height="50" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="100.0" y="240.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">Sub Osc</text>
<text x="100.0" y="257.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">-5V to +5V</text>
<rect x="50" y="290" width="100" height="50" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="100.0" y="310.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">Ext In</text>
<text x="100.0" y="327.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">Line Level</text>
<rect x="50" y="360" width="100" height="50" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="100.0" y="380.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">Noise</text>
<text x="100.0" y="397.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">White/Pink</text>
<rect x="220" y="200" width="110" height="70" fill="#FF9800" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="275.0" y="230.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">MIXER</text>
<text x="275.0" y="247.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">Ultrafaux</text>
<path d="M150,105 L185,105 L185,220 L220,220" stroke="#E91E63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M150,175 L190,175 L190,230 L230,230" stroke="#E91E63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M150,245 L195,245 L195,240 L240,240" stroke="#E91E63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M150,315 L200,315 L200,250 L250,250" stroke="#E91E63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M150,385 L205,385 L205,260 L260,260" stroke="#E91E63" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="400" y="200" width="110" height="70" fill="#2196F3" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="455.0" y="230.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">VCF</text>
<text x="455.0" y="247.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">Steiner-Parker</text>
<path d="M330,235 L365,235 L365,235 L400,235" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="365" y="230" class="value" text-anchor="middle" fill="#666" font-size="7">Mix Out</text>
<rect x="580" y="200" width="110" height="70" fill="#4CAF50" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="635.0" y="230.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">VCA</text>
<text x="635.0" y="247.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">ADSR Controlled</text>
<path d="M510,235 L545,235 L545,235 L580,235" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="545" y="230" class="value" text-anchor="middle" fill="#666" font-size="7">Filter Out</text>
<rect x="760" y="200" width="110" height="70" fill="#9C27B0" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="815.0" y="230.0" class="label comp-label" text-anchor="middle" fill="#FFF" font-size="10">MAIN OUT</text>
<text x="815.0" y="247.0" class="value comp-label" text-anchor="middle" fill="#FFF" font-size="8">Line Level</text>
<path d="M690,235 L725,235 L725,235 L760,235" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="445" class="label" text-anchor="middle" font-size="10" font-weight="700">Buffered Test Point Outputs</text>
<circle cx="100" cy="470" r="5" fill="#666" stroke="#333" stroke-width="1"/>
<text x="100" y="488" class="value" text-anchor="middle" font-size="7">TP94 Saw</text>
<circle cx="200" cy="470" r="5" fill="#666" stroke="#333" stroke-width="1"/>
<text x="200" y="488" class="value" text-anchor="middle" font-size="7">TP93 Square</text>
<circle cx="320" cy="470" r="5" fill="#666" stroke="#333" stroke-width="1"/>
<text x="320" y="488" class="value" text-anchor="middle" font-size="7">TP30 Mix</text>
<circle cx="455" cy="470" r="5" fill="#666" stroke="#333" stroke-width="1"/>
<text x="455" y="488" class="value" text-anchor="middle" font-size="7">TP19 VCF</text>
<circle cx="595" cy="470" r="5" fill="#666" stroke="#333" stroke-width="1"/>
<text x="595" y="488" class="value" text-anchor="middle" font-size="7">TP10/11 VCA</text>
<circle cx="760" cy="470" r="5" fill="#666" stroke="#333" stroke-width="1"/>
<text x="760" y="488" class="value" text-anchor="middle" font-size="7">Main Line Out</text>
<line x1="100" y1="465" x2="100" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="100" y="502" class="value" text-anchor="middle" font-size="8" fill="#666">via buffer</text>
<line x1="200" y1="465" x2="200" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="200" y="502" class="value" text-anchor="middle" font-size="8" fill="#666">via buffer</text>
<line x1="320" y1="465" x2="320" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="320" y="502" class="value" text-anchor="middle" font-size="8" fill="#666">1kΩ + TL074</text>
<line x1="455" y1="465" x2="455" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="455" y="502" class="value" text-anchor="middle" font-size="8" fill="#666">1kΩ + TL074</text>
<line x1="595" y1="465" x2="595" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="595" y="502" class="value" text-anchor="middle" font-size="8" fill="#666">1kΩ + TL074</text>
<line x1="760" y1="465" x2="760" y2="270" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
<text x="760" y="502" class="value" text-anchor="middle" font-size="8" fill="#666">Direct</text>
<rect x="50" y="525" width="800" height="220" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="4"/>
<text x="450" y="547" class="label" text-anchor="middle" fill="#1B5E20">Signal Flow &amp; Test Point Notes</text>
<text x="70" y="575" class="label" font-size="9" fill="#1B5E20" font-weight="700">Signal Path:</text>
<text x="160" y="575" class="value" font-size="9">Saw/Square/Sub/Ext/Noise → Mixer → VCF → VCA → Main Out</text>
<text x="70" y="596" class="label" font-size="9" fill="#1B5E20" font-weight="700">VCO Outputs:</text>
<text x="160" y="596" class="value" font-size="9">Raw waveforms (-5V to +5V, ~10Vpp) available at TP94, TP93 via buffers</text>
<text x="70" y="617" class="label" font-size="9" fill="#1B5E20" font-weight="700">Mixer Stage:</text>
<text x="160" y="617" class="value" font-size="9">Ultrafaux passive mixer with 5 inputs and individual level controls</text>
<text x="70" y="638" class="label" font-size="9" fill="#1B5E20" font-weight="700">VCF Stage:</text>
<text x="160" y="638" class="value" font-size="9">Steiner-Parker filter (12dB/octave) with resonance control via RP13</text>
<text x="70" y="659" class="label" font-size="9" fill="#1B5E20" font-weight="700">VCA Stage:</text>
<text x="160" y="659" class="value" font-size="9">Controlled by ADSR envelope (attack, decay, sustain, release)</text>
<text x="70" y="680" class="label" font-size="9" fill="#1B5E20" font-weight="700">Test Points:</text>
<text x="160" y="680" class="value" font-size="9">All TPs have 1kΩ series resistor + TL074 buffer for safe external patching</text>
<text x="70" y="701" class="label" font-size="9" fill="#1B5E20" font-weight="700">Protection:</text>
<text x="160" y="701" class="value" font-size="9">Outputs are current-limited and buffered - safe for Eurorack/modular systems</text>
<text x="70" y="722" class="label" font-size="9" fill="#1B5E20" font-weight="700">Buffering:</text>
<text x="160" y="722" class="value" font-size="9">Required because direct wiring causes oscillator loading and signal degradation</text></svg>