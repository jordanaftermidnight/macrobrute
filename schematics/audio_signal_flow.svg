<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
<defs>
  <filter id="ts">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="d"/>
    <feComposite in="bg" in2="d" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#333"/>
  </marker>
</defs>
<style>
  .t { font: bold 16px sans-serif; fill: #1a1a1a; filter: url(#ts); }
  .st { font: 11px sans-serif; fill: #555; filter: url(#ts); }
  .l { font: bold 10px sans-serif; fill: #1a1a1a; filter: url(#ts); }
  .v { font: 9px sans-serif; fill: #555; filter: url(#ts); }
  .sl { font: bold 9px sans-serif; fill: #FFF; text-anchor: middle; }
</style>
<rect width="850" height="450" fill="#FEFEFE"/>
<text x="425" y="25" class="t" text-anchor="middle">Audio Signal Flow</text>
<text x="425" y="45" class="st" text-anchor="middle">VCO → Mixer → Filter → VCA → Output</text>
<rect x="30" y="50" width="80" height="28" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="70.0" y="62.0" class="sl" font-size="10">Saw</text>
<text x="70.0" y="76.0" class="sl" font-size="8">-5/+5V</text>
<rect x="30" y="85" width="80" height="28" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="70.0" y="97.0" class="sl" font-size="10">Square</text>
<text x="70.0" y="111.0" class="sl" font-size="8">0/+5V</text>
<rect x="30" y="120" width="80" height="28" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="70.0" y="132.0" class="sl" font-size="10">Sub</text>
<text x="70.0" y="146.0" class="sl" font-size="8">-5/+5V</text>
<rect x="30" y="155" width="80" height="28" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="70.0" y="167.0" class="sl" font-size="10">Ext In</text>
<text x="70.0" y="181.0" class="sl" font-size="8">Line</text>
<rect x="30" y="190" width="80" height="28" fill="#E91E63" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="70.0" y="202.0" class="sl" font-size="10">Noise</text>
<text x="70.0" y="216.0" class="sl" font-size="8">White</text>
<rect x="170" y="110" width="90" height="50" fill="#FF9800" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="215.0" y="133.0" class="sl" font-size="10">5-Input</text>
<text x="215.0" y="147.0" class="sl" font-size="8">Mixer</text>
<line x1="110" y1="64" x2="170" y2="135" stroke="#E91E63" stroke-width="2"/>
<line x1="110" y1="99" x2="170" y2="135" stroke="#E91E63" stroke-width="2"/>
<line x1="110" y1="134" x2="170" y2="135" stroke="#E91E63" stroke-width="2"/>
<line x1="110" y1="169" x2="170" y2="135" stroke="#E91E63" stroke-width="2"/>
<line x1="110" y1="204" x2="170" y2="135" stroke="#E91E63" stroke-width="2"/>
<rect x="320" y="115" width="80" height="45" fill="#2196F3" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="360.0" y="135.5" class="sl" font-size="10">VCF</text>
<text x="360.0" y="149.5" class="sl" font-size="8">Filter</text>
<line x1="260" y1="135" x2="320" y2="137" stroke="#FF9800" stroke-width="3"/>
<rect x="460" y="115" width="80" height="45" fill="#4CAF50" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="500.0" y="135.5" class="sl" font-size="10">VCA</text>
<text x="500.0" y="149.5" class="sl" font-size="8">ADSR</text>
<line x1="400" y1="137" x2="460" y2="137" stroke="#2196F3" stroke-width="3"/>
<rect x="600" y="115" width="90" height="45" fill="#9C27B0" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="645.0" y="135.5" class="sl" font-size="10">MAIN</text>
<text x="645.0" y="149.5" class="sl" font-size="8">Output</text>
<line x1="540" y1="137" x2="600" y2="137" stroke="#4CAF50" stroke-width="3"/>
<text x="425" y="185" class="v" text-anchor="middle" font-size="8" fill="#333">Test Points: TP94 (Saw), TP93 (Sqr), TP30 (Mix), TP19 (VCF), TP10/11 (VCA)</text>
<rect x="30" y="220" width="790" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="4"/>
<text x="425" y="240" class="l" text-anchor="middle" font-size="10" fill="#1B5E20">Notes</text>
<text x="50" y="265" class="v" text-anchor="start" font-size="9" fill="#333">Path: Saw/Square/Sub/Ext/Noise → Mixer → VCF → VCA → Main Out</text>
<text x="50" y="285" class="v" text-anchor="start" font-size="9" fill="#333">Mixer: Passive with 5 inputs including noise | VCF: Steiner-Parker 12dB/oct</text>
<text x="50" y="305" class="v" text-anchor="start" font-size="9" fill="#333">All test points buffered with 1kΩ + TL074 for protection</text>
<text x="140" y="100" class="v" text-anchor="middle" font-size="7" fill="#666">1kΩ+buf</text>
<text x="290" y="100" class="v" text-anchor="middle" font-size="7" fill="#666">1kΩ+buf</text>
<text x="430" y="100" class="v" text-anchor="middle" font-size="7" fill="#666">1kΩ+buf</text>
</svg>