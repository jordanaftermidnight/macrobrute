<text x="475" y="485" class="label" text-anchor="middle" fill="#E65100">CV Routing & Modulation Notes</text>
<text x="70" y="510" class="label" font-size="8" fill="#E65100">Mod Matrix:</text>
<text x="160" y="510" class="value" font-size="8">MicroBrute's patch panel routes LFO/Env to different destinations using front-panel switches</text>
<text x="70" y="535" class="label" font-size="8" fill="#E65100">Attenuation:</text>
<text x="160" y="535" class="value" font-size="8">External CV inputs (from Expander) pass through attenuverter pots for level control</text>
<text x="70" y="560" class="label" font-size="8" fill="#E65100">Summing:</text>
<text x="160" y="560" class="value" font-size="8">Multiple CV sources sum at destination (e.g., Pitch = Keyboard + LFO + Pitch Bend + Expander)</text>
<text x="70" y="585" class="label" font-size="8" fill="#E65100">Vactrol:</text>
<text x="160" y="585" class="value" font-size="8">Resonance CV uses optocoupler (LED+LDR) for smooth, noise-free resonance control</text>
<text x="70" y="610" class="label" font-size="8" fill="#E65100">Protection:</text>
<text x="160" y="610" class="value" font-size="8">All CV inputs have 100kΩ series resistance + BAT54S clamping diodes to ±5V</text>
<text x="70" y="635" class="label" font-size="8" fill="#E65100">Range:</text>
<text x="160" y="635" class="value" font-size="8">MicroBrute expects 0-5V CV signals. External inputs are attenuated and clamped to this range</text>
<text x="70" y="660" class="label" font-size="8" fill="#E65100">Path:</text>
<text x="160" y="660" class="value" font-size="8">Sources → Mod Matrix (internal) OR DB-9 B (external) → Targets (VCO, VCF, VCA, etc.)</text></svg>