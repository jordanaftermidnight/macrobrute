<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="900" height="580" fill="#FEFEFE"/>
<text x="450" y="25" class="title" text-anchor="middle">M03 — Sine Extraction + Buffer</text>
<text x="450" y="42" class="subtitle" text-anchor="middle">Tap the triangle wave-shaper, buffer with TL074 spare section, output to new panel jack</text>
<text x="60" y="120" class="label" font-size="11">Triangle shaper output</text>
<text x="60" y="135" class="value" font-size="9">(post diode-clipper, quasi-sine ~3 Vpp)</text>
<line x1="60" y1="180" x2="220" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="220" y1="170" x2="220" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<line x1="232" y1="170" x2="232" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<text x="226" y="160" class="value" text-anchor="middle" font-size="8">1µF</text>
<line x1="232" y1="180" x2="280" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="295" y="174" width="30" height="12" fill="#FFFBE6" stroke="#999" rx="1"/>
<text x="310" y="183" class="value" text-anchor="middle" font-size="8">10k</text>
<line x1="325" y1="180" x2="380" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="390,150 390,210 450,180" class="component"/>
<text x="420" y="185" class="label" text-anchor="middle" font-size="9">TL074 (spare)</text>
<text x="387" y="162" class="pin" text-anchor="end">-</text>
<text x="387" y="198" class="pin" text-anchor="end">+</text>
<line x1="450" y1="180" x2="500" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="500" y1="180" x2="500" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="500" y1="220" x2="380" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="380" y1="220" x2="380" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="500" y1="180" x2="600" y2="180" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="640" cy="180" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="640" cy="180" r="5" fill="#1a1a1a"/>
<text x="640" y="158" class="label" text-anchor="middle" font-size="10">SINE OUT (panel)</text>
<text x="510" y="170" class="anno" font-size="9">~10 Vpp Eurorack</text>
<rect x="40" y="510" width="800" height="80" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="55" y="528" class="label" font-size="11" fill="#333">Parts</text>
<text x="55" y="548" class="value" font-size="9">• 1× TL074 spare section (already on the breakout — re-uses I6 spare op-amp slot)</text>
<text x="55" y="563" class="value" font-size="9">• 2× 10 kΩ (input + feedback), 1× 1 µF (DC-block), 1× 6 mm panel jack</text>
<text x="55" y="578" class="value" font-size="9">• Tap point is high-impedance — no PCB cuts, doesn't load the stock signal path</text>
<text x="55" y="593" class="value" font-size="9">• Adds a clean sine output to the MicroBrute's waveform palette</text></svg>