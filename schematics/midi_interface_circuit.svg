<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire { stroke: #1a1a1a; stroke-width: 1.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire:hover { stroke: #ff6600; stroke-width: 2.5; filter: drop-shadow(0 0 3px #ff6600); }
    .wire-thick { stroke: #1a1a1a; stroke-width: 2.5; fill: none; transition: all 0.2s; cursor: pointer; }
    .wire-thick:hover { stroke: #ff6600; stroke-width: 3.5; filter: drop-shadow(0 0 3px #ff6600); }
    .component { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .filled { fill: #1a1a1a; }
    .junction { fill: #0066CC; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0066CC"/>
  </marker>
</defs>
<rect width="1100" height="700" fill="#FEFEFE"/>
<text x="550" y="25" class="title" text-anchor="middle">MIDI Interfaces</text>
<text x="550" y="42" class="subtitle" text-anchor="middle">5-pin DIN → 6N138 → LPC2361 (stock Arturia) · Pico micro-USB → USB-MIDI (new)</text>
<rect x="30" y="60" width="1040" height="260" fill="#F5F5F5" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="5,5" rx="6"/>
<text x="550" y="80" class="label" text-anchor="middle" font-size="13">LANE A — Stock Arturia DIN-MIDI (unmodified)</text>
<text x="550" y="96" class="value" text-anchor="middle" font-size="9">Do NOT tap or reroute — this is the existing MicroBrute MIDI path. Mod does not touch it.</text>
<rect x="60" y="120" width="130" height="140" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="125.0" y="140" class="label" text-anchor="middle" font-size="11" fill="#1a1a1a">5-pin DIN IN</text>
<circle cx="125" cy="200" r="38" fill="none" stroke="#333" stroke-width="2"/>
<circle cx="125" cy="170" r="5" fill="#333"/>
<text x="135" y="173" class="value" font-size="8">2</text>
<circle cx="97" cy="188" r="5" fill="#333"/>
<text x="107" y="191" class="value" font-size="8">4</text>
<circle cx="153" cy="188" r="5" fill="#333"/>
<text x="163" y="191" class="value" font-size="8">5</text>
<circle cx="107" cy="218" r="5" fill="#333"/>
<text x="117" y="221" class="value" font-size="8">1</text>
<circle cx="143" cy="218" r="5" fill="#333"/>
<text x="153" y="221" class="value" font-size="8">3</text>
<text x="125" y="250" class="value" text-anchor="middle" font-size="9">Standard MIDI-IN</text>
<line x1="190" y1="188" x2="220" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="222" y="182" width="30" height="12" fill="#FFFBE6" stroke="#999"/>
<text x="237" y="192" class="value" text-anchor="middle" font-size="8">220Ω</text>
<line x1="252" y1="188" x2="290" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="290" y="130" width="180" height="160" fill="#F3E5F5" stroke="#6600CC" stroke-width="1.5" rx="4"/>
<text x="380.0" y="150" class="label" text-anchor="middle" font-size="11" fill="#6600CC">6N138 optocoupler</text>
<text x="380" y="175" class="value" text-anchor="middle" font-size="9">Pin 2: IR LED anode</text>
<text x="380" y="190" class="value" text-anchor="middle" font-size="9">Pin 3: IR LED cathode (to DIN pin 4 via 220Ω)</text>
<text x="380" y="215" class="value" text-anchor="middle" font-size="9">Pin 5: GND  Pin 8: +5V</text>
<text x="380" y="230" class="value" text-anchor="middle" font-size="9">Pin 6: open-collector output</text>
<text x="380" y="245" class="value" text-anchor="middle" font-size="8">→ 4.7kΩ pull-up to +5V</text>
<text x="380" y="265" class="value" text-anchor="middle" font-size="8">1N4148 across IR LED (anti-reverse)</text>
<line x1="470" y1="210" x2="520" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="495" y1="210" x2="495" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="480" y="160" width="30" height="20" fill="#FFFBE6" stroke="#999"/>
<text x="495" y="173" class="value" text-anchor="middle" font-size="8">4.7k</text>
<text x="495" y="153" class="value" text-anchor="middle" font-size="8" fill="#D44">+5V</text>
<rect x="540" y="130" width="200" height="160" fill="#E3F2FD" stroke="#0066CC" stroke-width="1.5" rx="4"/>
<text x="640.0" y="150" class="label" text-anchor="middle" font-size="11" fill="#0066CC">LPC2361 UART0 RX</text>
<text x="640" y="175" class="value" text-anchor="middle" font-size="9">P0.3 (pin 99)</text>
<text x="640" y="195" class="value" text-anchor="middle" font-size="9">31250 baud, 8N1</text>
<text x="640" y="215" class="value" text-anchor="middle" font-size="9">Stock Arturia firmware</text>
<text x="640" y="235" class="value" text-anchor="middle" font-size="8">handles SysEx, note on/off,</text>
<text x="640" y="250" class="value" text-anchor="middle" font-size="8">CC, program change, clock</text>
<text x="640" y="270" class="value" text-anchor="middle" font-size="8">Relays internal events to</text>
<text x="640" y="283" class="value" text-anchor="middle" font-size="8">Pico via UART1 bridge</text>
<line x1="740" y1="210" x2="820" y2="210" stroke="#0066CC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="170" width="220" height="80" fill="#E0F7FA" stroke="#00BCD4" stroke-width="1.5" rx="4"/>
<text x="930.0" y="190" class="label" text-anchor="middle" font-size="11" fill="#00BCD4">Pico UART0 bridge</text>
<text x="930" y="212" class="value" text-anchor="middle" font-size="9">GP0/GP1 @ 115200</text>
<text x="930" y="228" class="value" text-anchor="middle" font-size="8">Receives MIDI-as-SysEx</text>
<rect x="30" y="350" width="1040" height="260" fill="#FCE4EC" stroke="#E91E63" stroke-width="1.5" rx="6"/>
<text x="550" y="370" class="label" text-anchor="middle" font-size="13" fill="#E91E63">LANE B — Pico USB-MIDI (new, computer-facing)</text>
<text x="550" y="386" class="value" text-anchor="middle" font-size="9">Pico enumerates as a USB-MIDI class device. Host DAW/computer sees it as a MIDI port. Does NOT drive 5-pin DIN.</text>
<rect x="60" y="410" width="150" height="140" fill="#EEEEEE" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
<text x="135.0" y="430" class="label" text-anchor="middle" font-size="11" fill="#1a1a1a">Host computer / DAW</text>
<text x="135" y="450" class="value" text-anchor="middle" font-size="9">Ableton, Bitwig,</text>
<text x="135" y="465" class="value" text-anchor="middle" font-size="9">Reaper, etc.</text>
<text x="135" y="490" class="value" text-anchor="middle" font-size="8">USB host · macOS/Linux</text>
<text x="135" y="505" class="value" text-anchor="middle" font-size="8">detects Pico as MIDI dev</text>
<text x="135" y="525" class="value" text-anchor="middle" font-size="9">"Macrobrute Pico"</text>
<line x1="210" y1="480" x2="280" y2="480" stroke="#E91E63" stroke-width="3"/>
<text x="245" y="472" class="anno" text-anchor="middle" font-size="9" fill="#E91E63">USB 2.0</text>
<rect x="280" y="410" width="220" height="140" fill="#FFF0F5" stroke="#E91E63" stroke-width="1.5" rx="4"/>
<text x="390.0" y="430" class="label" text-anchor="middle" font-size="11" fill="#E91E63">Pico WH · micro-USB</text>
<rect x="300" y="440" width="40" height="20" fill="#E91E63" stroke="#AD1457"/>
<text x="320" y="454" class="value" text-anchor="middle" font-size="8" fill="#FFF">USB</text>
<text x="390" y="452" class="value" font-size="9">VBUS +5V → VSYS</text>
<text x="390" y="467" class="value" font-size="9">D+/D- → RP2040 USB PHY</text>
<text x="390" y="490" class="value" font-size="9">TinyUSB (MicroPython)</text>
<text x="390" y="505" class="value" font-size="9">exposes MIDI class device</text>
<text x="390" y="525" class="value" font-size="8" fill="#666">CDC-ACM optional for debug</text>
<rect x="540" y="410" width="240" height="140" fill="#FFF3E0" stroke="#CC6600" stroke-width="1.5" rx="4"/>
<text x="660.0" y="430" class="label" text-anchor="middle" font-size="11" fill="#CC6600">Pico firmware (usbmidi.py)</text>
<text x="660" y="450" class="value" text-anchor="middle" font-size="9">midi_in → menu / clock /</text>
<text x="660" y="465" class="value" text-anchor="middle" font-size="9">tap tempo / mode switch</text>
<text x="660" y="488" class="value" text-anchor="middle" font-size="9">midi_out ← events from</text>
<text x="660" y="503" class="value" text-anchor="middle" font-size="9">encoder / clock / LPC bridge</text>
<text x="660" y="525" class="value" text-anchor="middle" font-size="8" fill="#666">(to be implemented — issue #TBD)</text>
<line x1="780" y1="480" x2="830" y2="480" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="830" y="440" width="210" height="80" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.5" rx="4"/>
<text x="935.0" y="460" class="label" text-anchor="middle" font-size="11" fill="#0066CC">Optional: forward to LPC</text>
<text x="935" y="482" class="value" text-anchor="middle" font-size="9">Convert USB-MIDI event →</text>
<text x="935" y="497" class="value" text-anchor="middle" font-size="8">SysEx frame over UART1</text>
<text x="935" y="512" class="value" text-anchor="middle" font-size="8">(so DAW controls synth)</text>
<rect x="30" y="625" width="1040" height="60" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="4"/>
<text x="550" y="645" class="label" text-anchor="middle" font-size="11" fill="#E65100">Design Summary</text>
<text x="55" y="665" class="value" font-size="9">• DIN MIDI IN stays stock (LPC handles it). Pico USB-MIDI is additive — adds a second MIDI port for computer integration.</text>
<text x="55" y="680" class="value" font-size="9">• Optional bridge path: USB-MIDI received by Pico → SysEx frame → LPC → internal MicroBrute MIDI → DAW drives oscillator/filter/VCA remotely.</text></svg>