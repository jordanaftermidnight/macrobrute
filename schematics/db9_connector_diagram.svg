<rect x="50" y="680" width="920" height="120" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="65" y="700" class="value" font-size="9">• Ground strategy: single return at TP72 via DB-9 B pin 9. Do not duplicate via DB-9 A pin 9 (avoid loop).</text>
<text x="65" y="715" class="value" font-size="9">• Cable: shielded DB-9 (shell tied to shield drain on MB side only). Pin layout puts digital lines (1–4) physically apart from analog CV (5–6).</text>
<text x="65" y="730" class="value" font-size="9">• Digital crosstalk mitigation: ferrite beads on UART/I²C lines at the Pico end suppress HF emissions into adjacent CV pins.</text>
<text x="65" y="745" class="value" font-size="9">• I²C @ 100 kHz tolerates the ~30 cm cable length. 400 kHz is NOT recommended for this run.</text>
<text x="65" y="760" class="value" font-size="9">• Migrated to MB panel jacks (no longer in DB-9): Resonance CV (new jack), Sync In / Gate In / Ext Audio In (use stock MB back-panel jacks).</text>
<text x="65" y="775" class="value" font-size="9">• VGA HD-15 rejected — commodity VGA cables short pins 6/7/8 to GND, which would collide with our signal assignments.</text>
<text x="65" y="790" class="value" font-size="9">• All audio outputs buffered (TL072/TL074, unity gain). All CV inputs clamped to ±5V via BAT54S before op-amp stage.</text></svg>