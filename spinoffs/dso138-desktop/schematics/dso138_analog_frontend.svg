<text x="310.0" y="118" class="label" text-anchor="middle" font-size="11" fill="#CC6600">BAT54S ±5V clamp</text>
<text x="310" y="140" class="value" text-anchor="middle" font-size="9">Schottky pair</text>
<text x="310" y="156" class="value" text-anchor="middle" font-size="8">per channel</text>
<text x="310" y="175" class="value" text-anchor="middle" font-size="8">Limits DSO138 input</text>
<text x="310" y="190" class="value" text-anchor="middle" font-size="8">to safe ±5V range</text>
<rect x="420" y="130" width="220" height="290" fill="#F0E8FF" stroke="#6600CC" stroke-width="1.5" rx="4"/>
<text x="530.0" y="148" class="label" text-anchor="middle" font-size="11" fill="#6600CC">CD4051 8-ch mux</text>
<text x="530" y="170" class="value" text-anchor="middle" font-size="9">X0–X7 inputs</text>
<text x="530" y="185" class="value" text-anchor="middle" font-size="9">(pins 13,14,15,12,1,5,2,4)</text>
<text x="530" y="210" class="value" text-anchor="middle" font-size="9">A/B/C select pins</text>
<text x="530" y="225" class="value" text-anchor="middle" font-size="8">11 / 10 / 9</text>
<text x="530" y="250" class="value" text-anchor="middle" font-size="9">COM (pin 3) → out</text>
<text x="530" y="275" class="value" text-anchor="middle" font-size="9">VDD=+5V  VEE=-5V  VSS=GND</text>
<text x="530" y="295" class="value" text-anchor="middle" font-size="8">(bipolar signals need VEE)</text>
<text x="530" y="320" class="value" text-anchor="middle" font-size="9">INH (pin 6) → GND</text>
<text x="530" y="345" class="value" text-anchor="middle" font-size="9">Address source:</text>
<text x="530" y="360" class="value" text-anchor="middle" font-size="8">3× panel toggles OR</text>
<text x="530" y="375" class="value" text-anchor="middle" font-size="8">Pico GP16/17/18 via DB-9</text>
<text x="530" y="395" class="value" text-anchor="middle" font-size="8">(address 0-7 = 3 bits)</text>
<rect x="680" y="180" width="150" height="100" fill="#FFFFFF" stroke="#4A4" stroke-width="1.5" rx="4"/>
<text x="755.0" y="198" class="label" text-anchor="middle" font-size="11" fill="#4A4">TL072 buffer</text>
<text x="755" y="220" class="value" text-anchor="middle" font-size="9">Unity gain</text>
<text x="755" y="235" class="value" text-anchor="middle" font-size="8">follower</text>
<text x="755" y="255" class="value" text-anchor="middle" font-size="8">Isolates mux from</text>
<text x="755" y="270" class="value" text-anchor="middle" font-size="8">DSO138 input Z</text>
<rect x="860" y="170" width="160" height="130" fill="#E3F2FD" stroke="#0066CC" stroke-width="1.5" rx="4"/>
<text x="940.0" y="188" class="label" text-anchor="middle" font-size="11" fill="#0066CC">DSO138 BNC IN</text>
<text x="940" y="210" class="value" text-anchor="middle" font-size="9">Stock scope kit</text>
<text x="940" y="226" class="value" text-anchor="middle" font-size="8">STM32F103 based</text>
<text x="940" y="246" class="value" text-anchor="middle" font-size="9">1 MΩ / 20 pF</text>
<text x="940" y="260" class="value" text-anchor="middle" font-size="8">front-end input Z</text>
<text x="940" y="280" class="value" text-anchor="middle" font-size="8">Max ±50V with probe</text>
<line x1="220" y1="300" x2="420" y2="300" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320" y="290" class="anno" text-anchor="middle" font-size="9">8 protected inputs</text>
<line x1="640" y1="280" x2="680" y2="230" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="830" y1="230" x2="860" y2="230" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="460" height="200" fill="#FFF0F0" stroke="#D44" stroke-width="1.5" rx="4"/>
<text x="270.0" y="568" class="label" text-anchor="middle" font-size="11" fill="#D44">Power Regulation</text>
<text x="270" y="575" class="value" text-anchor="middle" font-size="10" fill="#B71C1C">DSO138 needs +9V (LM7809 from +12V)</text>
<text x="55" y="605" class="value" font-size="9">• +12V Eurorack → 1N5817 → LM7809 (TO-220) → +9V / 500mA</text>
<text x="55" y="623" class="value" font-size="9">• LM7809 heatsink: small TO-220 clip-on, dissipates ~1.5W</text>
<text x="55" y="641" class="value" font-size="9">• ±5V rails for CD4051 clamps: LM78L05 (+5V) and 79L05 (-5V) from ±12V</text>
<text x="55" y="659" class="value" font-size="9">• Decoupling: 100µF electrolytic + 100nF ceramic on every IC VCC/VEE pin</text>
<text x="55" y="677" class="value" font-size="9">• Backlight on DSO138 LCD: separate +5V tap (stock)</text>
<text x="55" y="695" class="value" font-size="9">• No mains isolation needed — Eurorack is already floating</text>
<rect x="520" y="550" width="500" height="200" fill="#F1F8E9" stroke="#4A4" stroke-width="1.5" rx="4"/>
<text x="770.0" y="568" class="label" text-anchor="middle" font-size="11" fill="#4A4">Module Build Notes</text>
<text x="770" y="575" class="value" text-anchor="middle" font-size="10" fill="#1B5E20">10HP Eurorack · panel: LCD cutout + 8 jacks + 3 toggles</text>
<text x="535" y="605" class="value" font-size="9">• DSO138 LCD (2.4" TFT) dominates panel: ~70×50mm cutout, bezel lip 3mm</text>
<text x="535" y="623" class="value" font-size="9">• 8× 3.5mm jacks vertically stacked on right side (55mm pitch = 5 HP)</text>
<text x="535" y="641" class="value" font-size="9">• 3× SPDT toggles for A/B/C mux address (manual mode)</text>
<text x="535" y="659" class="value" font-size="9">• Optional: 1× DB-9 for Pico-driven mux (automated probe-switching via UART cmds)</text>
<text x="535" y="677" class="value" font-size="9">• DSO138 kit button panel: exposed through side cutout or remote buttons</text>
<text x="535" y="695" class="value" font-size="9">• Separate module: does NOT share ground with breakout — isolated via ferrite at +12V.</text>
<text x="535" y="713" class="value" font-size="9">• All 8 inputs protected — safe to hot-patch Eurorack-level signals without fear.</text></svg>