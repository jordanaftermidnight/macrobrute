<rect x="40" y="580" width="920" height="180" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="500" y="600" class="label" text-anchor="middle" font-size="12">JF-33 Integration Notes</text>
<text x="55" y="622" class="value" font-size="9">• JF-33 PCB is stock (as purchased). Mods happen entirely on the Eurorack adapter board — no trace cuts on JF-33.</text>
<text x="55" y="639" class="value" font-size="9">• Level matching: JF-33 expects ~1Vpp instrument level. Eurorack audio is 10Vpp → ÷6 in, ×6 out restores level.</text>
<text x="55" y="656" class="value" font-size="9">• CV → delay time: 2N3904 emitter follower biases the PT2399 timing cap resistor (Rt). CV=0V → long delay, CV=+5V → short delay.</text>
<text x="55" y="673" class="value" font-size="9">• Anti-latch-up: 100Ω + diode on PT2399 pin 6 — PT2399 latches if Rt current exceeds spec. This is mandatory.</text>
<text x="55" y="690" class="value" font-size="9">• Feedback + dry/wet live on JF-33's stock pots. Optional: panel extension wires to larger pots for Eurorack ergonomics.</text>
<text x="55" y="707" class="value" font-size="9">• Bypass: SPDT toggle swaps OUT between dry input and wet output. For pop-free switching, use relay + anti-pop cap.</text>
<text x="55" y="724" class="value" font-size="9">• Panel size: 8HP Eurorack. Jacks: IN, OUT, CV. Pots: feedback, mix, CV amount. Switch: bypass.</text>
<text x="55" y="741" class="value" font-size="9">• Power budget: +12V ~40mA (PT2399 + NE5532 quiescent), -12V ~15mA (op-amp negative rail). Well within Eurorack norms.</text></svg>