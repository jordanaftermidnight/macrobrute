<text x="450.0" y="375.0" class="anno" text-anchor="middle" font-size="9">wet tap</text>
<line x1="320" y1="500" x2="340" y2="500" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
