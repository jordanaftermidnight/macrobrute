<text x="860" y="135" class="value" text-anchor="middle" font-size="9">1N5817 + ferrite</text>
<text x="860" y="150" class="value" text-anchor="middle" font-size="8">100µF + 100nF bulk</text>
<rect x="760" y="200" width="200" height="100" fill="#FFFFFF" stroke="#CC6600" stroke-width="1.5" rx="4"/>
<text x="860.0" y="218" class="label" text-anchor="middle" font-size="11" fill="#CC6600">LM78L05 → +5V</text>
<text x="860" y="240" class="value" text-anchor="middle" font-size="9">TO-92 regulator</text>
<text x="860" y="255" class="value" text-anchor="middle" font-size="8">input 100nF + out 10µF</text>
<text x="860" y="270" class="value" text-anchor="middle" font-size="8">feeds PT2399 VCC</text>
